<!doctype html>
<!-- Generated by experiments/thunderdome/build.mjs from examples/dialog/config.js. Edit the config, then rebuild. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Destructive Dialog Thunderdome</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Thunderdome engine styles. Page chrome only; contender styles belong in the config's config.css. */
:root{
  color-scheme:light;
  --bg:#F3F4F6; --panel:#FFFFFF; --ink:#15171C; --muted:#5A6170; --faint:#8A909C;
  --rule:#DCDFE5; --rule-strong:#C3C8D1; --hover:#EBEDF1; --win:#1F7A4D; --win-bg:#E3F3EA;
  --focus:#2F6FEB;
  --sans:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#101216; --panel:#181B21; --ink:#E6E8ED; --muted:#9AA1AE; --faint:#6F7684;
    --rule:#2A2F38; --rule-strong:#3A404B; --hover:#20242B; --win:#6FD39F; --win-bg:#16291F;
    --focus:#7AA7FF;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#101216; --panel:#181B21; --ink:#E6E8ED; --muted:#9AA1AE; --faint:#6F7684;
  --rule:#2A2F38; --rule-strong:#3A404B; --hover:#20242B; --win:#6FD39F; --win-bg:#16291F;
  --focus:#7AA7FF;
}
*{box-sizing:border-box}
/* A class selector outranks the UA's [hidden] rule, so anything the engine hides by
   property (the views, Undo, Replay) needs this or it stays on screen. Scoped to the two
   places the engine does it, so a config's own [hidden] handling is left alone. */
.td-view[hidden],.td-vote button[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);padding-inline:16px;padding-block:20px 64px}
.td-wrap{max-width:1080px;margin:0 auto;display:grid;gap:14px}
.td-head{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.td-view{display:grid;gap:18px}
.td-tabs{display:flex;gap:4px;flex:none}
.td-tab{font-size:13px;color:var(--muted);text-decoration:none;padding:5px 13px;border-radius:999px;border:1px solid transparent;white-space:nowrap}
.td-tab:hover{color:var(--ink);background:var(--hover)}
.td-tab:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.td-tab[aria-current=page]{color:var(--ink);background:var(--panel);border-color:var(--rule-strong)}
/* One dome, several decisions. Reads as a row of questions rather than a second set of
   pill tabs, so it does not compete with Vote/Results for the same glance. */
.td-qnav{display:flex;flex-wrap:wrap;gap:0 18px;border-bottom:1px solid var(--rule)}
.td-qtab{font-size:13.5px;color:var(--muted);text-decoration:none;padding:7px 1px;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.td-qtab:hover{color:var(--ink)}
.td-qtab:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.td-qtab[aria-current=page]{color:var(--ink);font-weight:500;border-bottom-color:var(--ink)}
.td-wrap h1{font-size:26px;font-weight:600;letter-spacing:-.01em;margin:0;text-wrap:balance}
.td-wrap h2{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0}
.td-section{display:grid;gap:10px}
.td-lede{color:var(--muted);max-width:68ch;margin:0;font-size:14px}
.td-lede code{font-family:var(--mono);font-size:13px}
.td-arena{border:1px solid var(--rule);border-radius:10px;background:var(--panel)}
.td-arena>summary{display:flex;gap:9px;align-items:center;padding:8px 14px;cursor:pointer;font-size:13px;list-style:none}
.td-arena>summary::-webkit-details-marker{display:none}
.td-arena>summary::before{content:"";flex:none;width:0;height:0;border:4px solid transparent;border-left-color:var(--faint);transition:transform .15s}
.td-arena[open]>summary::before{transform:rotate(90deg)}
.td-arena>summary:focus-visible{outline:2px solid var(--focus);outline-offset:-2px;border-radius:10px}
.td-arena-label{color:var(--muted)}
.td-arena[open]>summary{border-bottom:1px solid var(--rule)}
.td-controls{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;padding:12px 14px}
.td-controls label{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.td-controls select{font:inherit;font-size:13px;color:var(--ink);background:var(--bg);border:1px solid var(--rule-strong);border-radius:6px;padding:4px 8px}
.td-controls input[type=checkbox]{accent-color:var(--ink)}
.td-arena-tag{font-family:var(--mono);font-size:12px;color:var(--faint);margin-left:auto}
.td-duel{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.td-card{background:var(--panel);border:1px solid var(--rule);border-radius:12px;padding:14px;display:grid;gap:12px;align-content:start;min-width:0}
.td-card.picked{border-color:var(--win);box-shadow:0 0 0 2px var(--win-bg)}
.td-card.td-live{cursor:pointer}
.td-card.td-live:hover{border-color:var(--rule-strong);background:var(--hover)}
.td-card.td-live:hover .td-side-key{color:var(--ink);border-color:var(--rule-strong)}
/* Clicks land on the card, not on whatever the mock happens to contain. Configs whose
   contenders are meant to be poked at set interactiveCards and keep their own events. */
.td-card.td-live .td-card-body{pointer-events:none}
/* Except the player's own controls. Under prefers-reduced-motion nothing autoplays and
   these are the only way to watch a clip at all, so swallowing the play button would
   leave the duel unwatchable and turn the attempt into a vote. */
.td-card.td-live .td-card-body video[controls],.td-card.td-live .td-card-body audio[controls]{pointer-events:auto}
.td-card-head{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.td-card-name{font-weight:600;font-size:15px}
.td-card-note{font-size:12.5px;color:var(--muted)}
.td-card-body{min-width:0}
.td-media{display:grid;place-items:center;min-width:0;min-height:72px;border-radius:8px;overflow:hidden}
.td-media.td-framed{background:var(--bg);border:1px solid var(--rule)}
.td-media>img,.td-media>video{display:block;width:100%;height:auto;max-height:min(52vh,440px);background:transparent}
.td-media>video[controls]{max-height:min(48vh,400px)}
.td-gallery .td-media>img,.td-gallery .td-media>video{max-height:220px}
.td-media.td-media-broken{background:var(--bg);border:1px dashed var(--rule-strong)}
.td-media-fail{display:grid;gap:4px;justify-items:center;text-align:center;padding:20px 14px;font-size:12.5px;color:var(--muted)}
.td-media-fail b{color:var(--ink);font-weight:500}
.td-media-fail code{font-family:var(--mono);font-size:11px;color:var(--faint);word-break:break-all}
.td-side-key{font-family:var(--mono);font-size:11px;color:var(--faint);border:1px solid var(--rule);border-radius:4px;padding:0 5px}
.td-vote{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center}
.td-vote button{font:inherit;font-size:14px;font-weight:500;color:var(--ink);background:var(--panel);border:1px solid var(--rule-strong);border-radius:8px;padding:8px 16px;cursor:pointer}
.td-vote button:hover{background:var(--hover)}
.td-vote button:disabled{opacity:.45;cursor:not-allowed;background:var(--panel)}
.td-vote button:focus-visible,.td-controls select:focus-visible,.td-controls input:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.td-vote button.primary{border-color:var(--ink)}
.td-vote button.quiet{border-color:transparent;color:var(--muted)}
.td-vote kbd{font-family:var(--mono);font-size:11px;color:var(--faint);margin-left:6px}
.td-status{font-size:12.5px;color:var(--muted);text-align:center;min-height:1.5em}
.td-two{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:28px;align-items:start}
.td-table-wrap{overflow-x:auto;background:var(--panel);border:1px solid var(--rule);border-radius:12px}
.td-table-wrap table{border-collapse:collapse;width:100%;font-size:13.5px}
.td-table-wrap th,.td-table-wrap td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--rule);white-space:nowrap}
.td-table-wrap tr:last-child td{border-bottom:0}
.td-table-wrap th{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.td-table-wrap td.num,.td-table-wrap th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.td-table-wrap td.rank{font-family:var(--mono);color:var(--faint);width:1%}
.td-swatch{display:inline-block;width:34px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:8px}
.td-lead{color:var(--win);font-weight:600}
.td-feed{display:grid;gap:6px;font-size:13px;color:var(--muted);margin:0;padding:0;list-style:none}
.td-feed li{display:flex;gap:8px;flex-wrap:wrap}
.td-feed b{color:var(--ink);font-weight:500}
.td-feed .when{font-family:var(--mono);font-size:11.5px;color:var(--faint);margin-left:auto}
.td-gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:12px}
.td-gallery .td-card{padding:12px;gap:8px}
.td-empty{color:var(--faint);font-size:13px;padding:12px}
@media (max-width:760px){
  .td-duel,.td-two{grid-template-columns:1fr}
  .td-arena-tag{margin-left:0}
  /* One column, so "left" is the card on top and the arrow points at nothing. */
  .td-side-arrow{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---- examples/dialog/config.css ---- */
/* Contender styles for examples/dialog. The engine styles the page; this styles the
   thing being judged. Two surfaces and a compact toggle, driven by the arena classes. */
.arena{
  --paper:#FFFFFF; --ink:#16181D; --sub:#5B6270; --edge:#E1E4EA;
  --danger:#C2372B; --danger-soft:#FBEBE9; --accent:#2F6FEB;
  background:#EDEFF3;padding:22px;border-radius:8px;display:grid;place-items:center;
  font:14px/1.5 var(--sans);
}
.arena.slate{
  --paper:#1B1E25; --ink:#E7E9EE; --sub:#9AA1AE; --edge:#2E333D;
  --danger:#F0776A; --danger-soft:#2A1C1B; --accent:#7AA7FF;
  background:#12141A;
}
.dlg{
  width:min(100%,360px);background:var(--paper);color:var(--ink);
  border:1px solid var(--edge);border-radius:10px;
  box-shadow:0 10px 28px rgba(12,14,20,.14);overflow:hidden;
}
.dlg-body{padding:18px 18px 14px}
.arena.compact .dlg-body{padding:13px 14px 10px}
.dlg-body h3{margin:0 0 6px;font-size:15.5px;font-weight:600;letter-spacing:-.01em}
.dlg-body p{margin:0;color:var(--sub);font-size:13.5px}
.dlg-foot{display:flex;justify-content:flex-end;gap:8px;padding:0 18px 16px}
.arena.compact .dlg-foot{padding:0 14px 12px}
.dlg-foot .split-left{margin-right:auto}
.dlg-foot .stack{display:grid;gap:8px;width:100%}
.b{
  font:inherit;font-size:13.5px;font-weight:500;padding:7px 14px;border-radius:7px;
  border:1px solid transparent;cursor:pointer;background:transparent;color:var(--ink);
}
.arena.compact .b{padding:5px 11px;font-size:13px}
.b.ghost{color:var(--sub);border-color:var(--edge)}
.b.solid{background:var(--accent);color:#fff}
.b.danger{background:var(--danger);color:#fff}
.arena.slate .b.danger{color:#1B1E25}
.b.danger-outline{color:var(--danger);border-color:var(--danger)}
.b.danger-text{color:var(--danger);background:var(--danger-soft)}

</style>

<body>
<noscript>This page needs JavaScript to run the duels.</noscript>
<script>
/*
 * Thunderdome: pairwise design judgment with a shared Elo table.
 *
 * A config calls Thunderdome.start({...}) with contenders, arena dimensions,
 * an optional split, and a render function. The engine supplies pairing,
 * voting UI, keyboard shortcuts, Elo (overall and per split), W-L-T, recent
 * bouts, the gallery, undo, and shared (claude.ai db) or local storage.
 * A contender can be an image, a GIF or a video instead of markup; the two
 * clips in a duel are restarted together so the comparison stays honest.
 * See ../README.md for the config reference.
 */
(function (root) {
  "use strict";

  const RESERVED = new Set(["id", "a", "b", "w", "t", "q"]);
  const VIEWS = new Set(["vote", "results"]);

  // ---------- pure core (no DOM; exercised by test.mjs) ----------

  function pairKey(a, b) { return [a, b].sort().join("|"); }

  function pairCounts(votes) {
    const c = {};
    for (const v of votes) { const k = pairKey(v.a, v.b); c[k] = (c[k] || 0) + 1; }
    return c;
  }

  // Weighted random pair: weight 1/(1+n)^2 where n is how often the pair has met.
  // Never repeats the previous pair when another exists. Returns {a, b, key} with sides shuffled.
  function pickPair(ids, votes, lastKey, rand) {
    rand = rand || Math.random;
    const counts = pairCounts(votes), pairs = [];
    for (let i = 0; i < ids.length; i++) for (let j = i + 1; j < ids.length; j++) {
      const k = pairKey(ids[i], ids[j]);
      if (k === lastKey && ids.length > 2) continue;
      pairs.push({ k, a: ids[i], b: ids[j], w: 1 / Math.pow(1 + (counts[k] || 0), 2) });
    }
    if (!pairs.length) return null;
    let r = rand() * pairs.reduce((s, p) => s + p.w, 0), chosen = pairs[0];
    for (const p of pairs) { r -= p.w; if (r <= 0) { chosen = p; break; } }
    return rand() < .5 ? { a: chosen.a, b: chosen.b, key: chosen.k } : { a: chosen.b, b: chosen.a, key: chosen.k };
  }

  // Sequential Elo over votes in time order. Every contender starts at `start`.
  function elo(ids, votes, k, start) {
    k = k || 24; start = start || 1500;
    const r = Object.fromEntries(ids.map(id => [id, start]));
    for (const v of votes) {
      if (!(v.a in r) || !(v.b in r) || v.a === v.b) continue;
      const ea = 1 / (1 + Math.pow(10, (r[v.b] - r[v.a]) / 400));
      const sa = v.w === "a" ? 1 : v.w === "b" ? 0 : .5;
      r[v.a] += k * (sa - ea); r[v.b] += k * ((1 - sa) - (1 - ea));
    }
    return r;
  }

  function records(ids, votes) {
    const rec = Object.fromEntries(ids.map(id => [id, { w: 0, l: 0, t: 0 }]));
    for (const v of votes) {
      if (!rec[v.a] || !rec[v.b]) continue;
      if (v.w === "tie") { rec[v.a].t++; rec[v.b].t++; }
      else if (v.w === "a" || v.w === "b") {
        const win = v.w === "a" ? v.a : v.b, lose = v.w === "a" ? v.b : v.a;
        rec[win].w++; rec[lose].l++;
      }
    }
    return rec;
  }

  function ago(t, now) {
    const s = Math.max(0, ((now || Date.now()) - t) / 1000);
    if (s < 60) return "just now";
    if (s < 3600) return `${Math.floor(s / 60)}m ago`;
    if (s < 86400) return `${Math.floor(s / 3600)}h ago`;
    return `${Math.floor(s / 86400)}d ago`;
  }

  const VIDEO_EXT = /\.(mp4|webm|mov|m4v|ogv)(?:[?#]|$)/i;

  // A contender's `media` becomes {kind, src, poster, alt, fit, loop, aspect}.
  // Accepts "shot.png" or {src, ...}; `defaults` is the config-level `media` block.
  // The kind is read off the extension, so a data URI or an extension-less URL
  // (a signed CI artifact link, say) needs an explicit `kind` or it renders as an image.
  function mediaSpec(media, defaults) {
    if (typeof media === "string") media = { src: media };
    if (!media || !media.src) return null;
    const d = defaults || {}, src = String(media.src);
    return {
      kind: media.kind || d.kind || (VIDEO_EXT.test(src) || /^data:video\//i.test(src) ? "video" : "img"),
      src,
      poster: media.poster || d.poster || null,
      alt: media.alt == null ? (d.alt || "") : media.alt,
      fit: media.fit || d.fit || "contain",
      loop: (media.loop == null ? d.loop : media.loop) !== false,
      aspect: media.aspect || d.aspect || null,
      // Off by default: most media is an opaque screenshot or clip that brings its own
      // surface, and a box around it reads as a second card. Turn it on for icons and
      // anything else with transparency to sit on.
      frame: media.frame == null ? !!d.frame : !!media.frame,
    };
  }

  function normalize(cfg) {
    if (!cfg || !cfg.id) throw new Error("Thunderdome: config needs an id");
    const contenders = (cfg.contenders || []).map(c => ({ note: "", ...c }));
    if (contenders.length < 2) throw new Error("Thunderdome: need at least two contenders");
    const seen = new Set();
    for (const c of contenders) {
      if (!c.id || seen.has(c.id)) throw new Error(`Thunderdome: contender ids must be unique and non-empty (${c.id})`);
      seen.add(c.id);
    }
    const dims = ((cfg.arena && cfg.arena.dimensions) || cfg.dimensions || []).map(d => {
      if (RESERVED.has(d.id)) throw new Error(`Thunderdome: dimension id "${d.id}" is reserved`);
      const type = d.type || (d.options ? "select" : "toggle");
      return { label: d.id, ...d, type, shuffle: d.shuffle ?? (type === "select") };
    });
    return {
      k: 24, recent: 8, collection: "votes", contenderLabel: "Contender",
      galleryTitle: "Everyone in this arena", media: {}, interactiveCards: false,
      ...cfg,
      contenders, dims,
      localKey: cfg.localKey || `thunderdome:${cfg.id}:local`,
    };
  }

  // Arena ids ({theme:"x", ic:true}) to the object render() sees ({theme:{id,name,...}, ic:true, ids}).
  // strict: unknown option ids resolve to null (used for stored votes); otherwise the first option.
  function resolveArena(C, ids, strict) {
    const arena = { ids: {} };
    for (const d of C.dims) {
      if (d.type === "select") {
        const o = d.options.find(x => x.id === ids[d.id]) || (strict ? null : d.options[0]);
        arena[d.id] = o; arena.ids[d.id] = o ? o.id : ids[d.id];
      } else {
        arena[d.id] = !!ids[d.id]; arena.ids[d.id] = !!ids[d.id];
      }
    }
    return arena;
  }

  function splitOf(C, arena) {
    if (!C.split) return null;
    try { return C.split.of(arena); } catch (e) { return null; }
  }

  // One dome, several decisions. A question brings its own contenders and its own words
  // and inherits everything else, so the arena, the media defaults and the render
  // function are written once no matter how many questions hang off them. The arena and
  // the K factor stay at the dome level on purpose: questions asked in different
  // contexts are different pages, not tabs.
  //
  // A dome with no `questions` is a dome with one anonymous question, which is what
  // every config written so far is. Its votes are stored exactly as before.
  function normalizeDome(cfg) {
    if (!cfg || !cfg.id) throw new Error("Thunderdome: config needs an id");
    const list = Array.isArray(cfg.questions) ? cfg.questions : null;
    if (list && !list.length) throw new Error("Thunderdome: questions is an empty list");
    const { questions, ...dome } = cfg;
    // The dome is validated against the first question's contenders so the arena, the
    // storage keys and the split are read and checked in one place.
    const D = normalize(list ? { ...dome, contenders: list[0].contenders || dome.contenders } : cfg);
    const seen = new Set();
    D.questions = (list || [{}]).map(q => {
      const id = list ? String(q.id || "").toLowerCase() : null;
      if (list) {
        if (!id) throw new Error("Thunderdome: every question needs an id");
        if (VIEWS.has(id)) throw new Error(`Thunderdome: "${id}" is a view name, so it cannot be a question id`);
        if (seen.has(id)) throw new Error(`Thunderdome: question ids must be unique (${id})`);
        seen.add(id);
      }
      const Q = normalize({ ...dome, ...q, id: id ? `${cfg.id}-${id}` : cfg.id });
      return {
        id,
        // Read off the question itself, not the merge: inheriting the dome's title would
        // label every tab with the same words.
        label: q.short || q.title || id,
        title: q.title || "", lede: Q.lede || "",
        galleryTitle: Q.galleryTitle, contenderLabel: Q.contenderLabel, contenders: Q.contenders,
      };
    });
    D.multi = !!list;
    return D;
  }

  // The hash carries the question and the view, in either order and both optional:
  //   #results           the results of a one-question dome
  //   #density           the density question, voting
  //   #density/results   its table, which is the link you paste into the issue
  // A segment that is neither is ignored rather than treated as a question that is not
  // there, so an old link to a renamed question still opens the dome.
  function parseHash(hash, qids) {
    let q = null, view = "vote";
    for (const raw of String(hash || "").replace(/^#/, "").split("/")) {
      let p = raw;
      try { p = decodeURIComponent(raw); } catch (e) { /* keep the raw segment */ }
      p = p.toLowerCase();
      if (VIEWS.has(p)) view = p;
      else if (!q && (qids || []).indexOf(p) >= 0) q = p;
    }
    return { q, view };
  }

  function hashFor(q, view) {
    return "#" + (q ? encodeURIComponent(q) + "/" : "") + (view === "results" ? "results" : "vote");
  }

  // ---------- DOM ----------

  function h(tag, attrs, ...kids) {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v == null || v === false) continue;
      if (k === "class") el.className = v;
      else if (k === "text") el.textContent = v;
      else if (k === "html") el.innerHTML = v;
      else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? "" : v);
    }
    for (const kid of kids) if (kid != null) el.append(kid);
    return el;
  }

  function toNode(x) {
    if (x instanceof Node) return x;
    const t = document.createElement("template");
    t.innerHTML = String(x == null ? "" : x);
    return t.content;
  }

  function reducedMotion() {
    return typeof matchMedia === "function" && matchMedia("(prefers-reduced-motion: reduce)").matches;
  }

  // Said on a card that could not be drawn, and on one whose media 404s.
  function failNode(title, detail) {
    return h("div", { class: "td-media td-media-broken" },
      h("div", { class: "td-media-fail" }, h("b", { text: title }), detail ? h("code", { text: detail }) : null));
  }

  // One <img> or <video> in a box that holds its shape. A card whose height changes
  // between duels moves the thing you are about to click, so give media an `aspect`
  // whenever you can.
  function mediaNode(spec, label) {
    const box = h("div", { class: "td-media" + (spec.frame ? " td-framed" : "") });
    const style = `object-fit:${spec.fit}` + (spec.aspect ? `;aspect-ratio:${spec.aspect}` : "");
    // Name what failed. For an inlined data URI the path is long gone, so say that
    // instead of printing 70 characters of base64 at someone.
    const where = /^data:/i.test(spec.src)
      ? `${spec.src.slice(0, spec.src.indexOf(";")) || "data:"}, inlined at build time`
      : (spec.src.length > 72 ? spec.src.slice(0, 69) + "..." : spec.src);
    const fail = () => {
      box.classList.add("td-media-broken");
      box.replaceChildren(h("div", { class: "td-media-fail" },
        h("b", { text: "Couldn't load this one." }), h("code", { text: where })));
      // Tells the duel to take the vote buttons off: this card is no longer a fair half
      // of the comparison, and a vote cast on it is bad data.
      box.dispatchEvent(new CustomEvent("td-media-fail", { bubbles: true }));
    };
    let el;
    if (spec.kind === "video") {
      el = h("video", { src: spec.src, poster: spec.poster, loop: spec.loop, muted: true,
        playsinline: true, preload: "auto", style, "aria-label": spec.alt || label });

      // Reduced motion: hand over the controls instead of moving things at them.
      if (reducedMotion()) el.controls = true; else el.autoplay = true;
    } else {
      el = h("img", { src: spec.src, alt: spec.alt || label, loading: "lazy", decoding: "async", style });
    }
    // A blank card still looks votable, and a vote cast on one is bad data. Say it failed.
    el.addEventListener("error", fail);
    box.append(el);
    return box;
  }

  function start(cfg) {
    const C = normalizeDome(cfg);
    const qids = C.questions.map(q => q.id);
    const mount = (C.mount && document.querySelector(C.mount)) || document.body;

    // The question is a fourth thing that can change, next to the arena, the duel and the
    // view. Switching one swaps the contenders and the slice of the table they are scored
    // against; everything else on the page is the dome's and stays where it is.
    let Q = C.questions[0];
    let ids = [], byId = {};
    function setQuestionData() {
      ids = Q.contenders.map(c => c.id);
      byId = Object.fromEntries(Q.contenders.map(c => [c.id, c]));
    }
    setQuestionData();
    // Votes are stored per dome and tagged with `q`, so one shared table serves every
    // question and one snapshot keeps them all live. A dome with one anonymous question
    // writes no tag at all, which is what every config written before this did.
    // Always a fresh array: callers sort it in place.
    const qVotes = () => C.multi ? votes.filter(v => v.q === Q.id) : votes.slice();

    let arenaIds = {};
    for (const d of C.dims) arenaIds[d.id] = d.type === "select" ? (d.default ?? d.options[0].id) : !!d.default;
    let duel = null, lastKey = "";
    let votes = [];
    let votesCol = null, shared = false, myLast = null;
    let note = "", noteTimer = 0, stickyNote = "", lockNote = "";
    let syncToken = 0, galleryIO = null, galleryKey = null, galleryDirty = true, view = "vote";

    // The tab title follows the question, so a link someone pasted into an issue says
    // which decision it opens without them having to read the page.
    function setDocTitle() {
      const base = C.title || C.id;
      document.title = C.multi ? `${base} · ${Q.label}` : base;
    }

    // ---- layout ----
    const $ = {};
    const controls = h("div", { class: "td-controls" });
    for (const d of C.dims) {
      const idAttr = `td-dim-${d.id}`;
      if (d.type === "select") {
        const sel = h("select", { id: idAttr });
        for (const o of d.options) sel.append(new Option(o.name, o.id));
        sel.addEventListener("change", e => { arenaIds[d.id] = e.target.value; if ($.shuffle) $.shuffle.checked = false; render(); });
        $[idAttr] = sel;
        controls.append(h("label", { for: idAttr }, d.label + " ", sel));
      } else {
        const box = h("input", { type: "checkbox", id: idAttr });
        box.addEventListener("change", e => { arenaIds[d.id] = e.target.checked; render(); });
        $[idAttr] = box;
        controls.append(h("label", { for: idAttr }, box, " " + d.label));
      }
    }
    if (C.dims.some(d => d.shuffle)) {
      $.shuffle = h("input", { type: "checkbox", id: "td-shuffle", checked: C.shuffle !== false });
      controls.append(h("label", { for: "td-shuffle" }, $.shuffle, " New arena each duel"));
    }
    $.tag = h("span", { class: "td-arena-tag" });
    controls.append($.tag);

    $.duel = h("section", { class: "td-duel", "aria-live": "polite" });
    // Media that fails to load does so long after render(), so it reports back.
    $.duel.addEventListener("td-media-fail", () => refreshVoteLock());
    // The digits and space do the same job as the arrows, for a hand that never
    // leaves the number row. Only one key per button is printed; the rest are in
    // the title so the row of buttons stays a row of buttons.
    // Blur on the way out. A vote button that keeps focus turns the next space into
    // "press me again", so space would mean tie until you used the mouse and a left win
    // afterwards, silently and in the wrong direction. Nothing in the row wants focus
    // once it has been clicked: the keys below take over from here.
    // `detail` is 0 when the click came from Enter or space on a focused button, so a
    // keyboard user keeps their place in the tab order and only the mouse gives up focus.
    const click = w => e => { if (e.detail && e.currentTarget.blur) e.currentTarget.blur(); vote(w); };
    $.voteA = h("button", { class: "primary", title: "Left wins (← or 1)", onclick: click("a") }, "Left wins", h("kbd", { text: "←" }));
    $.voteTie = h("button", { title: "Tie (↓, 3 or space)", onclick: click("tie") }, "Tie", h("kbd", { text: "↓" }));
    $.voteB = h("button", { class: "primary", title: "Right wins (→ or 2)", onclick: click("b") }, "Right wins", h("kbd", { text: "→" }));
    $.skip = h("button", { class: "quiet", onclick: () => nextDuel() }, "Skip", h("kbd", { text: "S" }));
    $.undo = h("button", { class: "quiet", hidden: true, onclick: () => undo() }, "Undo my last vote", h("kbd", { text: "U" }));
    $.replay = h("button", { class: "quiet", hidden: true, onclick: () => syncDuelVideos(true) }, "Replay both", h("kbd", { text: "R" }));
    $.status = h("div", { class: "td-status", role: "status" });

    const splitVals = C.split ? C.split.values : [];
    $.headName = h("th");
    const headRow = h("tr", {}, h("th"), $.headName, h("th", { class: "num", text: "Elo" }),
      ...splitVals.map(s => h("th", { class: "num", text: s.label })),
      h("th", { class: "num", text: "W–L–T" }));
    $.standings = h("tbody");
    $.feed = h("ul", { class: "td-feed" });
    $.gallery = h("div", { class: "td-gallery" });

    // Two views, not one long page. Landing on the link should put you in front of a
    // duel, not above the fold of a document you have to scroll past to reach the work.
    // They are plain hash links so the results are as shareable as the dome itself.
    $.tabVote = h("a", { class: "td-tab", href: "#vote", text: "Vote" });
    $.tabResults = h("a", { class: "td-tab", href: "#results" });

    // One tab per question, and each one is a link, so "the density one" is a URL you can
    // paste rather than a click path you have to describe.
    $.qTabs = C.questions.map(q => h("a", { class: "td-qtab", href: hashFor(q.id, "vote"), text: q.label }));
    $.qNav = C.multi
      ? h("nav", { class: "td-qnav", "aria-label": "Question" }, ...$.qTabs)
      : null;
    $.qLede = h("p", { class: "td-lede" });

    // The arena bar is context, not a control you touch every duel: collapsed to its
    // tag line, one click from open. <details> so the keyboard and AT get it for free.
    $.arenaBox = h("details", { class: "td-arena" },
      h("summary", {}, h("span", { class: "td-arena-label", text: "Arena" }), $.tag), controls);

    $.viewVote = h("section", { class: "td-view" },
      C.dims.length ? $.arenaBox : null,
      $.duel,
      h("div", { class: "td-vote" }, $.voteA, $.voteTie, $.voteB, $.skip, $.replay, $.undo),
      $.status);

    $.viewResults = h("section", { class: "td-view", hidden: true },
      h("div", { class: "td-two" },
        h("section", { class: "td-section" }, h("h2", { text: "Standings" }),
          h("div", { class: "td-table-wrap" }, h("table", {}, h("thead", {}, headRow), $.standings))),
        h("section", { class: "td-section" }, h("h2", { text: "Recent bouts" }), $.feed)),
      h("section", { class: "td-section" }, $.galleryHead = h("h2"), $.gallery));

    const wrap = h("div", { class: "td-wrap" },
      h("header", { class: "td-head" },
        h("h1", { text: C.title || C.id }),
        h("nav", { class: "td-tabs", "aria-label": "View" }, $.tabVote, $.tabResults)),
      $.qNav, $.qLede,
      $.viewVote, $.viewResults);
    mount.append(wrap);

    // Everything on the page that names the question rather than the dome. The lede is
    // the question's own if it set one, and the dome's if it did not, so a dome whose
    // questions are variations on one idea writes the explanation once.
    function renderQuestion() {
      const lede = Q.lede || "";
      $.qLede.innerHTML = lede;
      $.qLede.hidden = !lede;
      $.headName.textContent = Q.contenderLabel;
      $.galleryHead.textContent = Q.galleryTitle;
      setDocTitle();
    }

    // A question tab carries the view you are on, so moving from one table to the next
    // does not drop you back into voting. It has to be resynced on a view change too,
    // not just on a question change, or the tabs point at the view you just left.
    function syncQTabs() {
      for (let i = 0; i < $.qTabs.length; i++) {
        const on = C.questions[i].id === Q.id;
        $.qTabs[i].setAttribute("aria-current", on ? "page" : "false");
        $.qTabs[i].href = hashFor(C.questions[i].id, view);
      }
    }

    // The hash is the whole router: which question, and which of its two views. Both the
    // question tabs and the view tabs are plain links into it, so back and forward work
    // across questions for free and any state worth talking about has a URL.
    function goto(qid, v, booting) {
      const moved = C.multi && qid != null && qid !== Q.id;
      if (moved) {
        Q = C.questions[qids.indexOf(qid)];
        setQuestionData();
        duel = null; lastKey = ""; myLast = null; $.undo.hidden = true;
        galleryDirty = true;
      }
      view = v === "results" ? "results" : "vote";
      $.viewVote.hidden = view !== "vote";
      $.viewResults.hidden = view !== "results";
      $.tabVote.setAttribute("aria-current", view === "vote" ? "page" : "false");
      $.tabResults.setAttribute("aria-current", view === "results" ? "page" : "false");
      $.tabVote.href = hashFor(Q.id, "vote");
      $.tabResults.href = hashFor(Q.id, "results");
      syncQTabs();
      // A question you just arrived at has no duel yet, and nextDuel renders one.
      if (moved || booting) { renderQuestion(); nextDuel(); renderStandings(); }
      if (!flushGallery()) tuneGalleryVideos();   // a rebuild tunes on its way out
      tuneDuelVideos();
    }
    const fromHash = () => parseHash(location.hash, qids);
    window.addEventListener("hashchange", () => { const r = fromHash(); goto(r.q, r.view); });

    // ---- rendering ----
    function arena() { return resolveArena(C, arenaIds, false); }

    function defaultTag(a) {
      return C.dims.filter(d => d.type === "select").map(d => a[d.id].name.toLowerCase())
        .concat(C.dims.filter(d => d.type === "toggle" && a[d.id]).map(d => d.short || d.label))
        .join(" · ");
    }

    function describe(v) {
      if (C.describe) return C.describe(resolveArena(C, v, true), v);
      const parts = [];
      for (const d of C.dims) {
        if (d.type === "select") { const o = d.options.find(x => x.id === v[d.id]); parts.push(o ? o.name : String(v[d.id] ?? "?")); }
        else if (v[d.id]) parts.push(d.short || d.label);
      }
      return parts.join(", ");
    }

    // c.media may be a string, an object, or a function of the arena, so one contender
    // can hold its light and dark recordings and hand over whichever the arena asked for.
    function mediaFor(c, a) {
      let m = c.media;
      if (typeof m === "function") m = m(a, { h });
      const spec = mediaSpec(m, C.media);
      return spec ? mediaNode(spec, c.note ? `${c.name}: ${c.note}` : c.name) : null;
    }

    function renderBody(c, a) {
      const ctx = { h, contender: c, media: (x, ar) => mediaFor(x || c, ar || a) };
      // Most specific first: contender.render, then config.render, then media, then c.html.
      // A config-wide render() wins over media so it can place the frame itself
      // (device chrome, a caption) by calling ctx.media().
      if (typeof c.render === "function") return toNode(c.render(a, ctx));
      if (C.render) return toNode(C.render(c, a, ctx));
      const m = mediaFor(c, a);
      if (m) return m;
      if (typeof c.html === "function") return toNode(c.html(a, ctx));
      if (c.html == null) throw new Error("nothing to render: no render function, no media, no html");
      return toNode(c.html);
    }

    // side is "a", "b", or null in the gallery.
    //
    // A card that could not be drawn must say so and must not be votable. The usual
    // way to get here is a media resolver that is not total over the arena
    // (`media: a => clips[c.id][a.theme.id]` after a theme is added without clips):
    // without this the duel advances underneath a frozen screen and the votes land on
    // pairs nobody ever saw.
    function card(c, a, side) {
      const head = h("div", { class: "td-card-head" },
        h("div", {}, h("div", { class: "td-card-name", text: c.name }), c.note ? h("div", { class: "td-card-note", text: c.note }) : null),
        // The arrow is a separate span because it stops being true below 760px, where the
        // duel stacks and "left" is the card on top. CSS drops it at that width.
        side ? h("span", { class: "td-side-key" },
          side === "a" ? h("span", { class: "td-side-arrow", text: "\u2190 " }) : null,
          side === "a" ? "Left" : "Right",
          side === "b" ? h("span", { class: "td-side-arrow", text: " \u2192" }) : null) : null);
      let body, broken = false;
      try { body = renderBody(c, a); } catch (e) {
        broken = true;
        console.error(`Thunderdome: ${c.id} failed to render`, e);
        body = failNode("Couldn't draw this one.", String((e && e.message) || e));
      }
      const el = h("article", { class: "td-card", "data-contender": c.id },
        head, h("div", { class: "td-card-body" }, body));
      if (broken) el.dataset.tdBroken = "1";
      // The whole card is the button. Reaching for a button under the thing you are
      // judging is the difference between twenty votes and five.
      // Mouse only on purpose: the arrow keys and the vote buttons below are the
      // keyboard and screen reader path, and a card announcing itself as a button
      // would read its own contents out as the label.
      if (side && !broken && !C.interactiveCards) {
        el.classList.add("td-live");
        el.addEventListener("click", e => {
          // The card body is pointer-events:none, but the head is not: the name and the
          // note are there to be read, and reading sometimes means dragging across them.
          // A drag that ends with text selected was not a vote.
          const sel = root.getSelection && root.getSelection();
          if (sel && !sel.isCollapsed) return;
          // Media controls are exempt from the blanket, so a click on one is a play, not a vote.
          if (e.target.closest && e.target.closest("video,audio")) return;
          vote(side);
        });
      }
      // Gallery clips are played by the observer instead of autoplaying: a clip below
      // the fold, or sitting in the hidden results view, should not be decoding against
      // the duel. Reduced motion leaves autoplay off, so it never gets the marker.
      if (!side) for (const v of el.querySelectorAll("video")) {
        if (v.autoplay) { v.autoplay = false; v.dataset.tdAuto = "1"; }
      }
      return el;
    }

    function syncControls(a) {
      for (const d of C.dims) {
        const el = $[`td-dim-${d.id}`];
        if (d.type === "select") el.value = arenaIds[d.id]; else el.checked = !!arenaIds[d.id];
      }
      $.tag.textContent = C.tag ? C.tag(a) : defaultTag(a);
    }

    // Start both sides of a duel at the same point in their loop. Clips left alone
    // drift apart within seconds, and then you are comparing a treatment at the top of
    // its loop against one halfway through it, which is not the question you asked.
    // A GIF cannot be seeked at all, which is why the docs push mp4 and webm.
    // `byHand` is the R key or the Replay button. Reduced motion means nothing starts
    // itself, not that the button someone just pressed does nothing: under that setting
    // the clips carry controls and get played one at a time, which is exactly the case
    // where they drift and re-aligning them by hand is the only repair.
    function syncDuelVideos(byHand) {
      const vids = [...$.duel.querySelectorAll("video")];
      $.replay.hidden = !vids.length;
      if (!vids.length) return;
      const token = ++syncToken;
      const ready = v => v.readyState >= 2 ? Promise.resolve() : new Promise(res => {
        // Every one of these has to settle even if the element is thrown away first,
        // or the promise holds both <video> elements and their listeners alive.
        let timer = 0;
        const done = () => {
          clearTimeout(timer);
          v.removeEventListener("loadeddata", done); v.removeEventListener("error", done); res();
        };
        timer = setTimeout(done, 1500);
        v.addEventListener("loadeddata", done); v.addEventListener("error", done);
      });
      // Don't hold the first clip back forever on a slow load for the second.
      Promise.race([Promise.all(vids.map(ready)), new Promise(r => setTimeout(r, 1500))]).then(() => {
        if (token !== syncToken) return;  // a newer duel already claimed the ring
        for (const v of vids) {
          try { v.currentTime = 0; } catch (e) { /* not seekable yet */ }
          if (byHand || !reducedMotion()) { const q = v.play(); if (q && q.catch) q.catch(() => {}); }
        }
      });
    }

    // The duel is the comparison that has to stay smooth. Gallery clips below the fold,
    // or in the results view while you are voting, are competing with it for nothing.
    // The duel's own clips are as hidden as the gallery's once you switch to the
    // standings, and a paused <video> that nobody can see is not costing anything.
    function tuneDuelVideos() {
      if (view === "vote") { syncDuelVideos(); return; }
      for (const v of $.duel.querySelectorAll("video")) v.pause();
    }

    // Built only when the results view needs it. With "New arena each duel" on, the
    // arena changes every vote, so keying the gallery on the arena alone still tore down
    // and re-preloaded every clip in it once per duel, on the same frame as the new duel.
    function flushGallery() {
      if (!galleryDirty || view !== "results") return false;
      galleryDirty = false;
      const a = arena();
      galleryKey = JSON.stringify(a.ids);
      $.gallery.replaceChildren(...Q.contenders.map(c => card(c, a)));
      tuneGalleryVideos();
      return true;
    }

    function tuneGalleryVideos() {
      if (galleryIO) { galleryIO.disconnect(); galleryIO = null; }
      const vids = [...$.gallery.querySelectorAll("video")];
      if (view !== "results") { for (const v of vids) v.pause(); return; }
      if (typeof IntersectionObserver !== "function") {
        for (const v of vids) if (v.dataset.tdAuto) { const q = v.play(); if (q && q.catch) q.catch(() => {}); }
        return;
      }
      galleryIO = new IntersectionObserver(es => {
        for (const e of es) {
          if (!e.isIntersecting) e.target.pause();
          else if (e.target.dataset.tdAuto) { const q = e.target.play(); if (q && q.catch) q.catch(() => {}); }
        }
      }, { rootMargin: "120px" });
      for (const v of vids) galleryIO.observe(v);
    }

    // A card can fail at render (a resolver that is not total over the arena) or later
    // (media that 404s). Either way the duel stops being a fair comparison, so the vote
    // buttons come off until you skip. Called again by the media error listener.
    function refreshVoteLock() {
      const bad = !!$.duel.querySelector("[data-td-broken], .td-media-broken");
      for (const b of [$.voteA, $.voteTie, $.voteB]) b.disabled = bad;
      lockNote = bad ? "One of these cards didn't render, so this duel isn't votable. Skip it, and check the console." : "";
      renderStatus();
    }

    function render() {
      const a = arena();
      if (C.dims.length) syncControls(a);
      $.duel.replaceChildren(...(duel ? [card(byId[duel.a], a, "a"), card(byId[duel.b], a, "b")] : []));
      // The gallery only depends on the arena, so a vote that does not move the arena
      // leaves it alone entirely, and one that does defers the rebuild to the view that
      // can actually see it.
      const gk = JSON.stringify(a.ids);
      if (gk !== galleryKey) { galleryKey = gk; galleryDirty = true; }
      if (view === "results") flushGallery();
      tuneDuelVideos();
      refreshVoteLock();
    }

    function nextDuel() {
      if ($.shuffle && $.shuffle.checked) {
        for (const d of C.dims) if (d.shuffle) {
          arenaIds[d.id] = d.type === "select" ? d.options[Math.floor(Math.random() * d.options.length)].id : Math.random() < .5;
        }
      }
      const p = pickPair(ids, qVotes(), lastKey);
      lastKey = p.key; duel = { a: p.a, b: p.b };
      render();
    }

    function renderStandings() {
      const sorted = qVotes().sort((x, y) => x.t - y.t);
      const all = elo(ids, sorted, C.k);
      const perSplit = splitVals.map(s => {
        const list = sorted.filter(v => splitOf(C, resolveArena(C, v, true)) === s.id);
        const r = elo(ids, list, C.k);
        const best = list.length ? ids.slice().sort((x, y) => r[y] - r[x])[0] : null;
        return { r, best };
      });
      const rec = records(ids, sorted);
      const rows = ids.slice().sort((x, y) => all[y] - all[x]).map((id, i) => {
        const c = byId[id];
        const nameCell = h("td");
        if (C.swatch) {
          const sw = C.swatch(c, { h });
          if (sw != null) nameCell.append(sw instanceof Node ? sw : h("span", { class: "td-swatch", style: `background:${sw}` }));
        }
        nameCell.append(document.createTextNode(c.name));
        return h("tr", {},
          h("td", { class: "rank", text: String(i + 1) }),
          nameCell,
          h("td", { class: "num", text: String(Math.round(all[id])) }),
          ...perSplit.map(s => h("td", { class: "num" + (s.best === id ? " td-lead" : ""), text: String(Math.round(s.r[id])) })),
          h("td", { class: "num", text: `${rec[id].w}–${rec[id].l}–${rec[id].t}` }));
      });
      $.standings.replaceChildren(...rows);

      const recent = sorted.slice().reverse().slice(0, C.recent);
      $.feed.replaceChildren(...(recent.length ? recent.map(v => {
        const a = byId[v.a] ? byId[v.a].name : v.a, b = byId[v.b] ? byId[v.b].name : v.b;
        const w = v.w === "tie" ? `${a} = ${b}` : `${v.w === "a" ? a : b} beat ${v.w === "a" ? b : a}`;
        return h("li", {}, h("b", { text: w }), h("span", { text: describe(v) }), h("span", { class: "when", text: ago(v.t) }));
      }) : [h("li", { class: "td-empty", text: "No bouts yet. Vote above to start the table." })]));
      renderStatus();
    }

    // Who is winning, without making you switch views to find out. A vote you cannot
    // see land feels like it went nowhere, and then you stop voting.
    function leaderLine() {
      const mine = qVotes();
      if (mine.length < 3) return "";
      const r = elo(ids, mine.sort((x, y) => x.t - y.t), C.k);
      const rank = ids.slice().sort((x, y) => r[y] - r[x]);
      const gap = r[rank[0]] - r[rank[1]];
      // Under a K-factor's worth of separation two contenders have not been told apart yet.
      return gap < C.k ? "Too close to call so far." : `${byId[rank[0]].name} leads.`;
    }

    // Where the votes are going. Sticky, because it is a fact about the page rather
    // than an event, and it is kept out of `note` so a page with no shared table does
    // not spend the rest of the session saying so instead of naming the leader.
    function storageLine() {
      if (stickyNote) return stickyNote;
      if (shared) {
        const n = qVotes().filter(v => !String(v.id).startsWith("local-")).length;
        return `${n} shared vote${n === 1 ? "" : "s"} so far.`;
      }
      return "Votes stay in this browser until the shared table connects.";
    }
    // The lock note beats everything: a row of dead buttons needs an explanation more
    // than a vote already visible in the Results count needs a confirmation.
    function renderStatus() {
      const n = qVotes().length;
      $.tabResults.textContent = n ? `Results (${n})` : "Results";
      $.status.textContent = lockNote || note || `${storageLine()} ${leaderLine()}`.trim();
    }
    // A sticky message is always the correction to whatever transient is on screen: it
    // is said when a vote was rejected, right after that vote said it was saved. Clearing
    // the transient is the point, otherwise the page spends two seconds claiming a vote
    // landed that did not.
    function say(msg, sticky) {
      if (sticky) { stickyNote = msg; note = ""; clearTimeout(noteTimer); renderStatus(); return; }
      note = msg; clearTimeout(noteTimer); renderStatus();
      noteTimer = setTimeout(() => { note = ""; renderStatus(); }, 2500);
    }

    // ---- voting ----
    function saveLocal() {
      try { localStorage.setItem(C.localKey, JSON.stringify(votes.filter(x => String(x.id).startsWith("local-")))); } catch (e) { /* storage blocked */ }
    }
    function localVote(v) {
      v.id = "local-" + v.t; votes.push(v); myLast = { local: v.id }; $.undo.hidden = false;
      saveLocal(); renderStandings();
    }
    async function vote(w) {
      if (!duel || lockNote) return;
      // `q` only on a dome that has questions, so a single-question dome's votes keep the
      // exact shape they had before questions existed and an old shared table still reads.
      const v = { a: duel.a, b: duel.b, w, ...arena().ids, t: Date.now() };
      if (C.multi) v.q = Q.id;
      const cards = $.duel.children;
      if (w === "a" && cards[0]) cards[0].classList.add("picked");
      if (w === "b" && cards[1]) cards[1].classList.add("picked");
      duel = null;
      if (shared && votesCol) {
        try {
          const ref = votesCol.doc(); await ref.set(v); myLast = ref; $.undo.hidden = false;
          say("Vote saved to the shared table.");
        } catch (e) {
          shared = false; localVote(v);
          say("You can view but not vote on the shared table here, so this vote stays in your browser.", true);
        }
      } else localVote(v);
      setTimeout(nextDuel, 260);
    }
    async function undo() {
      if (!myLast) return;
      if (myLast.local) { const id = myLast.local; votes = votes.filter(v => v.id !== id); saveLocal(); renderStandings(); say("Vote removed."); }
      else { try { await myLast.delete(); say("Vote removed."); } catch (e) { say("Couldn't remove that vote."); } }
      myLast = null; $.undo.hidden = true;
    }

    document.addEventListener("keydown", e => {
      // The duel is hidden on the results view, and a vote on a pair you cannot see is
      // bad data. It also means space is the page's own scroll key there, which is what
      // anyone reading a table of standings expects it to be.
      if (view !== "vote") return;
      if (e.metaKey || e.ctrlKey || e.altKey || e.repeat) return;
      const near = sel => e.target.closest && e.target.closest(sel);
      if (near("select,input,textarea,[contenteditable]")) return;   // typing always beats voting
      // A focused media player owns its own keys: space plays, arrows seek. Under
      // prefers-reduced-motion the controls are the only way to watch a clip at all.
      if (near("video,audio")) return;
      const k = e.key;
      // Space and Enter belong to whatever is focused. The arrows and digits do not:
      // clicking "Left wins" once leaves that button focused, and the keyboard has to
      // keep working afterwards or the fast path dies the first time you use the mouse.
      if ((k === " " || k === "Enter") && near("button,a,summary")) return;
      if (k === "ArrowLeft" || k === "1") vote("a");
      else if (k === "ArrowRight" || k === "2") vote("b");
      else if (k === "ArrowDown" || k === "3" || k === " ") vote("tie");
      else if (k === "s" || k === "S") nextDuel();
      else if (k === "u" || k === "U") undo();
      else if (k === "r" || k === "R") syncDuelVideos(true);
      else return;
      e.preventDefault();
    });

    // ---- boot ----
    try { const saved = JSON.parse(localStorage.getItem(C.localKey) || "[]"); if (Array.isArray(saved)) votes = saved; } catch (e) { /* no storage */ }
    { const r = fromHash(); goto(r.q, r.view, true); }

    (async () => {
      let db = null;
      try { db = await (root.claude && root.claude.use ? root.claude.use("db") : null); } catch (e) { db = null; }
      if (!db) { say("Shared votes aren't available in this view, so votes stay in your browser.", true); return; }
      votesCol = db.collection(C.collection); shared = true; renderStatus();
      votesCol.onSnapshot(snap => {
        const local = votes.filter(v => String(v.id).startsWith("local-"));
        votes = snap.docs.map(d => ({ ...d.data(), id: d.id })).concat(local);
        renderStandings();
      }, () => { shared = false; say("Lost the shared table, so votes stay in your browser for now.", true); });
    })();

    return {
      get votes() { return votes.slice(); },
      get question() { return Q.id; },
      next: nextDuel, vote, undo,
      go: (q, v) => { location.hash = hashFor(q, v || view); },
    };
  }

  const api = { start, elo, records, pickPair, pairCounts, ago, normalize, normalizeDome, parseHash, hashFor, resolveArena, mediaSpec };
  root.Thunderdome = api;
  if (typeof module === "object" && module.exports) module.exports = api;
})(typeof window !== "undefined" ? window : globalThis);

</script>
<script>
// Three decisions about the same dialog, in one dome. The arena, the render function and
// the media defaults are written once; each question brings its own contenders and its
// own lede. Every question has its own link: #wording/results is the table for that one.

const shell = (body, footer) => `
  <div class="dlg">
    <div class="dlg-body">${body}</div>
    <div class="dlg-foot">${footer}</div>
  </div>`;
const BODY = `<h3>Delete “Q3 pricing”?</h3><p>This board and its 48 cards will be removed for everyone on the team.</p>`;
const FOOT = `<button class="b ghost">Cancel</button><button class="b danger">Delete board</button>`;

Thunderdome.start({
  id: "dialog-thunderdome",
  title: "Destructive Dialog Thunderdome",
  collection: "dialog-votes",
  questions: [
    {
      id: "button",
      short: "Button",
      title: "Which delete button?",
      lede: "The dialog is the same in all four. Pick the button you would rather see under a sentence about deleting 48 cards.",
      contenderLabel: "Button",
      contenders: [
        { id: "solid", name: "Solid red", note: "Filled danger, white label",
          html: shell(BODY, `<button class="b ghost">Cancel</button><button class="b danger">Delete board</button>`) },
        { id: "outline", name: "Outlined red", note: "1px danger border, danger label",
          html: shell(BODY, `<button class="b ghost">Cancel</button><button class="b danger-outline">Delete board</button>`) },
        { id: "quiet", name: "Quiet red", note: "No container, danger label",
          html: shell(BODY, `<button class="b ghost">Cancel</button><button class="b danger-text">Delete board</button>`) },
        { id: "neutral", name: "Neutral", note: "Ordinary primary, red nowhere",
          html: shell(BODY, `<button class="b ghost">Cancel</button><button class="b solid">Delete board</button>`) },
      ],
    },
    {
      id: "footer",
      short: "Footer",
      title: "Where do the buttons go?",
      lede: "Same button, four footers. Cancel is the safe one, so the question is how hard it is to hit the other by accident.",
      contenderLabel: "Footer",
      contenders: [
        { id: "right", name: "Right, danger last", note: "Cancel then Delete, right aligned",
          html: shell(BODY, FOOT) },
        { id: "right-swap", name: "Right, danger first", note: "Delete then Cancel, right aligned",
          html: shell(BODY, `<button class="b danger">Delete board</button><button class="b ghost">Cancel</button>`) },
        { id: "split", name: "Split", note: "Cancel far left, Delete far right",
          html: shell(BODY, `<button class="b ghost split-left">Cancel</button><button class="b danger">Delete board</button>`) },
        { id: "stacked", name: "Stacked", note: "Full width, Delete on top",
          html: shell(BODY, `<div class="stack"><button class="b danger">Delete board</button><button class="b ghost">Cancel</button></div>`) },
      ],
    },
    {
      id: "wording",
      short: "Wording",
      title: "How should it say it?",
      lede: "Same dialog, four ways of saying what is about to happen. Read each one as if you were about to click.",
      contenderLabel: "Wording",
      contenders: [
        { id: "plain", name: "Plain", note: "Names the thing and the count",
          html: shell(`<h3>Delete “Q3 pricing”?</h3><p>This board and its 48 cards will be removed for everyone on the team.</p>`, FOOT) },
        { id: "short", name: "Short", note: "One line, no count",
          html: shell(`<h3>Delete this board?</h3><p>Everyone on the team will lose access.</p>`, FOOT) },
        { id: "consequence", name: "Consequence first", note: "Leads with what is lost",
          html: shell(`<h3>48 cards will be deleted</h3><p>“Q3 pricing” and everything in it, for the whole team. This cannot be undone.</p>`, FOOT) },
        { id: "reassuring", name: "Reassuring", note: "Names the way back",
          html: shell(`<h3>Delete “Q3 pricing”?</h3><p>The board moves to Trash for 30 days. You can restore it from there.</p>`, FOOT) },
      ],
    },
  ],
  arena: {
    dimensions: [
      { id: "surface", label: "Surface", options: [
        { id: "paper", name: "Paper", dark: false },
        { id: "slate", name: "Slate", dark: true },
      ] },
      { id: "compact", label: "Compact", short: "compact", shuffle: true },
    ],
  },
  split: {
    values: [{ id: "light", label: "Light" }, { id: "dark", label: "Dark" }],
    of: a => a.surface && (a.surface.dark ? "dark" : "light"),
  },
  render: (c, a, { h }) => h("div", { class: `arena ${a.surface.id}${a.compact ? " compact" : ""}`, html: c.html }),
});

</script>
