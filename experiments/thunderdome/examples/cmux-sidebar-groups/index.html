<body>
<noscript>This page needs JavaScript to run the duels.</noscript>
<script>
/*
 * Thunderdome: pairwise design judgment with a shared Elo table.
 *
 * A config calls Thunderdome.start({...}) with contenders, arena dimensions,
 * an optional split, and a render function. The engine supplies pairing,
 * voting UI, keyboard shortcuts, Elo (overall and per split), W-L-T, recent
 * bouts, the gallery, undo, and shared (claude.ai db) or local storage.
 * A contender can be an image, a GIF or a video instead of markup; the two
 * clips in a duel are restarted together so the comparison stays honest.
 * See ../README.md for the config reference.
 */
(function (root) {
  "use strict";

  const RESERVED = new Set(["id", "a", "b", "w", "t"]);

  // ---------- pure core (no DOM; exercised by test.mjs) ----------

  function pairKey(a, b) { return [a, b].sort().join("|"); }

  function pairCounts(votes) {
    const c = {};
    for (const v of votes) { const k = pairKey(v.a, v.b); c[k] = (c[k] || 0) + 1; }
    return c;
  }

  // Weighted random pair: weight 1/(1+n)^2 where n is how often the pair has met.
  // Never repeats the previous pair when another exists. Returns {a, b, key} with sides shuffled.
  function pickPair(ids, votes, lastKey, rand) {
    rand = rand || Math.random;
    const counts = pairCounts(votes), pairs = [];
    for (let i = 0; i < ids.length; i++) for (let j = i + 1; j < ids.length; j++) {
      const k = pairKey(ids[i], ids[j]);
      if (k === lastKey && ids.length > 2) continue;
      pairs.push({ k, a: ids[i], b: ids[j], w: 1 / Math.pow(1 + (counts[k] || 0), 2) });
    }
    if (!pairs.length) return null;
    let r = rand() * pairs.reduce((s, p) => s + p.w, 0), chosen = pairs[0];
    for (const p of pairs) { r -= p.w; if (r <= 0) { chosen = p; break; } }
    return rand() < .5 ? { a: chosen.a, b: chosen.b, key: chosen.k } : { a: chosen.b, b: chosen.a, key: chosen.k };
  }

  // Sequential Elo over votes in time order. Every contender starts at `start`.
  function elo(ids, votes, k, start) {
    k = k || 24; start = start || 1500;
    const r = Object.fromEntries(ids.map(id => [id, start]));
    for (const v of votes) {
      if (!(v.a in r) || !(v.b in r) || v.a === v.b) continue;
      const ea = 1 / (1 + Math.pow(10, (r[v.b] - r[v.a]) / 400));
      const sa = v.w === "a" ? 1 : v.w === "b" ? 0 : .5;
      r[v.a] += k * (sa - ea); r[v.b] += k * ((1 - sa) - (1 - ea));
    }
    return r;
  }

  function records(ids, votes) {
    const rec = Object.fromEntries(ids.map(id => [id, { w: 0, l: 0, t: 0 }]));
    for (const v of votes) {
      if (!rec[v.a] || !rec[v.b]) continue;
      if (v.w === "tie") { rec[v.a].t++; rec[v.b].t++; }
      else if (v.w === "a" || v.w === "b") {
        const win = v.w === "a" ? v.a : v.b, lose = v.w === "a" ? v.b : v.a;
        rec[win].w++; rec[lose].l++;
      }
    }
    return rec;
  }

  function ago(t, now) {
    const s = Math.max(0, ((now || Date.now()) - t) / 1000);
    if (s < 60) return "just now";
    if (s < 3600) return `${Math.floor(s / 60)}m ago`;
    if (s < 86400) return `${Math.floor(s / 3600)}h ago`;
    return `${Math.floor(s / 86400)}d ago`;
  }

  const VIDEO_EXT = /\.(mp4|webm|mov|m4v|ogv)(?:[?#]|$)/i;

  // A contender's `media` becomes {kind, src, poster, alt, fit, loop, aspect}.
  // Accepts "shot.png" or {src, ...}; `defaults` is the config-level `media` block.
  // The kind is read off the extension, so a data URI or an extension-less URL
  // (a signed CI artifact link, say) needs an explicit `kind` or it renders as an image.
  function mediaSpec(media, defaults) {
    if (typeof media === "string") media = { src: media };
    if (!media || !media.src) return null;
    const d = defaults || {}, src = String(media.src);
    return {
      kind: media.kind || d.kind || (VIDEO_EXT.test(src) || /^data:video\//i.test(src) ? "video" : "img"),
      src,
      poster: media.poster || d.poster || null,
      alt: media.alt == null ? (d.alt || "") : media.alt,
      fit: media.fit || d.fit || "contain",
      loop: (media.loop == null ? d.loop : media.loop) !== false,
      aspect: media.aspect || d.aspect || null,
      // Off by default: most media is an opaque screenshot or clip that brings its own
      // surface, and a box around it reads as a second card. Turn it on for icons and
      // anything else with transparency to sit on.
      frame: media.frame == null ? !!d.frame : !!media.frame,
    };
  }

  function normalize(cfg) {
    if (!cfg || !cfg.id) throw new Error("Thunderdome: config needs an id");
    const contenders = (cfg.contenders || []).map(c => ({ note: "", ...c }));
    if (contenders.length < 2) throw new Error("Thunderdome: need at least two contenders");
    const seen = new Set();
    for (const c of contenders) {
      if (!c.id || seen.has(c.id)) throw new Error(`Thunderdome: contender ids must be unique and non-empty (${c.id})`);
      seen.add(c.id);
    }
    const dims = ((cfg.arena && cfg.arena.dimensions) || cfg.dimensions || []).map(d => {
      if (RESERVED.has(d.id)) throw new Error(`Thunderdome: dimension id "${d.id}" is reserved`);
      const type = d.type || (d.options ? "select" : "toggle");
      return { label: d.id, ...d, type, shuffle: d.shuffle ?? (type === "select") };
    });
    return {
      k: 24, recent: 8, collection: "votes", contenderLabel: "Contender",
      galleryTitle: "Everyone in this arena", media: {},
      ...cfg,
      contenders, dims,
      localKey: cfg.localKey || `thunderdome:${cfg.id}:local`,
    };
  }

  // Arena ids ({theme:"x", ic:true}) to the object render() sees ({theme:{id,name,...}, ic:true, ids}).
  // strict: unknown option ids resolve to null (used for stored votes); otherwise the first option.
  function resolveArena(C, ids, strict) {
    const arena = { ids: {} };
    for (const d of C.dims) {
      if (d.type === "select") {
        const o = d.options.find(x => x.id === ids[d.id]) || (strict ? null : d.options[0]);
        arena[d.id] = o; arena.ids[d.id] = o ? o.id : ids[d.id];
      } else {
        arena[d.id] = !!ids[d.id]; arena.ids[d.id] = !!ids[d.id];
      }
    }
    return arena;
  }

  function splitOf(C, arena) {
    if (!C.split) return null;
    try { return C.split.of(arena); } catch (e) { return null; }
  }

  // ---------- DOM ----------

  function h(tag, attrs, ...kids) {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v == null || v === false) continue;
      if (k === "class") el.className = v;
      else if (k === "text") el.textContent = v;
      else if (k === "html") el.innerHTML = v;
      else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? "" : v);
    }
    for (const kid of kids) if (kid != null) el.append(kid);
    return el;
  }

  function toNode(x) {
    if (x instanceof Node) return x;
    const t = document.createElement("template");
    t.innerHTML = String(x == null ? "" : x);
    return t.content;
  }

  function reducedMotion() {
    return typeof matchMedia === "function" && matchMedia("(prefers-reduced-motion: reduce)").matches;
  }

  // Said on a card that could not be drawn, and on one whose media 404s.
  function failNode(title, detail) {
    return h("div", { class: "td-media td-media-broken" },
      h("div", { class: "td-media-fail" }, h("b", { text: title }), detail ? h("code", { text: detail }) : null));
  }

  // One <img> or <video> in a box that holds its shape. A card whose height changes
  // between duels moves the thing you are about to click, so give media an `aspect`
  // whenever you can.
  function mediaNode(spec, label) {
    const box = h("div", { class: "td-media" + (spec.frame ? " td-framed" : "") });
    const style = `object-fit:${spec.fit}` + (spec.aspect ? `;aspect-ratio:${spec.aspect}` : "");
    // Name what failed. For an inlined data URI the path is long gone, so say that
    // instead of printing 70 characters of base64 at someone.
    const where = /^data:/i.test(spec.src)
      ? `${spec.src.slice(0, spec.src.indexOf(";")) || "data:"}, inlined at build time`
      : (spec.src.length > 72 ? spec.src.slice(0, 69) + "..." : spec.src);
    const fail = () => {
      box.classList.add("td-media-broken");
      box.replaceChildren(h("div", { class: "td-media-fail" },
        h("b", { text: "Couldn't load this one." }), h("code", { text: where })));
      // Tells the duel to take the vote buttons off: this card is no longer a fair half
      // of the comparison, and a vote cast on it is bad data.
      box.dispatchEvent(new CustomEvent("td-media-fail", { bubbles: true }));
    };
    let el;
    if (spec.kind === "video") {
      el = h("video", { src: spec.src, poster: spec.poster, loop: spec.loop, muted: true,
        playsinline: true, preload: "auto", style, "aria-label": spec.alt || label });
      el.muted = true;  // the attribute alone does not always stick, and autoplay needs the property
      // Reduced motion: hand over the controls instead of moving things at them.
      if (reducedMotion()) el.controls = true; else el.autoplay = true;
    } else {
      el = h("img", { src: spec.src, alt: spec.alt || label, loading: "lazy", decoding: "async", style });
    }
    // A blank card still looks votable, and a vote cast on one is bad data. Say it failed.
    el.addEventListener("error", fail);
    box.append(el);
    return box;
  }

  function start(cfg) {
    const C = normalize(cfg);
    const ids = C.contenders.map(c => c.id);
    const byId = Object.fromEntries(C.contenders.map(c => [c.id, c]));
    const mount = (C.mount && document.querySelector(C.mount)) || document.body;

    let arenaIds = {};
    for (const d of C.dims) arenaIds[d.id] = d.type === "select" ? (d.default ?? d.options[0].id) : !!d.default;
    let duel = null, lastKey = "";
    let votes = [];
    let votesCol = null, shared = false, myLast = null;
    let note = "", noteTimer = 0, lockNote = "";
    let syncToken = 0, galleryIO = null, galleryKey = null;

    if (C.title) document.title = C.title;

    // ---- layout ----
    const $ = {};
    const controls = h("div", { class: "td-controls", role: "group", "aria-label": "Arena" });
    for (const d of C.dims) {
      const idAttr = `td-dim-${d.id}`;
      if (d.type === "select") {
        const sel = h("select", { id: idAttr });
        for (const o of d.options) sel.append(new Option(o.name, o.id));
        sel.addEventListener("change", e => { arenaIds[d.id] = e.target.value; if ($.shuffle) $.shuffle.checked = false; render(); });
        $[idAttr] = sel;
        controls.append(h("label", { for: idAttr }, d.label + " ", sel));
      } else {
        const box = h("input", { type: "checkbox", id: idAttr });
        box.addEventListener("change", e => { arenaIds[d.id] = e.target.checked; render(); });
        $[idAttr] = box;
        controls.append(h("label", { for: idAttr }, box, " " + d.label));
      }
    }
    if (C.dims.some(d => d.shuffle)) {
      $.shuffle = h("input", { type: "checkbox", id: "td-shuffle", checked: C.shuffle !== false });
      controls.append(h("label", { for: "td-shuffle" }, $.shuffle, " New arena each duel"));
    }
    $.tag = h("span", { class: "td-arena-tag" });
    controls.append($.tag);

    $.duel = h("section", { class: "td-duel", "aria-live": "polite" });
    // Media that fails to load does so long after render(), so it reports back.
    $.duel.addEventListener("td-media-fail", () => refreshVoteLock());
    $.voteA = h("button", { class: "primary", onclick: () => vote("a") }, "Left wins", h("kbd", { text: "←" }));
    $.voteTie = h("button", { onclick: () => vote("tie") }, "Tie", h("kbd", { text: "↓" }));
    $.voteB = h("button", { class: "primary", onclick: () => vote("b") }, "Right wins", h("kbd", { text: "→" }));
    $.skip = h("button", { class: "quiet", onclick: () => nextDuel() }, "Skip", h("kbd", { text: "S" }));
    $.undo = h("button", { class: "quiet", hidden: true, onclick: () => undo() }, "Undo my last vote", h("kbd", { text: "U" }));
    $.replay = h("button", { class: "quiet", hidden: true, onclick: () => syncDuelVideos(true) }, "Replay both", h("kbd", { text: "R" }));
    $.status = h("div", { class: "td-status", role: "status" });

    const splitVals = C.split ? C.split.values : [];

<script>
// cmux sidebar organization: six ways to lay out the same ~24 workspaces.
// Arena: sidebar theme x moment (busy afternoon vs quiet evening). Split: light vs dark.

const THEMES = [
  { id: "mac-light", name: "macOS Light", bg: "#E6E6E8", fg: [0, 0, 0], fgA: .85, secA: .5, dark: false },
  { id: "mac-dark", name: "macOS Dark", bg: "#262628", fg: [255, 255, 255], fgA: .88, secA: .55, dark: true },
  { id: "github-light", name: "GitHub Light", bg: "#F6F8FA", fg: [31, 35, 40], fgA: 1, secA: .62, dark: false },
  { id: "tokyo-night", name: "Tokyo Night", bg: "#1A1B26", fg: [192, 202, 245], fgA: 1, secA: .6, dark: true },
];
const rgba = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;

// One workspace per line: title, host, agent, project, manual group, and status in two moments.
// Status: n needs input, r running, u done unseen, i idle, t plain terminal.
// Hosts: "local" is this Mac; "devbox" and "gpu-01" are cmux ssh targets; "cloud" is a Cloud VM.
const W = [
  ["sidebar groups", "devbox", "claude", "cmux", "Sidebar", "rn", 4],
  ["compact status", "local", "claude", "cmux", "Sidebar", "uu", 12],
  ["row density", "local", "claude", "cmux", "Sidebar", "ri", 30],
  ["ssh failure", "devbox", "claude", "cmux", null, "ni", 2],
  ["keymap chooser", "devbox", "codex", "cmux", null, "ri", 8],
  ["clickable links", "devbox", "claude", "cmux", null, "ui", 15],
  ["merge train", "devbox", "claude", "cmux", "Release", "ri", 1],
  ["release notes", "local", "codex", "cmux", "Release", "ii", 240],
  ["nightly smoke", "cloud", null, "cmux", "Release", "tt", 400],
  ["vote page", "devbox", "claude", "design", null, "uu", 6],
  ["design notes", "local", "claude", "design", null, "ii", 900],
  ["job queue", "devbox", "codex", "queue", null, "rr", 3],
  ["ci daemon", "local", "claude", "queue", null, "ni", 20],
  ["pool routing", "local", "claude", "proxy", null, "ri", 5],
  ["eviction rule", "devbox", "claude", "ops", null, "ri", 9],
  ["attention feed", "devbox", "claude", "ops", null, "uu", 45],
  ["cloud vision", "devbox", "codex", "ops", null, "ii", 130],
  ["train eval", "gpu-01", "claude", "evals", null, "rr", 11],
  ["gpu shell", "gpu-01", null, "~", null, "tt", 60],
  ["tail logs", "devbox", null, "~", null, "tt", 25],
  ["dotfiles", "local", null, "dotfiles", null, "tt", 2000],
  ["scratch", "local", null, "~", null, "tt", 3000],
  ["docs site", "local", "claude", "web", null, "ii", 5000],
  ["benchmarks", "cloud", "codex", "cmux", null, "ni", 18],

const MOMENTS = [
  { id: "busy", name: "Busy afternoon", pick: 0 },
  { id: "quiet", name: "Quiet evening", pick: 1 },
];
const statusOf = (w, m) => w.st[m.pick];

const HOST_NAME = { local: "This Mac", devbox: "devbox", "gpu-01": "gpu-01", cloud: "Cloud VM" };

const STATUS_META = {
  n: { name: "Needs input", rank: 0 },
  r: { name: "Running", rank: 1 },
  u: { name: "Done, unseen", rank: 2 },
  i: { name: "Idle", rank: 3 },
  t: { name: "Terminals", rank: 4 },

const AMBER = "rgb(250,176,10)", BLUE = "#0A84FF";

// ---- drawing ------------------------------------------------------------------

function glyph(st, th, h) {

  if (st === "r") return h("span", { class: "g dot pulse", style: `background:${sec}` });

  if (opts.icon) el.append(h("span", { class: "ic", style: `color:${opts.color || sec}`, text: opts.icon }));

  if (opts.rollup) el.append(glyph(opts.rollup, th, h));
  return el;
}

  const { th, h } = ctx;
  const sec = rgba(th.fg, th.secA), fg = rgba(th.fg, th.fgA);
  return h("div", { class: "sw-bar", style: `border-color:${rgba(th.fg, .12)}` },
    h("span", { style: `color:${sec}`, text: "Group by" }),
    h("span", { class: "pill", style: `color:${fg};background:${rgba(th.fg, th.dark ? .12 : .08)}`, text: label + "  ▾" }));
}

const loudest = ws => ws.map(w => w.cur).sort((a, b) => STATUS_META[a].rank - STATUS_META[b].rank)[0];

function sections(ws, keyOf, order, ctx, labelOf, opts = {}) {
  const buckets = new Map();
  for (const w of ws) {
    const k = keyOf(w);
    if (!buckets.has(k)) buckets.set(k, []);
    buckets.get(k).push(w);
  }
  const keys = [...buckets.keys()].sort((a, b) => order(a) - order(b));
  const out = [];
  for (const k of keys) {
    const items = buckets.get(k);
    out.push(header(labelOf(k), ctx, { strong: true, count: items.length, rollup: opts.rollup === false ? null : loudest(items), icon: opts.icon && opts.icon(k), color: opts.color && opts.color(k) }));
    for (const w of items) out.push(row(w, ctx, { indent: true, ...(opts.row || {}) }));
  }
  return out;
}

// ---- the six layouts ---------------------------------------------------------

const byRecent = (a, b) => a.age - b.age;

const LAYOUTS = [
  { id: "flat", name: "Flat list (today)", note: "The control: manual order, manual groups only",
    body: (ws, ctx) => {
      const out = [];
      let seen = new Set();
      for (const w of ws) {
        if (w.group && !seen.has(w.group)) {
          seen.add(w.group);
          const members = ws.filter(x => x.group === w.group);
          out.push(header(w.group, ctx, { color: GROUP_COLOR[w.group], strong: true, count: members.length, rollup: loudest(members) }));
          for (const x of members) out.push(row(x, ctx, { indent: true }));
        } else if (!w.group) out.push(row(w, ctx));
      }
      return out;
    } },

  { id: "project", name: "By project", note: "What Claude Code and Codex do: one section per repo",
    body: (ws, ctx) => {
      const order = [...new Set(ws.map(w => w.proj))];
      return [switcher("Project", ctx), ...sections(ws, w => w.proj, k => k === "~" ? 99 : order.indexOf(k), ctx, k => k === "~" ? "No project" : k, { icon: () => "▣" })];
    } },

  { id: "a-host", name: "A: Group by host", note: "One switcher; sections by machine; manual group kept as a color tag",
    body: (ws, ctx) => [switcher("Host", ctx), ...sections(ws, w => w.host, k => HOST_ORDER.indexOf(k), ctx, k => HOST_NAME[k],
      { rollup: true, icon: k => k === "local" ? "⌂" : k === "cloud" ? "☁" : "⇄", row: { groupTag: true, trail: () => "" } })] },

  { id: "a-status", name: "A: Group by status", note: "Same switcher; sections by agent state, loudest first",
    body: (ws, ctx) => [switcher("Status", ctx), ...sections(ws.slice().sort(byRecent), w => w.cur, k => STATUS_META[k].rank, ctx, k => STATUS_META[k].name,
      { rollup: false, row: { groupTag: true } })] },

  { id: "b-smart", name: "B: Smart + manual groups", note: "Rule groups beside manual ones: Needs input first, then manual groups, then host rules",
    body: (ws, ctx) => {
      const out = [];
      const needs = ws.filter(w => w.cur === "n");
      out.push(header("Needs input", ctx, { icon: "⚙", color: AMBER, strong: true, count: needs.length }));
      for (const w of needs) out.push(row(w, ctx, { indent: true }));
      const rest = ws.filter(w => w.cur !== "n");
      for (const g of ["Sidebar", "Release"]) {
        const m = rest.filter(w => w.group === g);
        out.push(header(g, ctx, { color: GROUP_COLOR[g], strong: true, count: m.length, rollup: m.length ? loudest(m) : null }));
        for (const w of m) out.push(row(w, ctx, { indent: true }));
      }
      const free = rest.filter(w => !w.group);
      for (const host of ["devbox", "gpu-01"]) {
        const m = free.filter(w => w.host === host);
        out.push(header(`On ${host}`, ctx, { strong: true, icon: "⚙", count: m.length, rollup: m.length ? loudest(m) : null }));
        for (const w of m) out.push(row(w, ctx, { indent: true, trail: () => "" }));
      }
      const other = free.filter(w => w.host !== "devbox" && w.host !== "gpu-01");
      out.push(h_sep(ctx));
      for (const w of other) out.push(row(w, ctx));
      return out;
    } },

  { id: "c-strip", name: "C: Attention strip + host lanes", note: "Needs-input and unseen pinned on top; lanes per machine below",
    body: (ws, ctx) => {
      const { th, h } = ctx;
      const out = [];
      const hot = ws.filter(w => w.cur === "n" || w.cur === "u").sort((a, b) => STATUS_META[a.cur].rank - STATUS_META[b.cur].rank);
      const strip = h("div", { class: "strip", style: `background:${rgba(th.fg, th.dark ? .07 : .05)}` });
      strip.append(h("div", { class: "strip-l", style: `color:${rgba(th.fg, th.fgA)}`, text: hot.length ? `Attention · ${hot.length}` : "Attention · all clear" }));
      for (const w of hot) strip.append(row(w, ctx));
      out.push(strip);
      for (const host of HOST_ORDER) {
        const lane = ws.filter(w => w.host === host);
        if (!lane.length) continue;
        out.push(header(HOST_NAME[host], ctx, { strong: true, icon: host === "local" ? "⌂" : host === "cloud" ? "☁" : "⇄", count: lane.length, rollup: loudest(lane) }));
        const seen = new Set();
        for (const w of lane) {
          if (w.group && !seen.has(w.group)) {
            seen.add(w.group);
            const members = lane.filter(x => x.group === w.group);
            const sub = header(w.group, ctx, { color: GROUP_COLOR[w.group], count: members.length, rollup: loudest(members) });
            sub.classList.add("in");
            out.push(sub);
            for (const x of members) out.push(row(x, ctx, { indent: 2, trail: () => "" }));
          } else if (!w.group) out.push(row(w, ctx, { indent: true, trail: () => "" }));
        }
      }
      return out;
    } },
];

function h_sep(ctx) {
  return ctx.h("div", { class: "sep", style: `background:${rgba(ctx.th.fg, .1)}` });
}

Thunderdome.start({
  id: "cmux-sidebar-groups",
  title: "Sidebar Organization Thunderdome",
  lede: "Six ways to organize the same 24 cmux workspaces: local agents, agents on two ssh hosts and a Cloud VM, and plain terminals. Pick the sidebar you would rather work from all day. The arena flips between a busy afternoon (several agents need you) and a quiet evening. Glyphs are the ones cmux draws: amber = needs input, grey = running, blue = done and unseen, ✓ = idle. A colored bar is a manual group; ⚙ marks a rule-based smart group.",
  contenderLabel: "Layout",
  contenders: LAYOUTS,
  arena: {
    dimensions: [
      { id: "theme", label: "Sidebar", options: THEMES },
      { id: "moment", label: "Moment", options: MOMENTS },
    ],
  },
  split: {
    values: [{ id: "busy", label: "Busy" }, { id: "quiet", label: "Quiet" }],
    of: a => a.moment && a.moment.id,
  },
  tag: a => `${a.theme.dark ? "dark" : "light"} · ${a.moment.name.toLowerCase()}`,
  describe: (a, v) => [a.theme ? a.theme.name : v.theme, a.moment ? a.moment.name.toLowerCase() : v.moment].join(", "),
  render: (layout, a, { h }) => {
    const th = a.theme, m = a.moment;
    const ws = W.map(w => ({ ...w, cur: statusOf(w, m) }));
    const ctx = { th, m, h };
    const sb = h("div", { class: "sb", style: `background:${th.bg}` });
    for (const el of layout.body(ws, ctx)) sb.append(el);
    return sb;
  },
});

</script>
