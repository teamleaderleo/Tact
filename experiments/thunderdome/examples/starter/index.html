<!doctype html>
<!-- Generated by experiments/thunderdome/build.mjs from examples/starter/config.js. Edit the config, then rebuild. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Primary Button Thunderdome</title>
<meta name="description" content="Four primary buttons for a confirm dialog. Pick the one that reads as the default action without shouting.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Thunderdome engine styles. Page chrome only; contender styles belong in the config's config.css. */
:root{
  color-scheme:light;
  --bg:#F3F4F6; --panel:#FFFFFF; --ink:#15171C; --muted:#5A6170; --faint:#8A909C;
  --rule:#DCDFE5; --rule-strong:#C3C8D1; --hover:#EBEDF1; --win:#1F7A4D; --win-bg:#E3F3EA;
  --focus:#2F6FEB;
  --sans:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#101216; --panel:#181B21; --ink:#E6E8ED; --muted:#9AA1AE; --faint:#6F7684;
    --rule:#2A2F38; --rule-strong:#3A404B; --hover:#20242B; --win:#6FD39F; --win-bg:#16291F;
    --focus:#7AA7FF;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#101216; --panel:#181B21; --ink:#E6E8ED; --muted:#9AA1AE; --faint:#6F7684;
  --rule:#2A2F38; --rule-strong:#3A404B; --hover:#20242B; --win:#6FD39F; --win-bg:#16291F;
  --focus:#7AA7FF;
}
*{box-sizing:border-box}
/* A class selector outranks the UA's [hidden] rule, so anything the engine hides by
   property (the views, Undo, Replay) needs this or it stays on screen. Scoped to the two
   places the engine does it, so a config's own [hidden] handling is left alone. */
.td-view[hidden],.td-vote button[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);padding-inline:16px;padding-block:20px 64px}
.td-wrap{max-width:1080px;margin:0 auto;display:grid;gap:14px}
.td-head{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.td-view{display:grid;gap:18px}
.td-tabs{display:flex;gap:4px;flex:none}
.td-tab{font-size:13px;color:var(--muted);text-decoration:none;padding:5px 13px;border-radius:999px;border:1px solid transparent;white-space:nowrap}
.td-tab:hover{color:var(--ink);background:var(--hover)}
.td-tab:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.td-tab[aria-current=page]{color:var(--ink);background:var(--panel);border-color:var(--rule-strong)}
/* One dome, several decisions. Reads as a row of questions rather than a second set of
   pill tabs, so it does not compete with Vote/Results for the same glance.
   Scrolls rather than wraps: the underline is pulled 1px onto the nav's own rule, and a
   wrapped row would drag that pull through the row above it. A long list or a narrow
   phone slides sideways instead. */
.td-qnav{display:flex;gap:0 18px;border-bottom:1px solid var(--rule);overflow-x:auto;scrollbar-width:none}
.td-qnav::-webkit-scrollbar{display:none}
.td-qtab{font-size:13.5px;color:var(--muted);text-decoration:none;padding:9px 2px;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;flex:none}
.td-qtab:hover{color:var(--ink)}
.td-qtab:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
/* Colour and the underline mark the current tab. Bolding it too would change the label's
   width on selection and shuffle every tab to its right as you click along the row. */
.td-qtab[aria-current=page]{color:var(--ink);border-bottom-color:var(--ink)}
/* The question in words. h2 elsewhere in the page is a small uppercase section label,
   which this is not: it is the sentence the two cards below it are answering. */
.td-wrap h2.td-qtitle{font-size:17px;font-weight:600;letter-spacing:-.005em;text-transform:none;color:var(--ink);margin:2px 0 -4px;text-wrap:balance}
/* It is a focus target so a screen reader is told which question it landed on, not a
   control. A ring around a full-width heading nobody can act on reads as a text field. */
.td-qtitle:focus,.td-qtitle:focus-visible{outline:none}
.td-wrap h1{font-size:26px;font-weight:600;letter-spacing:-.01em;margin:0;text-wrap:balance}
.td-wrap h2{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0}
.td-section{display:grid;gap:10px}
.td-lede{color:var(--muted);max-width:68ch;margin:0;font-size:14px}
.td-lede code{font-family:var(--mono);font-size:13px}
.td-arena{border:1px solid var(--rule);border-radius:10px;background:var(--panel)}
.td-arena>summary{display:flex;gap:9px;align-items:center;padding:8px 14px;cursor:pointer;font-size:13px;list-style:none}
.td-arena>summary::-webkit-details-marker{display:none}
.td-arena>summary::before{content:"";flex:none;width:0;height:0;border:4px solid transparent;border-left-color:var(--faint);transition:transform .15s}
.td-arena[open]>summary::before{transform:rotate(90deg)}
.td-arena>summary:focus-visible{outline:2px solid var(--focus);outline-offset:-2px;border-radius:10px}
.td-arena-label{color:var(--muted)}
.td-arena[open]>summary{border-bottom:1px solid var(--rule)}
.td-controls{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;padding:12px 14px}
.td-controls label{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.td-controls select{font:inherit;font-size:13px;color:var(--ink);background:var(--bg);border:1px solid var(--rule-strong);border-radius:6px;padding:4px 8px}
.td-controls input[type=checkbox]{accent-color:var(--ink)}
.td-arena-tag{font-family:var(--mono);font-size:12px;color:var(--faint);margin-left:auto}
.td-duel{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.td-card{background:var(--panel);border:1px solid var(--rule);border-radius:12px;padding:14px;display:grid;gap:12px;align-content:start;min-width:0}
.td-card.picked{border-color:var(--win);box-shadow:0 0 0 2px var(--win-bg)}
.td-card.td-live{cursor:pointer}
.td-card.td-live:hover{border-color:var(--rule-strong);background:var(--hover)}
.td-card.td-live:hover .td-side-key{color:var(--ink);border-color:var(--rule-strong)}
/* Clicks land on the card, not on whatever the mock happens to contain. Configs whose
   contenders are meant to be poked at set interactiveCards and keep their own events. */
.td-card.td-live .td-card-body{pointer-events:none}
/* Except the player's own controls. Under prefers-reduced-motion nothing autoplays and
   these are the only way to watch a clip at all, so swallowing the play button would
   leave the duel unwatchable and turn the attempt into a vote. */
.td-card.td-live .td-card-body video[controls],.td-card.td-live .td-card-body audio[controls]{pointer-events:auto}
.td-card-head{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.td-card-name{font-weight:600;font-size:15px}
.td-card-note{font-size:12.5px;color:var(--muted)}
.td-card-body{min-width:0}
.td-media{display:grid;place-items:center;min-width:0;min-height:72px;border-radius:8px;overflow:hidden}
.td-media.td-framed{background:var(--bg);border:1px solid var(--rule)}
.td-media>img,.td-media>video{display:block;width:100%;height:auto;max-height:min(52vh,440px);background:transparent}
.td-media>video[controls]{max-height:min(48vh,400px)}
.td-gallery .td-media>img,.td-gallery .td-media>video{max-height:220px}
.td-media.td-media-broken{background:var(--bg);border:1px dashed var(--rule-strong)}
.td-media-fail{display:grid;gap:4px;justify-items:center;text-align:center;padding:20px 14px;font-size:12.5px;color:var(--muted)}
.td-media-fail b{color:var(--ink);font-weight:500}
.td-media-fail code{font-family:var(--mono);font-size:11px;color:var(--faint);word-break:break-all}
.td-side-key{font-family:var(--mono);font-size:11px;color:var(--faint);border:1px solid var(--rule);border-radius:4px;padding:0 5px}
.td-vote{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center}
.td-vote button{font:inherit;font-size:14px;font-weight:500;color:var(--ink);background:var(--panel);border:1px solid var(--rule-strong);border-radius:8px;padding:8px 16px;cursor:pointer}
.td-vote button:hover{background:var(--hover)}
.td-vote button:disabled{opacity:.45;cursor:not-allowed;background:var(--panel)}
.td-vote button:focus-visible,.td-controls select:focus-visible,.td-controls input:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.td-vote button.primary{border-color:var(--ink)}
.td-vote button.quiet{border-color:transparent;color:var(--muted)}
.td-vote kbd{font-family:var(--mono);font-size:11px;color:var(--faint);margin-left:6px}
/* The note box. Quiet by design: it sits under the vote row so it never moves the
   buttons, and it is the last thing on the page to ask for attention. */
.td-why{display:flex;gap:8px;justify-content:center;align-items:center}
.td-why-input{font:inherit;font-size:13px;color:var(--ink);background:var(--panel);border:1px solid var(--rule);border-radius:8px;padding:7px 11px;width:min(420px,100%)}
.td-why-input::placeholder{color:var(--faint)}
.td-why-input:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-color:var(--rule-strong)}
.td-why button{font:inherit;font-size:13px;color:var(--muted);background:none;border:1px solid transparent;border-radius:8px;padding:7px 10px;cursor:pointer}
.td-why button:hover{color:var(--ink);background:var(--hover)}
.td-why button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.td-why kbd{font-family:var(--mono);font-size:11px;color:var(--faint);margin-left:6px}
.td-why-on{font-family:var(--mono);font-size:11px;color:var(--faint);white-space:nowrap}
/* Notes under a gallery card. The rule on the left is what makes a stack of them read
   as quotation rather than as more of the card's own copy. */
.td-whys{display:grid;gap:7px;margin:12px 0 0;padding:0;list-style:none}
.td-whys li{font-size:12.5px;line-height:1.45;color:var(--muted);border-left:2px solid var(--rule);padding-left:9px}
.td-why-text{color:var(--ink);display:block}
.td-why-vs{font-family:var(--mono);font-size:11px;color:var(--faint)}
.td-feed-why{font-style:italic;display:block}
.td-status{font-size:12.5px;color:var(--muted);text-align:center;min-height:1.5em}
.td-two{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:28px;align-items:start}
.td-table-wrap{overflow-x:auto;background:var(--panel);border:1px solid var(--rule);border-radius:12px}
.td-table-wrap table{border-collapse:collapse;width:100%;font-size:13.5px}
.td-table-wrap th,.td-table-wrap td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--rule);white-space:nowrap}
.td-table-wrap tr:last-child td{border-bottom:0}
.td-table-wrap th{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.td-table-wrap td.num,.td-table-wrap th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.td-table-wrap td.rank{font-family:var(--mono);color:var(--faint);width:1%}
.td-swatch{display:inline-block;width:34px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:8px}
/* The interval rides along with the rating rather than taking a column of its own: it is
   a qualifier on that number, and a column would let the eye scan the spreads on their
   own as if they were a second ranking. Quieter and smaller so the rating still reads
   first, but not so quiet it looks like a footnote you can skip.
   A fixed slot, so a table holding a +/-9 next to a +/-107 keeps its ratings in a column
   instead of sliding each one left by however wide its own spread happens to be. */
.td-ci{display:inline-block;min-width:3.2em;margin-left:7px;text-align:right;color:var(--faint);font-size:11.5px}
/* The sentence the table is evidence for, so it is not muted into a caption. */
.td-callout{margin:0;font-size:13px;color:var(--ink)}
.td-lead{color:var(--win);font-weight:600}
.td-feed{display:grid;gap:6px;font-size:13px;color:var(--muted);margin:0;padding:0;list-style:none}
.td-feed li{display:grid;gap:3px}
.td-feed-line{display:flex;gap:8px;flex-wrap:wrap;align-items:baseline}
.td-feed b{color:var(--ink);font-weight:500}
.td-feed .when{font-family:var(--mono);font-size:11.5px;color:var(--faint);margin-left:auto}
.td-gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:12px}
.td-gallery .td-card{padding:12px;gap:8px}
.td-empty{color:var(--faint);font-size:13px;padding:12px}
@media (max-width:760px){
  .td-duel,.td-two{grid-template-columns:1fr}
  .td-arena-tag{margin-left:0}
  /* One column, so "left" is the card on top and the arrow points at nothing. */
  .td-side-arrow{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.arena{--ac:#2F6FEB;border-radius:10px;padding:28px 16px;display:grid;place-items:center}
.arena.paper{background:#FFFFFF;box-shadow:inset 0 0 0 1px #DCDFE5}
.arena.slate{--ac:#7AA7FF;background:#1E2229}
.stage{display:flex;gap:8px}
.arena .b{font:600 14px/1 var(--sans);border-radius:8px;padding:10px 18px;border:1px solid transparent;cursor:default}
.arena.compact .b{font-size:12.5px;padding:6px 12px;border-radius:6px}
.arena .solid{background:var(--ac);color:#fff}
.arena.slate .solid{color:#0B1220}
.arena .outline{background:transparent;color:var(--ac);border-color:var(--ac)}

.arena .text{background:transparent;color:var(--ac)}

<body>
<noscript>This page needs JavaScript to run the duels.</noscript>
<script>
/*
 * Thunderdome: pairwise design judgment with a shared Elo table.
 *
 * A config calls Thunderdome.start({...}) with contenders, arena dimensions,
 * an optional split, and a render function. The engine supplies pairing,
 * voting UI, keyboard shortcuts, fitted ratings on the Elo scale with a
 * bootstrap interval (overall and per split), W-L-T, recent bouts, the
 * gallery, undo, and shared (claude.ai db) or local storage.
 * A contender can be an image, a GIF or a video instead of markup; the two
 * clips in a duel are restarted together so the comparison stays honest.
 * See ../README.md for the config reference.
 */
(function (root) {
  "use strict";

  const RESERVED = new Set(["id", "a", "b", "w", "t", "q"]);
  const VIEWS = new Set(["vote", "results"]);
  // The vote view will not name a leader until the top two are NOISE_FLOOR / sqrt(bouts)
  // Elo points apart. A fitted rating's spread shrinks with the square root of the vote
  // count, so a fixed number of points is the wrong shape: 40 points is a coin flip at 20
  // votes and old news at 800. Measured against the results view's own 95%-of-resamples
  // call over 120 runs at each of 20/60/120/300/800 votes, this rule agrees with it
  // 95-100% of the time, where a flat 40 agreed 40% at 20 votes; and on a field with a
  // genuine winner the two views name one at the same rate to within two points.
  const NOISE_FLOOR = 1000;

  // ---------- pure core (no DOM; exercised by test.mjs) ----------

  function pairKey(a, b) { return [a, b].sort().join("|"); }

  function pairCounts(votes) {
    const c = {};
    for (const v of votes) { const k = pairKey(v.a, v.b); c[k] = (c[k] || 0) + 1; }
    return c;
  }

  // Weighted random pair: weight 1/(1+n)^2 where n is how often the pair has met.
  // Never repeats the previous pair when another exists. Returns {a, b, key} with sides shuffled.
  function pickPair(ids, votes, lastKey, rand) {
    rand = rand || Math.random;
    const counts = pairCounts(votes), pairs = [];
    for (let i = 0; i < ids.length; i++) for (let j = i + 1; j < ids.length; j++) {
      const k = pairKey(ids[i], ids[j]);
      if (k === lastKey && ids.length > 2) continue;
      pairs.push({ k, a: ids[i], b: ids[j], w: 1 / Math.pow(1 + (counts[k] || 0), 2) });
    }
    if (!pairs.length) return null;
    let r = rand() * pairs.reduce((s, p) => s + p.w, 0), chosen = pairs[0];
    for (const p of pairs) { r -= p.w; if (r <= 0) { chosen = p; break; } }
    return rand() < .5 ? { a: chosen.a, b: chosen.b, key: chosen.k } : { a: chosen.b, b: chosen.a, key: chosen.k };
  }

  // Sequential Elo over votes in time order. Every contender starts at `start`.
  function elo(ids, votes, k, start) {
    k = k || 24; start = start || 1500;
    const r = Object.fromEntries(ids.map(id => [id, start]));
    for (const v of votes) {
      if (!(v.a in r) || !(v.b in r) || v.a === v.b) continue;
      const ea = 1 / (1 + Math.pow(10, (r[v.b] - r[v.a]) / 400));
      const sa = v.w === "a" ? 1 : v.w === "b" ? 0 : .5;
      r[v.a] += k * (sa - ea); r[v.b] += k * ((1 - sa) - (1 - ea));
    }
    return r;
  }

  // Elo points per unit of natural log-odds. A 400-point gap is 10:1, which is the
  // definition of the scale, so the whole fit can work in log-odds and convert once.
  const SCALE = 400 / Math.log(10);

  // Bradley-Terry fitted by maximum likelihood, with an L2 prior of `prior` Elo points
  // pulling every contender toward `start`. Coordinate Newton, swept Gauss-Seidel: each
  // contender is stepped against the ratings as they stand right now, including the ones
  // already moved in this sweep.
  //
  // Doing it the other way, computing every gradient from the ratings at the top of the
  // sweep and then moving everything at once, is Jacobi iteration, and it diverges. Two
  // contenders who mostly fight each other are almost perfectly anticorrelated: each
  // one's step already accounts for the gap closing, so taking both moves the gap twice
  // as far as it should, and the overshoot lands where the sigmoid is flat and the next
  // step is bigger still. A two-contender dome at 200 votes ran to -12776 that way.
  // The step clamp below is the seatbelt, but the sweep order is the fix.
  //
  // This is what the table shows, rather than the sequential elo() above, for two
  // reasons. It does not depend on the order the votes arrived in, which a table read at
  // the end of a run should not. And it is a model you can resample, which is what makes
  // the interval next to it mean something; an interval bootstrapped from one model and
  // printed beside a point estimate from another is a decoration, not a measurement.
  //
  // The prior is also what keeps an undefeated contender finite. Plain Bradley-Terry
  // sends it to infinity, and "Elo 4180" after three bouts is not a useful thing to read.
  //
  // `mu` moves where the prior pulls each contender, in Elo points relative to the field.
  // Nothing calls it with a `mu` except confidence(), which uses it to let the interval
  // see the prior's own uncertainty as well as the votes'.
  function fit(ids, votes, opts) {
    const o = opts || {}, prior = o.prior || 200, start = o.start == null ? 1500 : o.start;
    const n = ids.length, idx = {};
    ids.forEach((id, i) => { idx[id] = i; });
    // One flat [opponent, score, opponent, score, ...] list per contender, so a sweep
    // reads only the bouts of the contender it is about to move.
    const r = new Float64Array(n), bouts = [];
    for (let i = 0; i < n; i++) bouts.push([]);
    for (const v of votes) {
      const i = idx[v.a], j = idx[v.b];
      if (i === undefined || j === undefined || i === j) continue;
      const s = v.w === "a" ? 1 : v.w === "b" ? 0 : .5;
      bouts[i].push(j, s); bouts[j].push(i, 1 - s);
    }
    const pv = Math.pow(prior / SCALE, 2);  // the prior's variance in log-odds
    // A mu is a statement about the field, so only its shape matters: centering it here
    // keeps the sweep's own recentering below a descent step rather than a fudge.
    const mu = new Float64Array(n);
    if (o.mu) {
      let mm = 0;
      for (let i = 0; i < n; i++) mm += o.mu[i] || 0;
      mm /= n;
      for (let i = 0; i < n; i++) mu[i] = ((o.mu[i] || 0) - mm) / SCALE;
    }
    for (let sweep = 0; sweep < 200; sweep++) {
      let move = 0;
      for (let i = 0; i < n; i++) {
        let g = -(r[i] - mu[i]) / pv, hess = 1 / pv;
        const b = bouts[i];
        for (let m = 0; m < b.length; m += 2) {
          const p = 1 / (1 + Math.exp(-(r[i] - r[b[m]])));
          g += b[m + 1] - p; hess += p * (1 - p);
        }
        // One log-odds unit is 174 Elo points. A step longer than that is the sigmoid
        // being flat, not the answer being far away, and the next sweep will take
        // another one anyway.
        const step = Math.max(-1, Math.min(1, g / hess));
        r[i] += step;
        move = Math.max(move, Math.abs(step));
      }
      // Recenter on `start`. Bradley-Terry is identified only up to an additive constant,
      // so shifting the whole field leaves the likelihood alone and can only shrink the
      // prior's sum of squares: this is a descent step, not a cosmetic one. It is also
      // the only fast way along that direction. The data pins the gaps with the weight of
      // every bout behind them and leaves the field's mean to the prior alone, so a sweep
      // that has the gaps right can still be hundreds of sweeps from the right offset.
      let mean = 0;
      for (let i = 0; i < n; i++) mean += r[i];
      mean /= n;
      for (let i = 0; i < n; i++) r[i] -= mean;
      if (move < 1e-10) break;
    }
    const out = {};
    for (let i = 0; i < n; i++) out[ids[i]] = start + r[i] * SCALE;
    return out;
  }

  // Seeded so the same votes always produce the same interval. An interval that shifts a
  // few points every time the table redraws reads as measurement noise on top of the
  // measurement, and invites the reader to redraw until they like the answer.
  function lcg(seed) {
    let s = (seed >>> 0) || 1;
    return () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296;
  }

  // A standard normal from a uniform stream, so the prior draw below is as reproducible
  // as the vote resampling next to it.
  function normalFrom(rand) {
    let u = 0, v = 0;
    while (!u) u = rand();
    while (!v) v = rand();
    return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
  }

  // Ratings with an interval. The point estimate is fit(). The interval is the percentile
  // range of fit() over `resamples` refits, each one taking two draws: the votes are
  // resampled with replacement, and the prior's centre is drawn from the prior itself.
  //
  // The second draw is the one that is easy to leave out and wrong to. Resampling only
  // the votes asks "how much would this rating move if the same voters voted again",
  // which is the whole question for a contender with a mixed record and no question at
  // all for one with a 0-0-0 or an unbeaten one: every resample of an all-wins record is
  // still all wins, the rating is pinned by the prior, and the table prints an unbeaten
  // contender on 20 bouts as +/-3 and a contender who has never fought at all as +/-0.
  // Those two are the least certain rows on the page. Drawing the prior's centre as well
  // puts the prior's own spread into the interval, which is where the uncertainty for
  // those rows actually lives. Measured against known truth over 150 runs at each size,
  // 4 contenders, nominal 90%: coverage 84/82/90/88% at 20/60/200/600 votes with the
  // votes alone, 92/86/91/89% with both draws, and the well-fed half-widths are
  // unchanged (48 -> 49 at 200 votes, 28 -> 29 at 600). It only widens where the votes
  // alone were claiming more than they knew.
  //
  // fit() centers on the field, so every refit is already comparable to the last.
  // Bradley-Terry is identified only up to an additive constant, and an uncentered refit
  // carries a whole-field shift that says nothing about any one contender: a 25-point
  // shift swallows a 26-point interval whole, and coverage of a nominal 90% interval
  // measured 60% uncentered against 91% centered. The table is read as an ordering, so
  // the quantity the interval has to cover is each rating relative to the field.
  //
  // Under `minBouts` votes it reports no interval at all. A handful of votes still
  // returns a number, and the reader has no way to tell it from an earned one.
  function confidence(ids, votes, opts) {
    const o = opts || {};
    const prior = o.prior || 200;
    const minBouts = o.minBouts == null ? 8 : o.minBouts;
    const level = o.level == null ? .9 : o.level;
    const resamples = o.resamples == null ? 300 : o.resamples;
    const known = {};
    ids.forEach(id => { known[id] = true; });
    const usable = votes.filter(v => known[v.a] && known[v.b] && v.a !== v.b);
    const rating = fit(ids, usable, { prior });
    const bouts = usable.length;
    if (bouts < minBouts || resamples < 2) {
      return { rating, bouts, level, resamples: 0, lo: null, hi: null, ahead: null };
    }
    const cols = {}, ahead = {};
    for (const id of ids) {
      cols[id] = new Float64Array(resamples);
      ahead[id] = {};
      for (const other of ids) ahead[id][other] = 0;
    }
    const rand = lcg(bouts * 2654435761 + ids.length);
    const draw = new Array(bouts), mu = new Array(ids.length);
    for (let b = 0; b < resamples; b++) {
      for (let i = 0; i < bouts; i++) draw[i] = usable[(rand() * bouts) | 0];
      for (let i = 0; i < ids.length; i++) mu[i] = normalFrom(rand) * prior;
      const f = fit(ids, draw, { prior, mu });
      for (const id of ids) cols[id][b] = f[id];
      for (let i = 0; i < ids.length; i++) for (let j = i + 1; j < ids.length; j++) {
        const x = ids[i], y = ids[j], d = f[x] - f[y];
        ahead[x][y] += d > 0 ? 1 : d < 0 ? 0 : .5;
        ahead[y][x] += d < 0 ? 1 : d > 0 ? 0 : .5;
      }
    }
    const tail = (1 - level) / 2;
    const at = (col, p) => col[Math.min(resamples - 1, Math.max(0, Math.round(p * (resamples - 1))))];
    const lo = {}, hi = {};
    for (const id of ids) {
      const col = cols[id].slice().sort();
      lo[id] = at(col, tail); hi[id] = at(col, 1 - tail);
    }
    for (const id of ids) for (const other of ids) ahead[id][other] /= resamples;
    return { rating, bouts, level, resamples, lo, hi, ahead };
  }

  // Every fit costs a pass over the votes, so the resample count comes down as the vote
  // list grows. It is the same trade in both directions: a short list needs the
  // resamples because its interval is wide and ragged, a long list has a narrow
  // interval that another 240 fits would not sharpen. 8 contenders and 2000 votes is
  // about 50ms, against 250ms at a flat 300.
  function resampleCount(m) {
    return Math.max(40, Math.min(300, Math.round(120000 / Math.max(1, m))));
  }

  // What to hand `confidence` for a dome, given how many votes it has. `confidence:
  // false` normalises to null, and the opt-out has to be spelled out rather than left
  // to a default: no resamples and a bout floor nothing can clear, which is what makes
  // the interval and the verdict come back empty.
  //
  // Up here rather than in the DOM layer because two callers now draw this table, and
  // a second copy of these three numbers is a table that reads 1653 ±19 in the browser
  // and 1653 ±20 on a terminal for the same votes. That happened.
  function confidenceOpts(C, voteCount) {
    return C.confidence
      ? { ...C.confidence, resamples: resampleCount(voteCount) }
      : { resamples: 0, minBouts: Infinity };
  }

  // The claim in words. "1612 ±48" next to "1564 ±51" is a puzzle the reader has to do
  // arithmetic on; "ahead in 96% of resamples" is the answer to the question they opened
  // the page with.
  //
  // The bar is the one-sided form of the interval's own level: a 90% interval leaves 5%
  // in each tail, so the call it corresponds to is 95%. Derived rather than written
  // down, so a dome that sets `confidence: {level}` gets a verdict that agrees with the
  // number in the hover text instead of one fixed at somebody else's level. The
  // comparison is against the raw share and only the display is rounded, or a share of
  // .9457 would be called a lead by a page that also prints it as 95%.
  //
  // `name` maps an id to what to call it; callers that have no names can pass nothing.
  function verdictFor(conf, order, name) {
    const nm = name || (id => id);
    if (!conf.ahead) {
      return conf.bouts
        ? `Not enough bouts to say who is ahead yet: ${conf.bouts} so far.`
        : "No bouts yet, so the table is the prior and nothing else.";
    }
    const [a, b] = order, share = conf.ahead[a][b], pct = Math.round(share * 100);
    return share >= 1 - (1 - conf.level) / 2
      ? `${nm(a)} is ahead of ${nm(b)} in ${pct}% of resamples.`
      : `${nm(a)} and ${nm(b)} are too close to call: ${pct}% of resamples put ${nm(a)} ahead.`;
  }

  function records(ids, votes) {
    const rec = Object.fromEntries(ids.map(id => [id, { w: 0, l: 0, t: 0 }]));
    for (const v of votes) {
      if (!rec[v.a] || !rec[v.b]) continue;
      if (v.w === "tie") { rec[v.a].t++; rec[v.b].t++; }
      else if (v.w === "a" || v.w === "b") {
        const win = v.w === "a" ? v.a : v.b, lose = v.w === "a" ? v.b : v.a;
        rec[win].w++; rec[lose].l++;
      }
    }
    return rec;
  }

  // Every note people left while voting, gathered per contender, newest first.
  //
  // A note is written about a vote, not about a contender in the abstract, so it belongs
  // to whoever won that vote. That is the whole reason this is worth having: "too heavy"
  // is not an opinion about a button, it is an opinion about a button next to another
  // one, and `vs` carries the other side so the remark still means something when you
  // read it a week later on a card. A note left on a tie is a remark about the pair, so
  // it lands on both, which is not duplication: it was said about both.
  //
  // Votes for contenders this question does not know are dropped, exactly as the ratings
  // drop them, so a note from an old question cannot surface under a new one.
  function comments(ids, votes) {
    const out = {};
    for (const id of ids) out[id] = [];
    for (const v of votes || []) {
      const text = typeof v.why === "string" ? v.why.trim() : "";
      if (!text || !out[v.a] || !out[v.b] || v.a === v.b) continue;
      const tie = v.w !== "a" && v.w !== "b";
      const on = tie ? [v.a, v.b] : [v.w === "a" ? v.a : v.b];
      for (const id of on) out[id].push({ text, t: v.t || 0, vs: id === v.a ? v.b : v.a, tie, vote: v.id });
    }
    // Newest first, and ties broken by id so two notes written in the same millisecond
    // (an import, a seeded dome) do not shuffle between renders.
    for (const id of ids) out[id].sort((x, y) => y.t - x.t || String(x.vote).localeCompare(String(y.vote)));
    return out;
  }

  function ago(t, now) {
    const s = Math.max(0, ((now || Date.now()) - t) / 1000);
    if (s < 60) return "just now";
    if (s < 3600) return `${Math.floor(s / 60)}m ago`;
    if (s < 86400) return `${Math.floor(s / 3600)}h ago`;
    return `${Math.floor(s / 86400)}d ago`;
  }

  const VIDEO_EXT = /\.(mp4|webm|mov|m4v|ogv)(?:[?#]|$)/i;

  // A contender's `media` becomes {kind, src, poster, alt, fit, loop, aspect}.
  // Accepts "shot.png" or {src, ...}; `defaults` is the config-level `media` block.
  // The kind is read off the extension, so a data URI or an extension-less URL
  // (a signed CI artifact link, say) needs an explicit `kind` or it renders as an image.
  function mediaSpec(media, defaults) {
    if (typeof media === "string") media = { src: media };
    if (!media || !media.src) return null;
    const d = defaults || {}, src = String(media.src);
    return {
      kind: media.kind || d.kind || (VIDEO_EXT.test(src) || /^data:video\//i.test(src) ? "video" : "img"),
      src,
      poster: media.poster || d.poster || null,
      alt: media.alt == null ? (d.alt || "") : media.alt,
      fit: media.fit || d.fit || "contain",
      loop: (media.loop == null ? d.loop : media.loop) !== false,
      aspect: media.aspect || d.aspect || null,

      // surface, and a box around it reads as a second card. Turn it on for icons and
      // anything else with transparency to sit on.
      frame: media.frame == null ? !!d.frame : !!media.frame,

  }

  function normalize(cfg) {
    if (!cfg || !cfg.id) throw new Error("Thunderdome: config needs an id");
    const contenders = (cfg.contenders || []).map(c => ({ note: "", ...c }));
    if (contenders.length < 2) throw new Error("Thunderdome: need at least two contenders");
    const seen = new Set();
    for (const c of contenders) {
      if (!c.id || seen.has(c.id)) throw new Error(`Thunderdome: contender ids must be unique and non-empty (${c.id})`);
      seen.add(c.id);
    }
    const dims = ((cfg.arena && cfg.arena.dimensions) || cfg.dimensions || []).map(d => {
      if (RESERVED.has(d.id)) throw new Error(`Thunderdome: dimension id "${d.id}" is reserved`);
      const type = d.type || (d.options ? "select" : "toggle");
      return { label: d.id, ...d, type, shuffle: d.shuffle ?? (type === "select") };
    });
    const C = {
      k: 24, recent: 8, collection: "votes", contenderLabel: "Contender",
      galleryTitle: "Everyone in this arena", media: {}, interactiveCards: false,
      ...cfg,
      contenders, dims,
      localKey: cfg.localKey || `thunderdome:${cfg.id}:local`,
    };
    // `confidence: false` drops the interval and the line under the table and leaves a
    // bare rating. Anything else is the settings, with the defaults filled in.
    C.confidence = cfg.confidence === false ? null : {
      prior: 200, minBouts: 8, level: .9,
      ...(cfg.confidence && typeof cfg.confidence === "object" ? cfg.confidence : {}),
    };
    // `comments: false` drops the box and the notes under the cards. `max` is a length,
    // not a policy: one line is the format, and a box that stops you at the end of it
    // says so better than a paragraph nobody reads under a card.
    C.comments = cfg.comments === false ? null : {
      max: 140,
      ...(cfg.comments && typeof cfg.comments === "object" ? cfg.comments : {}),
    };
    return C;
  }

  // Arena ids ({theme:"x", ic:true}) to the object render() sees ({theme:{id,name,...}, ic:true, ids}).
  // strict: unknown option ids resolve to null (used for stored votes); otherwise the first option.
  function resolveArena(C, ids, strict) {
    const arena = { ids: {} };
    for (const d of C.dims) {
      if (d.type === "select") {
        const o = d.options.find(x => x.id === ids[d.id]) || (strict ? null : d.options[0]);
        arena[d.id] = o; arena.ids[d.id] = o ? o.id : ids[d.id];
      } else {
        arena[d.id] = !!ids[d.id]; arena.ids[d.id] = !!ids[d.id];
      }
    }
    return arena;
  }

  function splitOf(C, arena) {
    if (!C.split) return null;
    try { return C.split.of(arena); } catch (e) { return null; }
  }

  // What a question may set for itself. Everything else it inherits from the dome, and
  // anything in DOME_ONLY is rejected rather than quietly ignored, so the boundary is
  // something the config author is told about instead of something they discover.
  const Q_KEYS = ["lede", "galleryTitle", "contenderLabel", "media", "render", "swatch", "interactiveCards"];
  const DOME_ONLY = ["arena", "dimensions", "split", "k", "recent", "collection", "localKey", "mount", "shuffle", "questions", "confidence", "comments"];

  // One dome, several decisions. A question brings its own contenders and its own words
  // and inherits everything else, so the arena, the media defaults and the render
  // function are written once no matter how many questions hang off them. The arena and
  // the K factor stay at the dome level on purpose: questions asked in different
  // contexts are different pages, not tabs.
  //
  // A dome with no `questions` is a dome with one anonymous question, which is what
  // every config written so far is. Its votes are stored exactly as before.
  function normalizeDome(cfg) {
    if (!cfg || !cfg.id) throw new Error("Thunderdome: config needs an id");
    if (cfg.questions != null && !Array.isArray(cfg.questions)) {
      throw new Error("Thunderdome: questions must be a list");
    }
    const list = cfg.questions || null;
    if (list && !list.length) throw new Error("Thunderdome: questions is an empty list");
    const { questions, ...dome } = cfg;
    // A question that names no contenders is an error, not an invitation to borrow the
    // dome's. Inheriting them would put one contender set under two question tags.
    const base = list ? { ...dome, contenders: undefined } : cfg;
    // The dome is validated against the first question's contenders so the arena, the
    // storage keys and the split are read and checked in one place.
    const D = normalize(list ? { ...dome, contenders: qContenders(list[0], 0) } : cfg);
    const seen = new Set();
    D.questions = (list || [{}]).map((q, i) => {
      const id = list ? String(q.id == null ? "" : q.id).toLowerCase() : null;
      if (list) {
        if (!id) throw new Error(`Thunderdome: every question needs an id (question ${i + 1} has none)`);
        if (VIEWS.has(id)) throw new Error(`Thunderdome: "${id}" is a view name, so it cannot be a question id`);
        if (seen.has(id)) throw new Error(`Thunderdome: question ids must be unique (${id})`);
        seen.add(id);
        for (const k of DOME_ONLY) {
          if (k in q) throw new Error(`Thunderdome: question "${id}" sets ${k}, which is a dome-level setting`);
        }
      }
      // The synthetic id exists only to satisfy normalize's own id check. It is thrown
      // away here and never reaches localKey or collection, which come off the dome.
      let Q;
      try {
        Q = list
          ? normalize({ ...base, ...q, contenders: qContenders(q, i), id: `${cfg.id}-${id}` })
          : D;
      } catch (e) {
        throw new Error(id ? `${e.message} (question "${id}")` : e.message);
      }
      const out = {
        id,
        // Read off the question itself, not the merge: inheriting the dome's title would
        // label every tab with the same words.
        label: q.short || q.title || id,
        title: q.title || "",
        contenders: Q.contenders,
      };
      for (const k of Q_KEYS) out[k] = Q[k];
      return out;
    });
    D.multi = !!list;
    return D;
  }

  function qContenders(q, i) {
    if (!q || typeof q !== "object") throw new Error(`Thunderdome: question ${i + 1} is not an object`);
    if (!Array.isArray(q.contenders)) {
      throw new Error(`Thunderdome: question "${q.id || i + 1}" needs its own contenders`);
    }
    return q.contenders;
  }

  // The hash carries the question and the view, in either order and both optional:
  //   #results           the results of a one-question dome
  //   #density           the density question, voting
  //   #density/results   its table, which is the link you paste into the issue
  // A segment that is neither is ignored rather than treated as a question that is not
  // there, so an old link to a renamed question still opens the dome. First occurrence
  // wins for both kinds, so a hash with two of either reads the same way round.
  function parseHash(hash, qids) {
    let q = null, view = null;
    for (const raw of String(hash || "").replace(/^#/, "").split("/")) {
      let p = raw;
      try { p = decodeURIComponent(raw); } catch (e) { /* keep the raw segment */ }
      p = p.toLowerCase();
      if (!view && VIEWS.has(p)) view = p;
      else if (!q && (qids || []).indexOf(p) >= 0) q = p;
    }
    return { q, view: view || "vote" };
  }

  function hashFor(q, view) {
    return "#" + (q ? encodeURIComponent(q) + "/" : "") + (view === "results" ? "results" : "vote");
  }

  // ---------- DOM ----------

  function h(tag, attrs, ...kids) {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v == null || v === false) continue;
      if (k === "class") el.className = v;
      else if (k === "text") el.textContent = v;
      else if (k === "html") el.innerHTML = v;
      else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? "" : v);
    }
    for (const kid of kids) if (kid != null) el.append(kid);
    return el;
  }

  function toNode(x) {
    if (x instanceof Node) return x;
    const t = document.createElement("template");
    t.innerHTML = String(x == null ? "" : x);
    return t.content;
  }

  function reducedMotion() {
    return typeof matchMedia === "function" && matchMedia("(prefers-reduced-motion: reduce)").matches;
  }

  // Said on a card that could not be drawn, and on one whose media 404s.
  function failNode(title, detail) {
    return h("div", { class: "td-media td-media-broken" },
      h("div", { class: "td-media-fail" }, h("b", { text: title }), detail ? h("code", { text: detail }) : null));
  }

  // One <img> or <video> in a box that holds its shape. A card whose height changes
  // between duels moves the thing you are about to click, so give media an `aspect`
  // whenever you can.
  function mediaNode(spec, label) {
    const box = h("div", { class: "td-media" + (spec.frame ? " td-framed" : "") });
    const style = `object-fit:${spec.fit}` + (spec.aspect ? `;aspect-ratio:${spec.aspect}` : "");
    // Name what failed. For an inlined data URI the path is long gone, so say that
    // instead of printing 70 characters of base64 at someone.
    const where = /^data:/i.test(spec.src)
      ? `${spec.src.slice(0, spec.src.indexOf(";")) || "data:"}, inlined at build time`
      : (spec.src.length > 72 ? spec.src.slice(0, 69) + "..." : spec.src);
    const fail = () => {
      box.classList.add("td-media-broken");
      box.replaceChildren(h("div", { class: "td-media-fail" },
        h("b", { text: "Couldn't load this one." }), h("code", { text: where })));
      // Tells the duel to take the vote buttons off: this card is no longer a fair half
      // of the comparison, and a vote cast on it is bad data.
      box.dispatchEvent(new CustomEvent("td-media-fail", { bubbles: true }));
    };
    let el;
    if (spec.kind === "video") {
      el = h("video", { src: spec.src, poster: spec.poster, loop: spec.loop, muted: true,
        playsinline: true, preload: "auto", style, "aria-label": spec.alt || label });

      // Reduced motion: hand over the controls instead of moving things at them.

    } else {
      el = h("img", { src: spec.src, alt: spec.alt || label, loading: "lazy", decoding: "async", style });
    }

    el.addEventListener("error", fail);
    box.append(el);
    return box;
  }

  function start(cfg) {
    const C = normalizeDome(cfg);
    const qids = C.questions.map(q => q.id);
    const mount = (C.mount && document.querySelector(C.mount)) || document.body;

    // The question is a fourth thing that can change, next to the arena, the duel and the
    // view. Switching one swaps the contenders and the slice of the table they are scored
    // against; everything else on the page is the dome's and stays where it is.
    let Q = C.questions[0];
    let ids = [], byId = {};
    function setQuestionData() {
      ids = Q.contenders.map(c => c.id);
      byId = Object.fromEntries(Q.contenders.map(c => [c.id, c]));
    }
    setQuestionData();
    // Votes are stored per dome and tagged with `q`, so one shared table serves every
    // question and one snapshot keeps them all live. A dome with one anonymous question
    // writes no tag at all, which is what every config written before this did.
    //
    // Untagged votes count toward the first question. A dome that already has history and
    // then gains `questions` is the migration people will actually attempt, and the
    // alternative is that every vote cast before the change silently stops existing.
    // Elo ignores contender ids it does not know, so an old vote whose contenders are not
    // in question one drops out on its own rather than landing in the wrong table.
    // Always a fresh array: callers sort it in place.
    const first = () => Q === C.questions[0];
    const qVotes = () => C.multi ? votes.filter(v => v.q === Q.id || (v.q == null && first())) : votes.slice();

    let arenaIds = {};
    for (const d of C.dims) arenaIds[d.id] = d.type === "select" ? (d.default ?? d.options[0].id) : !!d.default;
    let duel = null, lastKey = "";
    let votes = [];
    let votesCol = null, shared = false, myLast = null;
    let note = "", noteTimer = 0, stickyNote = "", lockNote = "";
    let syncToken = 0, galleryIO = null, galleryKey = null, galleryDirty = true, standingsDirty = true, view = "vote";
    // The vote the comment box is currently writing about, with the handle needed to
    // amend it. Not `myLast`: that one moves to every new vote, and a sentence you are
    // halfway through typing is about the pair you were looking at when you started it.
    let whyFor = null;
    // Bumped whenever the question changes, so a vote whose write is still in flight
    // cannot come back and hand its Undo handle to the question you moved to.
    let voteToken = 0, nextTimer = 0, galleryBuilds = 0;

    // The tab title follows the question, so a link someone pasted into an issue says
    // which decision it opens without them having to read the page.
    function setDocTitle() {
      const base = C.title || C.id;
      document.title = C.multi ? `${base} · ${Q.label}` : base;
    }

    // ---- layout ----
    const $ = {};
    const controls = h("div", { class: "td-controls" });
    for (const d of C.dims) {
      const idAttr = `td-dim-${d.id}`;
      if (d.type === "select") {
        const sel = h("select", { id: idAttr });
        for (const o of d.options) sel.append(new Option(o.name, o.id));
        sel.addEventListener("change", e => { arenaIds[d.id] = e.target.value; if ($.shuffle) $.shuffle.checked = false; render(); });
        $[idAttr] = sel;
        controls.append(h("label", { for: idAttr }, d.label + " ", sel));
      } else {
        const box = h("input", { type: "checkbox", id: idAttr });
        box.addEventListener("change", e => { arenaIds[d.id] = e.target.checked; render(); });
        $[idAttr] = box;
        controls.append(h("label", { for: idAttr }, box, " " + d.label));
      }
    }
    if (C.dims.some(d => d.shuffle)) {

        h("section", { class: "td-section" }, h("h2", { text: "Recent bouts" }), $.feed)),

    const wrap = h("div", { class: "td-wrap" },
      h("header", { class: "td-head" },
        h("h1", { text: C.title || C.id }),

    function renderQuestion() {

    // A question tab carries the view you are on, so moving from one table to the next

    // not just on a question change, or the tabs point at the view you just left.

      const moved = C.multi && want !== Q.id;
      if (moved) {
        Q = C.questions[qids.indexOf(want)];
        setQuestionData();
        // Everything below is about the question you just left, including anything still
        // in flight. A confirmation, an Undo handle or a queued duel that outlives the
        // switch belongs to the other table.
        voteToken++;
        clearTimeout(nextTimer); clearTimeout(noteTimer);
        duel = null; lastKey = ""; myLast = null; note = ""; lockNote = "";
        $.undo.hidden = true;

    // ---- rendering ----
    function arena() { return resolveArena(C, arenaIds, false); }

    function defaultTag(a) {
      return C.dims.filter(d => d.type === "select").map(d => a[d.id].name.toLowerCase())
        .concat(C.dims.filter(d => d.type === "toggle" && a[d.id]).map(d => d.short || d.label))
        .join(" · ");
    }

    function describe(v) {
      if (C.describe) return C.describe(resolveArena(C, v, true), v);
      const parts = [];
      for (const d of C.dims) {
        if (d.type === "select") { const o = d.options.find(x => x.id === v[d.id]); parts.push(o ? o.name : String(v[d.id] ?? "?")); }
        else if (v[d.id]) parts.push(d.short || d.label);
      }
      return parts.join(", ");
    }

    // c.media may be a string, an object, or a function of the arena, so one contender
    // can hold its light and dark recordings and hand over whichever the arena asked for.
    function mediaFor(c, a) {
      let m = c.media;

      const spec = mediaSpec(m, Q.media);
      return spec ? mediaNode(spec, c.note ? `${c.name}: ${c.note}` : c.name) : null;
    }

    function renderBody(c, a) {

    // side is "a", "b", or null in the gallery.
    //

    // The notes for one contender, under its gallery card. Each one carries who it was

    function flushStandings() {
      if (!standingsDirty || view !== "results") return false;
      standingsDirty = false;
      const sorted = qVotes().sort((x, y) => x.t - y.t);

      });
      const rec = records(ids, sorted);
      const order = ids.slice().sort((x, y) => all[y] - all[x]);
      const rows = order.map((id, i) => {
        const c = byId[id];
        const nameCell = h("td");
        if (Q.swatch) {
          const sw = Q.swatch(c, { h });
          if (sw != null) nameCell.append(sw instanceof Node ? sw : h("span", { class: "td-swatch", style: `background:${sw}` }));
        }
        nameCell.append(document.createTextNode(c.name));
        // The percentile range is not symmetric, so the cell shows its half-width and
        // carries the range itself for anyone who wants the two ends.
        const eloCell = h("td", { class: "num", text: String(Math.round(all[id])) });
        if (conf.lo) {
          // The range goes on the cell rather than on the three characters of the spread,
          // so the hover target is the number you were already looking at. It goes on
          // aria-label as well as title: a <td> is not focusable and has no interactive
          // role, so a title alone is mouse-only, and the half-width is exactly where the
          // asymmetry the comment above admits to gets lost.
          const range = `${Math.round(conf.level * 100)}% of resamples land between ${Math.round(conf.lo[id])} and ${Math.round(conf.hi[id])}`;
          eloCell.title = range;
          eloCell.setAttribute("aria-label", `${Math.round(all[id])}. ${range}.`);
          eloCell.append(h("span", { class: "td-ci", text: `±${Math.round((conf.hi[id] - conf.lo[id]) / 2)}` }));
        }
        return h("tr", {},
          h("td", { class: "rank", text: String(i + 1) }),
          nameCell,
          eloCell,
          ...perSplit.map(s => h("td", { class: "num" + (s.best === id ? " td-lead" : ""), text: String(Math.round(s.r[id])) })),
          h("td", { class: "num", text: `${rec[id].w}–${rec[id].l}–${rec[id].t}` }));
      });
      $.standings.replaceChildren(...rows);
      if ($.callout) $.callout.textContent = calloutFor(conf, order);

      const recent = sorted.slice().reverse().slice(0, C.recent);
      $.feed.replaceChildren(...(recent.length ? recent.map(v => {
        const a = byId[v.a] ? byId[v.a].name : v.a, b = byId[v.b] ? byId[v.b].name : v.b;
        const w = v.w === "tie" ? `${a} = ${b}` : `${v.w === "a" ? a : b} beat ${v.w === "a" ? b : a}`;
        const why = typeof v.why === "string" ? v.why.trim() : "";
        // The bout and its timestamp are one line; the note gets its own underneath.
        // Inline, a note long enough to wrap pushes "just now" onto a line of its own
        // and the column of times stops being a column.
        return h("li", {},
          h("span", { class: "td-feed-line" },
            h("b", { text: w }), h("span", { text: describe(v) }),
            h("span", { class: "when", text: ago(v.t) })),
          // In the feed the note reads as what somebody said at the time, so it keeps
          // its quotes. On a card it is the card's own line and does not need them.
          why ? h("span", { class: "td-feed-why", text: `“${why}”` }) : null);
      }) : [h("li", { class: "td-empty", text: "No bouts yet. Vote above to start the table." })]));
      renderStatus();
      return true;
    }

    // The top two, in words, because the rank column reads 1, 2, 3, 4 whether or not the
    // votes have earned it and this is the sentence that says whether to believe it.
    // The rule itself lives in the core, because `results` on the command line prints
    // this same sentence and the two must not be able to disagree.
    function calloutFor(conf, order) {
      return verdictFor(conf, order, id => (byId[id] ? byId[id].name : id));
    }

    // Who is winning, without making you switch views to find out. A vote you cannot
    // see land feels like it went nowhere, and then you stop voting.
    //
    // The fit, not the bootstrap: this redraws on every vote, and a few hundred fits per
    // click to sharpen a sentence that says one name is not a trade worth making. The
    // gap is the crude version of the call the results view makes properly.
    function leaderLine() {
      const mine = qVotes();
      if (mine.length < 3) return "";
      const r = fit(ids, mine, { prior: C.confidence ? C.confidence.prior : 200 });
      const rank = ids.slice().sort((x, y) => r[y] - r[x]);
      return r[rank[0]] - r[rank[1]] < NOISE_FLOOR / Math.sqrt(mine.length)
        ? "Too close to call so far." : `${byId[rank[0]].name} leads.`;
    }

    // Where the votes are going. Sticky, because it is a fact about the page rather
    // than an event, and it is kept out of `note` so a page with no shared table does
    // not spend the rest of the session saying so instead of naming the leader.
    function storageLine() {
      if (stickyNote) return stickyNote;
      if (shared) {
        const n = qVotes().filter(v => !String(v.id).startsWith("local-")).length;
        return `${n} shared vote${n === 1 ? "" : "s"} so far.`;
      }
      return "Votes stay in this browser until the shared table connects.";
    }
    // The lock note beats everything: a row of dead buttons needs an explanation more
    // than a vote already visible in the Results count needs a confirmation.
    function renderStatus() {
      const n = qVotes().length;
      $.tabResults.textContent = n ? `Results (${n})` : "Results";
      $.status.textContent = lockNote || note || `${storageLine()} ${leaderLine()}`.trim();
    }
    // A sticky message is always the correction to whatever transient is on screen: it
    // is said when a vote was rejected, right after that vote said it was saved. Clearing
    // the transient is the point, otherwise the page spends two seconds claiming a vote
    // landed that did not.
    function say(msg, sticky) {
      if (sticky) { stickyNote = msg; note = ""; clearTimeout(noteTimer); renderStatus(); return; }
      note = msg; clearTimeout(noteTimer); renderStatus();
      noteTimer = setTimeout(() => { note = ""; renderStatus(); }, 2500);
    }

    // ---- notes ----
    // Offered after a vote lands, aimed at that vote. If there is unsent text in the box
    // it is left where it is, still aimed at the older vote: someone typing "the red one
    // reads as destructive" and voting again mid-sentence meant that about the pair they
    // were looking at, and quietly re-pointing it at a different pair would file it as a
    // remark nobody made. So voting stays free, and the sentence keeps its subject.
    function offerWhy(v, handle) {
      if (!C.comments || !$.whyBox) return;
      if (whyFor && $.why.value.trim()) return;
      whyFor = { v, handle };
      $.why.value = "";
      $.why.placeholder = whyLabel(v);
      $.whyBox.hidden = false;
      syncWhySubject();
    }
    // Shown as soon as there is text in the box, because that is exactly when the
    // placeholder stops saying it. The next duel is already on screen by then, so the
    // subject is never the pair in front of you.
    function syncWhySubject() {
      if (!$.whyOn) return;
      const v = whyFor && $.why.value.trim() ? whyFor.v : null;
      $.whyOn.textContent = v ? `about ${whySubject(v)}` : "";
      $.whyOn.hidden = !v;
    }
    function whySubject(v) {
      const name = id => (byId[id] ? byId[id].name : id);
      return v.w !== "a" && v.w !== "b"
        ? `${name(v.a)} = ${name(v.b)}`
        : `${name(v.w === "a" ? v.a : v.b)} over ${name(v.w === "a" ? v.b : v.a)}`;
    }
    // Both names, always. The next duel is already on screen by the time anyone reads
    // this, so a box that said only "Why Solid red?" would be asking about a pair that
    // is no longer in front of them, against two cards that are.
    function whyLabel(v) {
      const name = id => (byId[id] ? byId[id].name : id);
      if (v.w !== "a" && v.w !== "b") return `Why the tie between ${name(v.a)} and ${name(v.b)}? (optional)`;
      const win = v.w === "a" ? v.a : v.b, lose = v.w === "a" ? v.b : v.a;
      return `Why ${name(win)} over ${name(lose)}? (optional)`;
    }
    function clearWhy() {
      if (!$.whyBox) return;
      whyFor = null; $.why.value = ""; $.whyBox.hidden = true;
      syncWhySubject();
    }
    async function saveWhy() {
      const text = $.why ? $.why.value.trim() : "";
      if (!whyFor || !text) return;
      const { v, handle } = whyFor;
      // Written onto the vote itself rather than into a second collection. The note and
      // the bout are one fact, so Undo takes the note with the vote it explains, the
      // question tag is already right, and the shared table needs no new schema.
      const saved = { ...v, why: text.slice(0, C.comments.max) };
      clearWhy();
      if (handle && handle.set) {
        try { await handle.set(saved); } catch (e) { say("Couldn't save that note."); return; }
      } else {
        // The local vote object is the one in `votes`, so amend it in place and rewrite.
        const mine = votes.find(x => x.id === v.id);
        if (!mine) return;                     // undone while the note was being typed
        mine.why = saved.why;
        saveLocal();
      }
      renderStandings();
      say("Noted.");
    }

    // ---- voting ----
    function saveLocal() {
      try { localStorage.setItem(C.localKey, JSON.stringify(votes.filter(x => String(x.id).startsWith("local-")))); } catch (e) { /* storage blocked */ }
    }
    // stale: the vote was cast on a question you have since left, so it is recorded but
    // gets no Undo handle. Undo is "take back the vote you just cast on this page".
    function localVote(v, stale) {
      v.id = "local-" + v.t; votes.push(v);
      if (!stale) { myLast = { local: v.id }; $.undo.hidden = false; offerWhy(v, null); }
      saveLocal(); renderStandings();
    }
    async function vote(w) {
      if (!duel || lockNote) return;
      // `q` only on a dome that has questions, so a single-question dome's votes keep the
      // exact shape they had before questions existed and an old shared table still reads.
      const v = { a: duel.a, b: duel.b, w, ...arena().ids, t: Date.now() };
      if (C.multi) v.q = Q.id;
      const cards = $.duel.children;
      if (w === "a" && cards[0]) cards[0].classList.add("picked");
      if (w === "b" && cards[1]) cards[1].classList.add("picked");
      duel = null;
      // The write to the shared table takes a round trip, which is exactly long enough to
      // click another question. Everything after the await belongs to the question this
      // vote was cast on, so if that is no longer the one on screen, none of it happens:
      // the vote is saved either way, but its Undo handle, its confirmation and its next
      // duel would all land on a table they have nothing to do with. Undoing here would
      // delete a vote from a question you are not looking at and leave no trace.
      const token = voteToken;
      if (shared && votesCol) {
        try {
          const ref = votesCol.doc();
          await ref.set(v);
          if (token !== voteToken) return;
          myLast = ref; $.undo.hidden = false;
          // `v` has no id of its own on this path and should not gain one: identity is
          // the doc, and writing an id field into it would fight the snapshot's own.
          offerWhy(v, ref);
          say("Vote saved to the shared table.");
        } catch (e) {
          // The vote itself is still saved, correctly tagged. Only the handle and the
          // message are withheld, because those are about a page you have left.
          shared = false; localVote(v, token !== voteToken);
          if (token !== voteToken) return;
          say("You can view but not vote on the shared table here, so this vote stays in your browser.", true);
        }
      } else localVote(v);
      nextTimer = setTimeout(() => nextDuel(), 260);
    }
    async function undo() {
      if (!myLast) return;
      if (myLast.local) { const id = myLast.local; votes = votes.filter(v => v.id !== id); saveLocal(); renderStandings(); say("Vote removed."); }
      else { try { await myLast.delete(); say("Vote removed."); } catch (e) { say("Couldn't remove that vote."); } }
      // The note explains the vote, so it goes with it. Leaving the box open over a
      // bout that no longer exists would file the sentence against nothing.
      clearWhy();
      myLast = null; $.undo.hidden = true;
    }

    document.addEventListener("keydown", e => {
      // The duel is hidden on the results view, and a vote on a pair you cannot see is
      // bad data. It also means space is the page's own scroll key there, which is what
      // anyone reading a table of standings expects it to be.
      if (view !== "vote") return;
      if (e.metaKey || e.ctrlKey || e.altKey || e.repeat) return;
      const near = sel => e.target.closest && e.target.closest(sel);
      if (near("select,input,textarea,[contenteditable]")) return;   // typing always beats voting
      // A focused media player owns its own keys: space plays, arrows seek. Under
      // prefers-reduced-motion the controls are the only way to watch a clip at all.
      if (near("video,audio")) return;
      const k = e.key;
      // Space and Enter belong to whatever is focused. The arrows and digits do not:
      // clicking "Left wins" once leaves that button focused, and the keyboard has to
      // keep working afterwards or the fast path dies the first time you use the mouse.
      if ((k === " " || k === "Enter") && near("button,a,summary")) return;
      if (k === "ArrowLeft" || k === "1") vote("a");
      else if (k === "ArrowRight" || k === "2") vote("b");
      else if (k === "ArrowDown" || k === "3" || k === " ") vote("tie");
      // C only does something when there is a vote to write about, so on a dome with
      // comments off, or before the first vote, the key stays the browser's.
      else if ((k === "c" || k === "C") && $.whyBox && !$.whyBox.hidden) $.why.focus();
      else if (k === "s" || k === "S") nextDuel();
      else if (k === "u" || k === "U") undo();
      else if (k === "r" || k === "R") syncDuelVideos(true);
      else return;
      e.preventDefault();
    });

    // ---- boot ----
    try { const saved = JSON.parse(localStorage.getItem(C.localKey) || "[]"); if (Array.isArray(saved)) votes = saved; } catch (e) { /* no storage */ }
    {
      const r = fromHash();
      goto(r.q, r.view, true);
      // Write the question back into the URL if it was not there. The address bar is the
      // thing people copy, and a dome root that shows question one under a URL that does
      // not say so is a link that opens somewhere else for whoever you sent it to.
      // replaceState, not a hash assignment: the entry state should not become a step
      // that Back has to walk through.
      const want = hashFor(Q.id, view);
      if (C.multi && location.hash !== want && history.replaceState) {
        try { history.replaceState(null, "", want); } catch (e) { /* file:// with no history */ }
      }
    }

    (async () => {
      let db = null;
      try { db = await (root.claude && root.claude.use ? root.claude.use("db") : null); } catch (e) { db = null; }
      if (!db) { say("Shared votes aren't available in this view, so votes stay in your browser.", true); return; }
      votesCol = db.collection(C.collection); shared = true; renderStatus();
      votesCol.onSnapshot(snap => {
        const local = votes.filter(v => String(v.id).startsWith("local-"));
        votes = snap.docs.map(d => ({ ...d.data(), id: d.id })).concat(local);
        renderStandings();
      }, () => { shared = false; say("Lost the shared table, so votes stay in your browser for now.", true); });
    })();

    return {
      get votes() { return votes.slice(); },
      get question() { return Q.id; },
      next: nextDuel, vote, undo,
      go: (q, v) => {
        if (q != null && qids.indexOf(String(q).toLowerCase()) < 0) {
          throw new Error(`Thunderdome: no question "${q}"`);
        }
        location.hash = hashFor(q == null ? Q.id : String(q).toLowerCase(), v || view);
      },
    };
  }

  const api = { start, elo, fit, confidence, confidenceOpts, resampleCount, verdictFor, comments, records, pickPair, pairCounts, ago, normalize, normalizeDome, parseHash, hashFor, resolveArena, mediaSpec };
  root.Thunderdome = api;
  if (typeof module === "object" && module.exports) module.exports = api;
})(typeof window !== "undefined" ? window : globalThis);

</script>
<script>
// Starter config: the smallest useful thunderdome. Copy this folder, rename, edit.
// Contenders here are HTML snippets; see ../cmux-selection for a render function.

Thunderdome.start({
  id: "starter-primary-button",
  title: "Primary Button Thunderdome",
  lede: "Four primary buttons for a confirm dialog. Pick the one that reads as the default action without shouting.",
  contenders: [
    { id: "solid", name: "Solid", note: "Filled accent, white label",
      html: '<div class="stage"><button class="b solid">Save changes</button></div>' },
    { id: "outline", name: "Outline", note: "1px accent border, accent label",
      html: '<div class="stage"><button class="b outline">Save changes</button></div>' },
    { id: "tonal", name: "Tonal", note: "Accent at 16%, accent label",
      html: '<div class="stage"><button class="b tonal">Save changes</button></div>' },
    { id: "text", name: "Text only", note: "No container, semibold accent label",
      html: '<div class="stage"><button class="b text">Save changes</button></div>' },
  ],
  arena: {
    dimensions: [
      { id: "surface", label: "Surface", options: [
        { id: "paper", name: "Paper", dark: false },
        { id: "slate", name: "Slate", dark: true },
      ] },
      { id: "compact", label: "Compact", short: "compact", shuffle: true },
    ],
  },
  split: {
    values: [{ id: "light", label: "Light" }, { id: "dark", label: "Dark" }],
    of: a => a.surface && (a.surface.dark ? "dark" : "light"),
  },
  // Optional: wrap each snippet so the arena can style it. Without render, c.html is used as is.
  render: (c, a, { h }) => h("div", { class: `arena ${a.surface.id}${a.compact ? " compact" : ""}`, html: c.html }),
});

</script>
</body>
</html>
