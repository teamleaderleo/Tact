<!doctype html>
<!-- Generated by experiments/thunderdome/build.mjs from examples/cmux-empty-pane/config.js. Edit the config, then rebuild. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Empty Pane Thunderdome</title>
<meta name="description" content="Which should a new, empty cmux pane show by default? Two candidates, one terminal theme. Pick the one you would rather see. Today's look is in the pool as the control. Rankings are kept separately for dark and light themes. From manaflow-ai/cmux#15264.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;700&display=swap">
<style>
/* Thunderdome engine styles. Page chrome only; contender styles belong in the config's config.css.
   The look is a terminal notebook: JetBrains Mono for everything the page says about itself
   (title, arena, keys, buttons, tables), IBM Plex Sans for prose (the lede, notes, the
   feed), hairline rules instead of boxes, and a near-black ground in dark mode. */
:root{
  color-scheme:light;
  --bg:#EEF0F3; --panel:#F7F8FA; --ink:#1B1F27; --muted:#5D6573; --faint:#8A919E;
  --rule:#CFD4DC; --rule-strong:#B4BBC6; --hover:#E4E7EC; --win:#1F7A4D; --win-bg:#DCEFE4;
  --focus:#2F6FDE;
  --sans:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono","SF Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#111318; --panel:#171A20; --ink:#E4E7EE; --muted:#8B93A3; --faint:#646C7A;
    --rule:#2A2F39; --rule-strong:#3A404B; --hover:#1B1F26; --win:#6FD39F; --win-bg:#16291F;
    --focus:#6EA0FF;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#111318; --panel:#171A20; --ink:#E4E7EE; --muted:#8B93A3; --faint:#646C7A;
  --rule:#2A2F39; --rule-strong:#3A404B; --hover:#1B1F26; --win:#6FD39F; --win-bg:#16291F;
  --focus:#6EA0FF;
}
*{box-sizing:border-box}
/* A class selector outranks the UA's [hidden] rule, so anything the engine hides by
   property (the views, Undo, Replay, Reset, the arena controls) needs this or it stays on
   screen. Scoped to the places the engine does it, so a config's own [hidden] handling is
   left alone. */
.td-view[hidden],.td-vote button[hidden],.td-why[hidden],.td-row button[hidden],.td-arena[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);padding-inline:16px;padding-block:20px 48px}
.td-wrap{max-width:1040px;margin:0 auto;display:grid;gap:20px}
.td-view{display:grid;gap:20px;min-width:0}

/* ---- header: title and lede on the left, arena and views on the right ---- */
.td-head{display:flex;flex-wrap:wrap;gap:8px 24px;align-items:flex-start;justify-content:space-between}
.td-head-main{display:grid;gap:4px;min-width:0;flex:1 1 420px}
.td-head-side{display:grid;gap:8px;justify-items:end;flex:none;margin-left:auto}
.td-wrap h1{font:700 20px/1.2 var(--mono);letter-spacing:-.01em;text-transform:lowercase;margin:0;text-wrap:balance}
.td-lede{color:var(--muted);max-width:62ch;margin:0;font-size:13px}
.td-lede code{font-family:var(--mono);font-size:12px}
.td-arena-label{font:12px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.08em;background:none;border:0;padding:2px 0;cursor:pointer;text-align:right}
.td-arena-label:hover,.td-arena-label[aria-expanded=true]{color:var(--ink)}
.td-arena-label:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.td-tabs{display:flex;gap:14px;flex:none}
.td-tab{font:12px var(--mono);color:var(--faint);text-decoration:none;text-transform:lowercase;padding:1px 0;border-bottom:1px solid transparent;white-space:nowrap}
.td-tab:hover{color:var(--ink)}
.td-tab:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.td-tab[aria-current=page]{color:var(--ink);border-bottom-color:var(--ink)}

/* The arena controls, opened from the label top right. */
.td-arena{border-block:1px solid var(--rule)}
.td-controls{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;padding:10px 0}
.td-controls label{display:flex;gap:8px;align-items:center;font:12px var(--mono);color:var(--muted)}
.td-controls select{font:12px var(--mono);color:var(--ink);background:var(--bg);border:1px solid var(--rule-strong);border-radius:6px;padding:4px 8px}
.td-controls input[type=checkbox]{accent-color:var(--ink)}
.td-controls select:focus-visible,.td-controls input:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

/* One dome, several decisions. Reads as a row of questions rather than a second set of
   tabs, so it does not compete with vote/results for the same glance.
   Scrolls rather than wraps: the underline is pulled 1px onto the nav's own rule, and a
   wrapped row would drag that pull through the row above it. */
.td-qnav{display:flex;gap:0 18px;border-bottom:1px solid var(--rule);overflow-x:auto;scrollbar-width:none}
.td-qnav::-webkit-scrollbar{display:none}
.td-qtab{font:13px var(--mono);color:var(--muted);text-decoration:none;padding:8px 2px;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;flex:none}
.td-qtab:hover{color:var(--ink)}
.td-qtab:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
/* Colour and the underline mark the current tab. Bolding it too would change the label's
   width on selection and shuffle every tab to its right as you click along the row. */
.td-qtab[aria-current=page]{color:var(--ink);border-bottom-color:var(--ink)}
/* The question in words: the sentence the two cards below it are answering. */
.td-wrap h2.td-qtitle{font:600 17px/1.35 var(--sans);letter-spacing:-.005em;text-transform:none;color:var(--ink);margin:0 0 -8px;text-wrap:balance}
.td-qtitle:focus,.td-qtitle:focus-visible{outline:none}

/* Section labels: uppercase, letter-spaced mono. */
.td-wrap h2{font:700 13px/1.3 var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--ink);margin:0}
.td-section{display:grid;gap:8px;min-width:0}
.td-section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.td-row{display:flex;flex-wrap:wrap;gap:8px}
/* min-width so the heading row does not jump when the label becomes "Copied". */
.td-copy{flex:none;min-width:15ch;font:12px var(--mono);padding:5px 10px;border:1px solid var(--rule);border-radius:6px;background:transparent;color:var(--ink);cursor:pointer}
.td-copy:hover{border-color:var(--faint)}
.td-copy:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
/* Offscreen, not display:none: a textarea that is not rendered cannot be selected,
   and selecting it is the entire point of the fallback. */
.td-copy-sink{position:fixed;left:-9999px;top:0;opacity:0}

/* ---- the duel ---- */
.td-duel{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.td-card{border:2px solid transparent;border-radius:10px;padding:6px;display:grid;gap:8px;align-content:start;min-width:0}
.td-card-key{display:flex;justify-content:space-between;font:12px var(--mono);color:var(--muted)}
.td-card.picked{border-color:var(--win)}
.td-card.td-live{cursor:pointer}
.td-card.td-live:hover{border-color:var(--focus)}
.td-card.td-live:hover .td-card-key{color:var(--ink)}
/* Clicks land on the card, not on whatever the mock happens to contain. Configs whose
   contenders are meant to be poked at set interactiveCards and keep their own events. */
.td-card.td-live .td-card-body{pointer-events:none}
/* Except the player's own controls. Under prefers-reduced-motion nothing autoplays and
   these are the only way to watch a clip at all, so swallowing the play button would
   leave the duel unwatchable and turn the attempt into a vote. */
.td-card.td-live .td-card-body video[controls],.td-card.td-live .td-card-body audio[controls]{pointer-events:auto}
@media (prefers-reduced-motion:no-preference){
  .td-card .td-card-body{transition:transform .12s}
  .td-card.td-live:hover .td-card-body{transform:translateY(-2px)}
}
.td-card-head{display:grid;gap:1px}
.td-card-name{font:12px var(--mono);color:var(--ink)}
.td-card-note{font-size:12px;color:var(--muted)}
.td-card-body{min-width:0}
.td-media{display:grid;place-items:center;min-width:0;min-height:72px;border-radius:8px;overflow:hidden}
.td-media.td-framed{background:var(--panel);border:1px solid var(--rule)}
.td-media>img,.td-media>video{display:block;width:100%;height:auto;max-height:min(52vh,440px);background:transparent}
.td-media>video[controls]{max-height:min(48vh,400px)}
.td-gallery .td-media>img,.td-gallery .td-media>video{max-height:220px}
.td-media.td-media-broken{background:var(--panel);border:1px dashed var(--rule-strong)}
.td-media-fail{display:grid;gap:4px;justify-items:center;text-align:center;padding:20px 14px;font-size:12.5px;color:var(--muted)}
.td-media-fail b{color:var(--ink);font-weight:500}
.td-media-fail code{font-family:var(--mono);font-size:11px;color:var(--faint);word-break:break-all}

/* "← left wins [Left] [Tie ↓] [Right] right wins →  N votes" */
.td-vote{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center;font:13px var(--mono);color:var(--muted)}
.td-vote button{font:13px var(--mono);color:var(--ink);background:transparent;border:1px solid var(--rule);border-radius:6px;padding:6px 12px;cursor:pointer}
.td-vote button:hover{border-color:var(--faint)}
.td-vote button:disabled{opacity:.45;cursor:not-allowed;border-color:var(--rule)}
.td-vote button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.td-count{font-variant-numeric:tabular-nums}
.td-vote-more{margin-top:-12px;gap:4px 14px}
.td-vote button.quiet{font-size:12px;border-color:transparent;color:var(--faint);padding:2px 4px}
.td-vote button.quiet:hover{color:var(--ink)}
.td-vote kbd,.td-why kbd{font:11px var(--mono);color:var(--faint);margin-left:6px}

/* The note box. Quiet by design: it sits under the vote row so it never moves the
   buttons, and it is the last thing on the page to ask for attention. */
.td-why{display:flex;gap:8px;justify-content:center;align-items:center;margin-top:-8px}
.td-why-input{font:inherit;font-size:13px;color:var(--ink);background:transparent;border:1px solid var(--rule);border-radius:6px;padding:6px 10px;width:min(420px,100%)}
.td-why-input::placeholder{color:var(--faint)}
.td-why-input:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-color:var(--rule-strong)}
.td-why button{font:12px var(--mono);color:var(--muted);background:none;border:1px solid transparent;border-radius:6px;padding:6px 8px;cursor:pointer}
.td-why button:hover{color:var(--ink)}
.td-why button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.td-why-on{font:11px var(--mono);color:var(--faint);white-space:nowrap}
.td-status{font-size:12.5px;color:var(--muted);text-align:center;min-height:1.5em;margin-top:-10px}

/* ---- tables: the boards on the vote view and the standings on the results view ---- */
.td-boards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:24px}
.td-board{display:grid;gap:6px;align-content:start;min-width:0}
.td-board table,.td-table-wrap table{width:100%;border-collapse:collapse;font:13px var(--mono);font-variant-numeric:tabular-nums}
.td-board th,.td-board td,.td-table-wrap th,.td-table-wrap td{padding:6px 8px;border-bottom:1px solid var(--rule);text-align:left;white-space:nowrap}
.td-board th,.td-table-wrap th{color:var(--muted);font-weight:400;text-transform:lowercase}
.td-board .num,.td-table-wrap .num{text-align:right}
.td-table-wrap{overflow-x:auto}
.td-table-wrap td.rank{color:var(--faint);width:1%}
.td-swatch{display:inline-block;width:28px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:8px}
/* The interval rides along with the rating rather than taking a column of its own: it is
   a qualifier on that number, and a column would let the eye scan the spreads on their
   own as if they were a second ranking. A fixed slot, so a table holding a ±9 next to a
   ±107 keeps its ratings in a column. */
.td-ci{display:inline-block;min-width:3.4em;margin-left:6px;text-align:right;color:var(--faint);font-size:11.5px}
/* The sentence the table is evidence for, so it is not muted into a caption. */
.td-callout{margin:0;font-size:13px;color:var(--ink)}
.td-lead{color:var(--win);font-weight:700}

/* The results as JSON, for pasting into the thread that asked. */
.td-export{width:100%;min-height:70px;font:11px/1.5 var(--mono);background:transparent;color:var(--muted);border:1px solid var(--rule);border-radius:6px;padding:8px;resize:vertical}
.td-export:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

/* Notes under a gallery card. The rule on the left is what makes a stack of them read
   as quotation rather than as more of the card's own copy. */
.td-whys{display:grid;gap:7px;margin:4px 0 0;padding:0;list-style:none}
.td-whys li{font-size:12.5px;line-height:1.45;color:var(--muted);border-left:2px solid var(--rule);padding-left:9px}
.td-why-text{color:var(--ink);display:block}
.td-why-vs{font:11px var(--mono);color:var(--faint)}
.td-feed-why{font-style:italic;display:block}

/* ---- results view ---- */
.td-two{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:28px;align-items:start}
.td-feed{display:grid;gap:6px;font-size:13px;color:var(--muted);margin:0;padding:0;list-style:none}
.td-feed li{display:grid;gap:3px;padding-bottom:6px;border-bottom:1px solid var(--rule)}
.td-feed-line{display:flex;gap:8px;flex-wrap:wrap;align-items:baseline}
.td-feed b{color:var(--ink);font-weight:500}
.td-feed .when{font:11.5px var(--mono);color:var(--faint);margin-left:auto}
.td-gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:14px}
/* #galleryN: four across, for a screenshot of the whole field. */
.td-gallery.td-gallery-grid{grid-template-columns:repeat(4,minmax(0,1fr))}
.td-gallery .td-card{padding:0;gap:6px;border:0}
.td-gallery .td-card-name{color:var(--muted)}
.td-empty{color:var(--faint);font-size:13px;padding:6px 0;border-bottom:0!important}
@media (max-width:900px){.td-gallery.td-gallery-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px){
  .td-duel,.td-two{grid-template-columns:1fr}
  .td-head-side{justify-items:start;margin-left:0}
  .td-arena-label{text-align:left}
  /* One column, so "left" is the card on top and the arrows point at nothing. */
  .td-side-arrow{visibility:hidden}
  .td-vote-hint{display:none}
}
@media (max-width:480px){.td-gallery.td-gallery-grid{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* One empty cmux pane: a tab strip over a terminal-colored body. The theme colors are
   inline (they come from the arena); this is only the shape. */
.pane{position:relative;aspect-ratio:16/11;border-radius:8px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 1px 0 rgba(0,0,0,.06),0 8px 24px rgba(0,0,0,.12)}

.pane .body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:12px;min-height:0}
.pane pre.art{margin:0;font:12px/1.15 var(--mono);white-space:pre}
.pane .buttons{display:flex;gap:8px}
.pane .btn{font:12px var(--sans);padding:4px 10px;border-radius:6px;display:inline-flex;gap:6px;align-items:center}
.pane .control-title{font:600 15px var(--sans)}
/* Four across in #galleryN leaves each pane about 240px wide; the art scales with it. */

.td-gallery .pane .btn{font-size:9px;padding:2px 7px}
.td-gallery .pane .control-title{font-size:11px}
.td-gallery .pane svg{width:30px;height:26px}

</style>

<body>
<noscript>This page needs JavaScript to run the duels.</noscript>
<script>
/*
 * Thunderdome: pairwise design judgment with a shared Elo table.
 *
 * A config calls Thunderdome.start({...}) with contenders, arena dimensions,
 * an optional split, and a render function. The engine supplies pairing,
 * voting UI, keyboard shortcuts, fitted ratings on the Elo scale with a
 * bootstrap interval (overall and per split), W-L-T, recent bouts, the
 * gallery, undo, and shared (claude.ai db) or local storage.
 * A contender can be an image, a GIF or a video instead of markup; the two
 * clips in a duel are restarted together so the comparison stays honest.
 * See ../README.md for the config reference.
 */
(function (root) {
  "use strict";

  const RESERVED = new Set(["id", "a", "b", "w", "t", "q"]);
  const VIEWS = new Set(["vote", "results"]);
  // The vote view will not name a leader until the top two are NOISE_FLOOR / sqrt(bouts)
  // Elo points apart. A fitted rating's spread shrinks with the square root of the vote
  // count, so a fixed number of points is the wrong shape: 40 points is a coin flip at 20
  // votes and old news at 800. Measured against the results view's own 95%-of-resamples
  // call over 120 runs at each of 20/60/120/300/800 votes, this rule agrees with it
  // 95-100% of the time, where a flat 40 agreed 40% at 20 votes; and on a field with a
  // genuine winner the two views name one at the same rate to within two points.
  const NOISE_FLOOR = 1000;

  // ---------- pure core (no DOM; exercised by test.mjs) ----------

  function pairKey(a, b) { return [a, b].sort().join("|"); }

  function pairCounts(votes) {
    const c = {};
    for (const v of votes) { const k = pairKey(v.a, v.b); c[k] = (c[k] || 0) + 1; }
    return c;
  }

  // Weighted random pair: weight 1/(1+n)^2 where n is how often the pair has met.
  // Never repeats the previous pair when another exists. Returns {a, b, key} with sides shuffled.
  function pickPair(ids, votes, lastKey, rand) {
    rand = rand || Math.random;
    const counts = pairCounts(votes), pairs = [];
    for (let i = 0; i < ids.length; i++) for (let j = i + 1; j < ids.length; j++) {
      const k = pairKey(ids[i], ids[j]);
      if (k === lastKey && ids.length > 2) continue;
      pairs.push({ k, a: ids[i], b: ids[j], w: 1 / Math.pow(1 + (counts[k] || 0), 2) });
    }
    if (!pairs.length) return null;
    let r = rand() * pairs.reduce((s, p) => s + p.w, 0), chosen = pairs[0];
    for (const p of pairs) { r -= p.w; if (r <= 0) { chosen = p; break; } }
    return rand() < .5 ? { a: chosen.a, b: chosen.b, key: chosen.k } : { a: chosen.b, b: chosen.a, key: chosen.k };
  }

  // Sequential Elo over votes in time order. Every contender starts at `start`.
  function elo(ids, votes, k, start) {
    k = k || 24; start = start || 1500;
    const r = Object.fromEntries(ids.map(id => [id, start]));
    for (const v of votes) {
      if (!(v.a in r) || !(v.b in r) || v.a === v.b) continue;
      const ea = 1 / (1 + Math.pow(10, (r[v.b] - r[v.a]) / 400));
      const sa = v.w === "a" ? 1 : v.w === "b" ? 0 : .5;
      r[v.a] += k * (sa - ea); r[v.b] += k * ((1 - sa) - (1 - ea));
    }
    return r;
  }

  // Elo points per unit of natural log-odds. A 400-point gap is 10:1, which is the
  // definition of the scale, so the whole fit can work in log-odds and convert once.
  const SCALE = 400 / Math.log(10);

  // Bradley-Terry fitted by maximum likelihood, with an L2 prior of `prior` Elo points
  // pulling every contender toward `start`. Coordinate Newton, swept Gauss-Seidel: each
  // contender is stepped against the ratings as they stand right now, including the ones
  // already moved in this sweep.
  //
  // Doing it the other way, computing every gradient from the ratings at the top of the
  // sweep and then moving everything at once, is Jacobi iteration, and it diverges. Two
  // contenders who mostly fight each other are almost perfectly anticorrelated: each
  // one's step already accounts for the gap closing, so taking both moves the gap twice
  // as far as it should, and the overshoot lands where the sigmoid is flat and the next
  // step is bigger still. A two-contender dome at 200 votes ran to -12776 that way.
  // The step clamp below is the seatbelt, but the sweep order is the fix.
  //
  // This is what the table shows, rather than the sequential elo() above, for two
  // reasons. It does not depend on the order the votes arrived in, which a table read at
  // the end of a run should not. And it is a model you can resample, which is what makes
  // the interval next to it mean something; an interval bootstrapped from one model and
  // printed beside a point estimate from another is a decoration, not a measurement.
  //
  // The prior is also what keeps an undefeated contender finite. Plain Bradley-Terry
  // sends it to infinity, and "Elo 4180" after three bouts is not a useful thing to read.
  //
  // `mu` moves where the prior pulls each contender, in Elo points relative to the field.
  // Nothing calls it with a `mu` except confidence(), which uses it to let the interval
  // see the prior's own uncertainty as well as the votes'.
  function fit(ids, votes, opts) {
    const o = opts || {}, prior = o.prior || 200, start = o.start == null ? 1500 : o.start;
    const n = ids.length, idx = {};
    ids.forEach((id, i) => { idx[id] = i; });
    // One flat [opponent, score, opponent, score, ...] list per contender, so a sweep
    // reads only the bouts of the contender it is about to move.
    const r = new Float64Array(n), bouts = [];
    for (let i = 0; i < n; i++) bouts.push([]);
    for (const v of votes) {
      const i = idx[v.a], j = idx[v.b];
      if (i === undefined || j === undefined || i === j) continue;
      const s = v.w === "a" ? 1 : v.w === "b" ? 0 : .5;
      bouts[i].push(j, s); bouts[j].push(i, 1 - s);
    }
    const pv = Math.pow(prior / SCALE, 2);  // the prior's variance in log-odds
    // A mu is a statement about the field, so only its shape matters: centering it here
    // keeps the sweep's own recentering below a descent step rather than a fudge.
    const mu = new Float64Array(n);
    if (o.mu) {
      let mm = 0;
      for (let i = 0; i < n; i++) mm += o.mu[i] || 0;
      mm /= n;
      for (let i = 0; i < n; i++) mu[i] = ((o.mu[i] || 0) - mm) / SCALE;
    }
    for (let sweep = 0; sweep < 200; sweep++) {
      let move = 0;
      for (let i = 0; i < n; i++) {
        let g = -(r[i] - mu[i]) / pv, hess = 1 / pv;
        const b = bouts[i];
        for (let m = 0; m < b.length; m += 2) {
          const p = 1 / (1 + Math.exp(-(r[i] - r[b[m]])));
          g += b[m + 1] - p; hess += p * (1 - p);
        }
        // One log-odds unit is 174 Elo points. A step longer than that is the sigmoid
        // being flat, not the answer being far away, and the next sweep will take
        // another one anyway.
        const step = Math.max(-1, Math.min(1, g / hess));
        r[i] += step;
        move = Math.max(move, Math.abs(step));
      }
      // Recenter on `start`. Bradley-Terry is identified only up to an additive constant,
      // so shifting the whole field leaves the likelihood alone and can only shrink the
      // prior's sum of squares: this is a descent step, not a cosmetic one. It is also
      // the only fast way along that direction. The data pins the gaps with the weight of
      // every bout behind them and leaves the field's mean to the prior alone, so a sweep
      // that has the gaps right can still be hundreds of sweeps from the right offset.
      let mean = 0;
      for (let i = 0; i < n; i++) mean += r[i];
      mean /= n;
      for (let i = 0; i < n; i++) r[i] -= mean;
      if (move < 1e-10) break;
    }
    const out = {};
    for (let i = 0; i < n; i++) out[ids[i]] = start + r[i] * SCALE;
    return out;
  }

  // Seeded so the same votes always produce the same interval. An interval that shifts a
  // few points every time the table redraws reads as measurement noise on top of the
  // measurement, and invites the reader to redraw until they like the answer.
  function lcg(seed) {
    let s = (seed >>> 0) || 1;
    return () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296;
  }

  // A standard normal from a uniform stream, so the prior draw below is as reproducible
  // as the vote resampling next to it.
  function normalFrom(rand) {
    let u = 0, v = 0;
    while (!u) u = rand();
    while (!v) v = rand();
    return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
  }

  // Ratings with an interval. The point estimate is fit(). The interval is the percentile
  // range of fit() over `resamples` refits, each one taking two draws: the votes are
  // resampled with replacement, and the prior's centre is drawn from the prior itself.
  //
  // The second draw is the one that is easy to leave out and wrong to. Resampling only
  // the votes asks "how much would this rating move if the same voters voted again",
  // which is the whole question for a contender with a mixed record and no question at
  // all for one with a 0-0-0 or an unbeaten one: every resample of an all-wins record is
  // still all wins, the rating is pinned by the prior, and the table prints an unbeaten
  // contender on 20 bouts as +/-3 and a contender who has never fought at all as +/-0.
  // Those two are the least certain rows on the page. Drawing the prior's centre as well
  // puts the prior's own spread into the interval, which is where the uncertainty for
  // those rows actually lives. Measured against known truth over 150 runs at each size,
  // 4 contenders, nominal 90%: coverage 84/82/90/88% at 20/60/200/600 votes with the
  // votes alone, 92/86/91/89% with both draws, and the well-fed half-widths are
  // unchanged (48 -> 49 at 200 votes, 28 -> 29 at 600). It only widens where the votes
  // alone were claiming more than they knew.
  //
  // fit() centers on the field, so every refit is already comparable to the last.
  // Bradley-Terry is identified only up to an additive constant, and an uncentered refit
  // carries a whole-field shift that says nothing about any one contender: a 25-point
  // shift swallows a 26-point interval whole, and coverage of a nominal 90% interval
  // measured 60% uncentered against 91% centered. The table is read as an ordering, so
  // the quantity the interval has to cover is each rating relative to the field.
  //
  // Under `minBouts` votes it reports no interval at all. A handful of votes still
  // returns a number, and the reader has no way to tell it from an earned one.
  function confidence(ids, votes, opts) {
    const o = opts || {};
    const prior = o.prior || 200;
    const minBouts = o.minBouts == null ? 8 : o.minBouts;
    const level = o.level == null ? .9 : o.level;
    const resamples = o.resamples == null ? 300 : o.resamples;
    const known = {};
    ids.forEach(id => { known[id] = true; });
    const usable = votes.filter(v => known[v.a] && known[v.b] && v.a !== v.b);
    const rating = fit(ids, usable, { prior });
    const bouts = usable.length;
    if (bouts < minBouts || resamples < 2) {
      return { rating, bouts, level, resamples: 0, lo: null, hi: null, ahead: null };
    }
    const cols = {}, ahead = {};
    for (const id of ids) {
      cols[id] = new Float64Array(resamples);
      ahead[id] = {};
      for (const other of ids) ahead[id][other] = 0;
    }
    const rand = lcg(bouts * 2654435761 + ids.length);
    const draw = new Array(bouts), mu = new Array(ids.length);
    for (let b = 0; b < resamples; b++) {
      for (let i = 0; i < bouts; i++) draw[i] = usable[(rand() * bouts) | 0];
      for (let i = 0; i < ids.length; i++) mu[i] = normalFrom(rand) * prior;
      const f = fit(ids, draw, { prior, mu });
      for (const id of ids) cols[id][b] = f[id];
      for (let i = 0; i < ids.length; i++) for (let j = i + 1; j < ids.length; j++) {
        const x = ids[i], y = ids[j], d = f[x] - f[y];
        ahead[x][y] += d > 0 ? 1 : d < 0 ? 0 : .5;
        ahead[y][x] += d < 0 ? 1 : d > 0 ? 0 : .5;
      }
    }
    const tail = (1 - level) / 2;
    const at = (col, p) => col[Math.min(resamples - 1, Math.max(0, Math.round(p * (resamples - 1))))];
    const lo = {}, hi = {};
    for (const id of ids) {
      const col = cols[id].slice().sort();
      lo[id] = at(col, tail); hi[id] = at(col, 1 - tail);
    }
    for (const id of ids) for (const other of ids) ahead[id][other] /= resamples;
    return { rating, bouts, level, resamples, lo, hi, ahead };
  }

  // Every fit costs a pass over the votes, so the resample count comes down as the vote
  // list grows. It is the same trade in both directions: a short list needs the
  // resamples because its interval is wide and ragged, a long list has a narrow
  // interval that another 240 fits would not sharpen. 8 contenders and 2000 votes is
  // about 50ms, against 250ms at a flat 300.
  function resampleCount(m) {
    return Math.max(40, Math.min(300, Math.round(120000 / Math.max(1, m))));
  }

  // What to hand `confidence` for a dome, given how many votes it has. `confidence:
  // false` normalises to null, and the opt-out has to be spelled out rather than left
  // to a default: no resamples and a bout floor nothing can clear, which is what makes
  // the interval and the verdict come back empty.
  //
  // Up here rather than in the DOM layer because two callers now draw this table, and
  // a second copy of these three numbers is a table that reads 1653 ±19 in the browser
  // and 1653 ±20 on a terminal for the same votes. That happened.
  function confidenceOpts(C, voteCount) {
    return C.confidence
      ? { ...C.confidence, resamples: resampleCount(voteCount) }
      : { resamples: 0, minBouts: Infinity };
  }

  // The claim in words. "1612 ±48" next to "1564 ±51" is a puzzle the reader has to do
  // arithmetic on; "ahead in 96% of resamples" is the answer to the question they opened
  // the page with.
  //
  // The bar is the one-sided form of the interval's own level: a 90% interval leaves 5%
  // in each tail, so the call it corresponds to is 95%. Derived rather than written
  // down, so a dome that sets `confidence: {level}` gets a verdict that agrees with the
  // number in the hover text instead of one fixed at somebody else's level. The
  // comparison is against the raw share and only the display is rounded, or a share of
  // .9457 would be called a lead by a page that also prints it as 95%.
  //
  // `name` maps an id to what to call it; callers that have no names can pass nothing.
  function verdictFor(conf, order, name) {
    const nm = name || (id => id);
    if (!conf.ahead) {
      return conf.bouts
        ? `Not enough bouts to say who is ahead yet: ${conf.bouts} so far.`
        : "No bouts yet, so the table is the prior and nothing else.";
    }
    const [a, b] = order, share = conf.ahead[a][b], pct = Math.round(share * 100);
    return share >= 1 - (1 - conf.level) / 2
      ? `${nm(a)} is ahead of ${nm(b)} in ${pct}% of resamples.`
      : `${nm(a)} and ${nm(b)} are too close to call: ${pct}% of resamples put ${nm(a)} ahead.`;
  }

  function records(ids, votes) {
    const rec = Object.fromEntries(ids.map(id => [id, { w: 0, l: 0, t: 0 }]));
    for (const v of votes) {
      if (!rec[v.a] || !rec[v.b]) continue;
      if (v.w === "tie") { rec[v.a].t++; rec[v.b].t++; }
      else if (v.w === "a" || v.w === "b") {
        const win = v.w === "a" ? v.a : v.b, lose = v.w === "a" ? v.b : v.a;
        rec[win].w++; rec[lose].l++;
      }
    }
    return rec;
  }

  // Every note people left while voting, gathered per contender, newest first.
  //
  // A note is written about a vote, not about a contender in the abstract, so it belongs
  // to whoever won that vote. That is the whole reason this is worth having: "too heavy"
  // is not an opinion about a button, it is an opinion about a button next to another
  // one, and `vs` carries the other side so the remark still means something when you
  // read it a week later on a card. A note left on a tie is a remark about the pair, so
  // it lands on both, which is not duplication: it was said about both.
  //
  // Votes for contenders this question does not know are dropped, exactly as the ratings
  // drop them, so a note from an old question cannot surface under a new one.
  function comments(ids, votes) {
    const out = {};
    for (const id of ids) out[id] = [];
    for (const v of votes || []) {
      const text = typeof v.why === "string" ? v.why.trim() : "";
      if (!text || !out[v.a] || !out[v.b] || v.a === v.b) continue;
      const tie = v.w !== "a" && v.w !== "b";
      const on = tie ? [v.a, v.b] : [v.w === "a" ? v.a : v.b];
      for (const id of on) out[id].push({ text, t: v.t || 0, vs: id === v.a ? v.b : v.a, tie, vote: v.id });
    }
    // Newest first, and ties broken by id so two notes written in the same millisecond
    // (an import, a seeded dome) do not shuffle between renders.
    for (const id of ids) out[id].sort((x, y) => y.t - x.t || String(x.vote).localeCompare(String(y.vote)));
    return out;
  }

  // ---- the result, as data and as text ----
  // A dome's whole answer: one table per question, each one a ranking, a record and the
  // sentence that says whether to believe it. The page draws it, the command line
  // prints it and GitHub gets it as markdown, all from here, because three renderings
  // of the same run that disagree about a number are worse than no rendering at all.

  // Which votes belong to a question. An untagged vote counts toward the first one: a
  // dome that grew a second question after people had already voted should not throw
  // their votes away.
  function votesFor(D, Q, votes) {
    return D.multi
      ? votes.filter(v => v.q === Q.id || (v.q == null && Q === D.questions[0]))
      : votes.slice();
  }

  function tableFor(D, Q, votes) {
    const ids = Q.contenders.map(c => c.id);
    const byId = Object.fromEntries(Q.contenders.map(c => [c.id, c]));
    const mine = votesFor(D, Q, votes).slice().sort((a, b) => a.t - b.t);
    const conf = confidence(ids, mine, confidenceOpts(D, mine.length));
    const rec = records(ids, mine);
    const order = ids.slice().sort((x, y) => conf.rating[y] - conf.rating[x]);
    const name = id => (byId[id] ? byId[id].name : id);
    const rows = order.map((id, i) => ({
      rank: i + 1,
      id,
      name: name(id),
      rating: Math.round(conf.rating[id]),
      spread: conf.lo ? Math.round((conf.hi[id] - conf.lo[id]) / 2) : null,
      // En dashes, as the browser table writes them, so a record pasted from a terminal
      // and a record read off the page are the same string.
      record: `${rec[id].w}–${rec[id].l}–${rec[id].t}`,
    }));
    // `confidence: false` builds a page with no callout under the table at all, so there
    // is no sentence to match. Printing one anyway said "not enough bouts to say who is
    // ahead yet" under a table with 240 bouts in it, which is both wrong and the exact
    // disagreement between terminal and browser this function exists to rule out.
    const verdict = D.confidence ? verdictFor(conf, order, name) : null;
    return { question: Q.id, title: Q.title || Q.label || "", bouts: conf.bouts, rows, verdict };
  }

  // `D` is already normalized; `cfg` is a raw config, the same object the page was
  // started with. Two entry points and one body, because the page has a normalized dome
  // in hand and the command line has a config it just read off disk, and the version
  // where each of them writes its own one-line loop is the version where the page's
  // copy quietly grows a second argument.
  function tablesForDome(D, votes) {
    return D.questions.map(Q => tableFor(D, Q, votes));
  }

  function tablesFor(cfg, votes) {
    return tablesForDome(normalizeDome(cfg), votes);
  }

  // A contender's name can be alt text a stranger typed into an issue, and this table is
  // going straight back into that issue under your name. Everything a stranger could
  // have chosen goes through here, the verdict sentence included, since it is made of
  // two contender names.
  //
  // Four separate things have to be defused, and only the first is the obvious one:
  //
  // - Inline markup. An unescaped pipe is a row with an extra cell in a four-column
  //   table, which is a wrecked table at best and a forged one at worst; a newline ends
  //   the row early and turns the rest into prose; `[click me](https://evil.example)` is
  //   a live link you did not write.
  // - Block openers. `cell()`'s output also starts three lines that are not table rows:
  //   the two heading lines and the verdict paragraph, which begins with the top-ranked
  //   name. A leading `#` there is an H1 in somebody's issue with text you did not
  //   choose in it; a leading `-` is a list; leading spaces are a code block.
  // - Mentions. GitHub decodes `&#64;` before it looks for mentions and a backslash does
  //   not stop one either, both checked against its own renderer, so `@someone` in a
  //   name subscribes a stranger to the thread and mails them, from your account, every
  //   time the table is posted. A word joiner after the `@` is invisible, survives a
  //   copy and paste, and is the only thing found that GitHub respects.
  // - Bare URLs, which GFM autolinks with no brackets at all. `&#58;` and `&#46;` do
  //   work here (also checked), and a name that was meant to be a URL still reads as
  //   one; it just is not clickable.
  const cell = s => String(s)
    .replace(/\s+/g, " ").trim()
    .replace(/([\\`*_[\]<>|~])/g, "\\$1")
    .replace(/^([#+-])/, "\\$1")
    .replace(/^(\d+)([.)])/, "$1\\$2")
    .replace(/@(?=\w)/g, "@⁠")
    .replace(/:\/\//g, "&#58;//")
    .replace(/\bwww\./gi, "www&#46;");

  // GFM tables, no HTML of our own inside the table, so it renders the same in an issue
  // body, a PR body and a comment. `meta` carries the title and `askedBy`; a raw config
  // or a normalized dome both work, since both have those two fields.
  function markdown(tables, meta) {
    const out = [];
    if (meta && meta.title) out.push(`## ${cell(meta.title)}`, "");
    for (const t of tables) {
      if (t.title) out.push(`### ${cell(t.title)}`, "");
      out.push("| # | | Elo | W–L–T |", "|---:|---|---:|---:|");
      for (const r of t.rows) {
        const elo = r.spread == null ? String(r.rating) : `${r.rating} ±${r.spread}`;
        out.push(`| ${r.rank} | ${cell(r.name)} | ${elo} | ${r.record} |`);
      }
      out.push("", t.verdict ? cell(t.verdict) : "", "");
    }
    if (meta && meta.askedBy) out.push(`Asked by ${cell(meta.askedBy)}.`);
    return out.join("\n").replace(/\n{3,}/g, "\n\n").trim() + "\n";
  }

  function ago(t, now) {
    const s = Math.max(0, ((now || Date.now()) - t) / 1000);
    if (s < 60) return "just now";
    if (s < 3600) return `${Math.floor(s / 60)}m ago`;
    if (s < 86400) return `${Math.floor(s / 3600)}h ago`;
    return `${Math.floor(s / 86400)}d ago`;
  }

  const VIDEO_EXT = /\.(mp4|webm|mov|m4v|ogv)(?:[?#]|$)/i;

  // A contender's `media` becomes {kind, src, poster, alt, fit, loop, aspect}.
  // Accepts "shot.png" or {src, ...}; `defaults` is the config-level `media` block.
  // The kind is read off the extension, so a data URI or an extension-less URL
  // (a signed CI artifact link, say) needs an explicit `kind` or it renders as an image.
  function mediaSpec(media, defaults) {
    if (typeof media === "string") media = { src: media };
    if (!media || !media.src) return null;
    const d = defaults || {}, src = String(media.src);
    return {
      kind: media.kind || d.kind || (VIDEO_EXT.test(src) || /^data:video\//i.test(src) ? "video" : "img"),
      src,
      poster: media.poster || d.poster || null,
      alt: media.alt == null ? (d.alt || "") : media.alt,
      fit: media.fit || d.fit || "contain",
      loop: (media.loop == null ? d.loop : media.loop) !== false,
      aspect: media.aspect || d.aspect || null,
      // Off by default: most media is an opaque screenshot or clip that brings its own
      // surface, and a box around it reads as a second card. Turn it on for icons and
      // anything else with transparency to sit on.
      frame: media.frame == null ? !!d.frame : !!media.frame,
    };
  }

  function normalize(cfg) {
    if (!cfg || !cfg.id) throw new Error("Thunderdome: config needs an id");
    const contenders = (cfg.contenders || []).map(c => ({ note: "", ...c }));
    if (contenders.length < 2) throw new Error("Thunderdome: need at least two contenders");
    const seen = new Set();
    for (const c of contenders) {
      if (!c.id || seen.has(c.id)) throw new Error(`Thunderdome: contender ids must be unique and non-empty (${c.id})`);
      seen.add(c.id);
    }
    const dims = ((cfg.arena && cfg.arena.dimensions) || cfg.dimensions || []).map(d => {
      if (RESERVED.has(d.id)) throw new Error(`Thunderdome: dimension id "${d.id}" is reserved`);
      const type = d.type || (d.options ? "select" : "toggle");
      return { label: d.id, ...d, type, shuffle: d.shuffle ?? (type === "select") };
    });
    const C = {
      k: 24, recent: 8, collection: "votes", contenderLabel: "Contender",
      galleryTitle: "Everyone in this arena", media: {}, interactiveCards: false, blind: true,
      ...cfg,
      contenders, dims,
      localKey: cfg.localKey || `thunderdome:${cfg.id}:local`,
    };
    // `confidence: false` drops the interval and the line under the table and leaves a
    // bare rating. Anything else is the settings, with the defaults filled in.
    C.confidence = cfg.confidence === false ? null : {
      prior: 200, minBouts: 8, level: .9,
      ...(cfg.confidence && typeof cfg.confidence === "object" ? cfg.confidence : {}),
    };
    // `comments: false` drops the box and the notes under the cards. `max` is a length,
    // not a policy: one line is the format, and a box that stops you at the end of it
    // says so better than a paragraph nobody reads under a card.
    C.comments = cfg.comments === false ? null : {
      max: 140,
      ...(cfg.comments && typeof cfg.comments === "object" ? cfg.comments : {}),
    };
    return C;
  }

  // Arena ids ({theme:"x", ic:true}) to the object render() sees ({theme:{id,name,...}, ic:true, ids}).
  // strict: unknown option ids resolve to null (used for stored votes); otherwise the first option.
  function resolveArena(C, ids, strict) {
    const arena = { ids: {} };
    for (const d of C.dims) {
      if (d.type === "select") {
        const o = d.options.find(x => x.id === ids[d.id]) || (strict ? null : d.options[0]);
        arena[d.id] = o; arena.ids[d.id] = o ? o.id : ids[d.id];
      } else {
        arena[d.id] = !!ids[d.id]; arena.ids[d.id] = !!ids[d.id];
      }
    }
    return arena;
  }

  function splitOf(C, arena) {
    if (!C.split) return null;
    try { return C.split.of(arena); } catch (e) { return null; }
  }

  // What a question may set for itself. Everything else it inherits from the dome, and
  // anything in DOME_ONLY is rejected rather than quietly ignored, so the boundary is
  // something the config author is told about instead of something they discover.
  const Q_KEYS = ["lede", "galleryTitle", "contenderLabel", "media", "render", "swatch", "interactiveCards", "blind"];
  const DOME_ONLY = ["arena", "dimensions", "split", "k", "recent", "collection", "localKey", "mount", "shuffle", "questions", "confidence", "comments", "demo"];

  // One dome, several decisions. A question brings its own contenders and its own words
  // and inherits everything else, so the arena, the media defaults and the render
  // function are written once no matter how many questions hang off them. The arena and
  // the K factor stay at the dome level on purpose: questions asked in different
  // contexts are different pages, not tabs.
  //
  // A dome with no `questions` is a dome with one anonymous question, which is what
  // every config written so far is. Its votes are stored exactly as before.
  function normalizeDome(cfg) {
    if (!cfg || !cfg.id) throw new Error("Thunderdome: config needs an id");
    if (cfg.questions != null && !Array.isArray(cfg.questions)) {
      throw new Error("Thunderdome: questions must be a list");
    }
    const list = cfg.questions || null;
    if (list && !list.length) throw new Error("Thunderdome: questions is an empty list");
    const { questions, ...dome } = cfg;
    // A question that names no contenders is an error, not an invitation to borrow the
    // dome's. Inheriting them would put one contender set under two question tags.
    const base = list ? { ...dome, contenders: undefined } : cfg;
    // The dome is validated against the first question's contenders so the arena, the
    // storage keys and the split are read and checked in one place.
    const D = normalize(list ? { ...dome, contenders: qContenders(list[0], 0) } : cfg);
    const seen = new Set();
    D.questions = (list || [{}]).map((q, i) => {
      const id = list ? String(q.id == null ? "" : q.id).toLowerCase() : null;
      if (list) {
        if (!id) throw new Error(`Thunderdome: every question needs an id (question ${i + 1} has none)`);
        if (VIEWS.has(id) || MODE_WORD.test(id)) throw new Error(`Thunderdome: "${id}" is a view name, so it cannot be a question id`);
        if (seen.has(id)) throw new Error(`Thunderdome: question ids must be unique (${id})`);
        seen.add(id);
        for (const k of DOME_ONLY) {
          if (k in q) throw new Error(`Thunderdome: question "${id}" sets ${k}, which is a dome-level setting`);
        }
      }
      // The synthetic id exists only to satisfy normalize's own id check. It is thrown
      // away here and never reaches localKey or collection, which come off the dome.
      let Q;
      try {
        Q = list
          ? normalize({ ...base, ...q, contenders: qContenders(q, i), id: `${cfg.id}-${id}` })
          : D;
      } catch (e) {
        throw new Error(id ? `${e.message} (question "${id}")` : e.message);
      }
      const out = {
        id,
        // Read off the question itself, not the merge: inheriting the dome's title would
