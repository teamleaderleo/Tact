      const gallery = mode.gallery != null;
      $.viewVote.hidden = gallery || view !== "vote";
      $.viewResults.hidden = gallery || view !== "results";
      $.viewGallery.hidden = !gallery;
      if (view === "vote") ($.whyBox || $.voteMore).after($.status); else $.viewResults.prepend($.status);
      $.tabVote.setAttribute("aria-current", view === "vote" ? "page" : "false");
      $.tabResults.setAttribute("aria-current", view === "results" ? "page" : "false");
      $.tabVote.href = hashFor(Q.id, "vote");
      $.tabResults.href = hashFor(Q.id, "results");
      syncQTabs();
      const builds = galleryBuilds;
      // A question you just arrived at has no duel yet, and nextDuel renders one. Keep the
      // arena across the move: re-rolling it would mean you cannot put two questions side
      // by side in the same context, and Back would land somewhere you have never been.
      const demo = demoOn(), demoFlip = demo !== demoWas;
      demoWas = demo;
      if (moved || booting) { renderQuestion(); nextDuel(moved); renderStandings(); }
      else if (demoFlip) { nextDuel(true); renderStandings(); }
      if (gallery) renderGalleryMode();
      applyTheme();
      // Arriving at the results view is what pays for the table, so votes cast on the
      // vote view show up the moment you go looking for them and not before.
      flushStandings();
      // Only tune if nothing on the way through already rebuilt the gallery and tuned it.
      if (galleryBuilds === builds && !flushGallery()) tuneGalleryVideos();
      tuneDuelVideos();
      // Focus follows the question so a screen reader is told which one it landed on, and
      // so the keys are not aimed from whichever tab the mouse left focus on.
      if (moved && !booting && $.qTitle) $.qTitle.focus({ preventScroll: true });
    }
    const fromHash = () => parseHash(location.hash, qids);
    window.addEventListener("hashchange", () => { mode = parseMode(location.hash); const r = fromHash(); goto(r.q, r.view); });

    // ---- rendering ----
    function arena() { return resolveArena(C, arenaIds, false); }

    function defaultTag(a) {
      return C.dims.filter(d => d.type === "select").map(d => a[d.id].name.toLowerCase())
        .concat(C.dims.filter(d => d.type === "toggle" && a[d.id]).map(d => d.short || d.label))
        .join(" · ");
    }

    function describe(v) {
      if (C.describe) return C.describe(resolveArena(C, v, true), v);
      const parts = [];
      for (const d of C.dims) {
        if (d.type === "select") { const o = d.options.find(x => x.id === v[d.id]); parts.push(o ? o.name : String(v[d.id] ?? "?")); }
        else if (v[d.id]) parts.push(d.short || d.label);
      }
      return parts.join(", ");
    }

    // c.media may be a string, an object, or a function of the arena, so one contender
    // can hold its light and dark recordings and hand over whichever the arena asked for.
    function mediaFor(c, a) {
      let m = c.media;
      if (typeof m === "function") m = m(a, { h });
      const spec = mediaSpec(m, Q.media);
      return spec ? mediaNode(spec, c.note ? `${c.name}: ${c.note}` : c.name) : null;
    }

    function renderBody(c, a) {
      const ctx = { h, contender: c, media: (x, ar) => mediaFor(x || c, ar || a) };
      // Most specific first: contender.render, then config.render, then media, then c.html.
      // A config-wide render() wins over media so it can place the frame itself
      // (device chrome, a caption) by calling ctx.media().
      if (typeof c.render === "function") return toNode(c.render(a, ctx));
      if (Q.render) return toNode(Q.render(c, a, ctx));
      const m = mediaFor(c, a);
      if (m) return m;
      if (typeof c.html === "function") return toNode(c.html(a, ctx));
      if (c.html == null) throw new Error("nothing to render: no render function, no media, no html");
      return toNode(c.html);
    }

    // side is "a", "b", or null in the gallery.
    //
    // A card that could not be drawn must say so and must not be votable. The usual
    // way to get here is a media resolver that is not total over the arena
    // (`media: a => clips[c.id][a.theme.id]` after a theme is added without clips):
    // without this the duel advances underneath a frozen screen and the votes land on
    // pairs nobody ever saw.
    // The notes for one contender, under its gallery card. Each one carries who it was
    // said against, because "too heavy" on its own is half a sentence.
    function whyList(notes) {
      if (!notes || !notes.length) return null;
      const name = id => (byId[id] ? byId[id].name : id);
      return h("ul", { class: "td-whys" }, ...notes.map(n =>
        h("li", {},
          h("span", { class: "td-why-text", text: n.text }),
          h("span", { class: "td-why-vs", text: n.tie ? `tied with ${name(n.vs)}` : `over ${name(n.vs)}` }))));
    }

    function card(c, a, side, notes) {
      // Above each side of the duel: its key on the left edge and its letter on the right.
      // The arrow is a separate span because it stops being true below 760px, where the
      // duel stacks and "left" is the card on top. CSS drops it at that width.
      const key = side ? h("div", { class: "td-card-key" },
        h("span", { class: "td-side-arrow", "aria-hidden": "true", text: side === "a" ? "\u2190" : "\u2192" }),
        h("span", { text: side === "a" ? "A" : "B" })) : null;
      // Blind by default: during the vote a name is a thumb on the scale, and "Today" or
      // "Proposed" on a card is the heaviest one there is. The boards, the gallery and
      // the note box after the vote all name them.
      const head = side && Q.blind ? null : h("div", { class: "td-card-head" },
        h("div", { class: "td-card-name", text: c.name }), c.note ? h("div", { class: "td-card-note", text: c.note }) : null);
      let body, broken = false;
      try { body = renderBody(c, a); } catch (e) {
        broken = true;
        console.error(`Thunderdome: ${c.id} failed to render`, e);
        body = failNode("Couldn't draw this one.", String((e && e.message) || e));
      }
      const el = h("article", { class: "td-card", "data-contender": c.id },
        key, head, h("div", { class: "td-card-body" }, body), side ? null : whyList(notes));
      if (broken) el.dataset.tdBroken = "1";
      // The whole card is the button. Reaching for a button under the thing you are
      // judging is the difference between twenty votes and five.
      // Mouse only on purpose: the arrow keys and the vote buttons below are the
      // keyboard and screen reader path, and a card announcing itself as a button
      // would read its own contents out as the label.
      if (side && !broken && !Q.interactiveCards) {
        el.classList.add("td-live");
        el.addEventListener("click", e => {
          // The card body is pointer-events:none, but the head is not: the name and the
          // note are there to be read, and reading sometimes means dragging across them.
          // A drag that ends with text selected was not a vote.
          const sel = root.getSelection && root.getSelection();
          if (sel && !sel.isCollapsed) return;
          // Media controls are exempt from the blanket, so a click on one is a play, not a vote.
          if (e.target.closest && e.target.closest("video,audio")) return;
          vote(side);
        });
      }
      // Gallery clips are played by the observer instead of autoplaying: a clip below
      // the fold, or sitting in the hidden results view, should not be decoding against
      // the duel. Reduced motion leaves autoplay off, so it never gets the marker.
      if (!side) for (const v of el.querySelectorAll("video")) {
        if (v.autoplay) { v.autoplay = false; v.dataset.tdAuto = "1"; }
      }
      return el;
    }

    function syncControls(a) {
      for (const d of C.dims) {
        const el = $[`td-dim-${d.id}`];
        if (d.type === "select") el.value = arenaIds[d.id]; else el.checked = !!arenaIds[d.id];
      }
      $.tag.textContent = C.tag ? C.tag(a) : defaultTag(a);
    }

    // Start both sides of a duel at the same point in their loop. Clips left alone
    // drift apart within seconds, and then you are comparing a treatment at the top of
    // its loop against one halfway through it, which is not the question you asked.
    // A GIF cannot be seeked at all, which is why the docs push mp4 and webm.
    // `byHand` is the R key or the Replay button. Reduced motion means nothing starts
    // itself, not that the button someone just pressed does nothing: under that setting
    // the clips carry controls and get played one at a time, which is exactly the case
    // where they drift and re-aligning them by hand is the only repair.
    function syncDuelVideos(byHand) {
      const vids = [...$.duel.querySelectorAll("video")];
      $.replay.hidden = !vids.length;
      if (!vids.length) return;
      const token = ++syncToken;
      const ready = v => v.readyState >= 2 ? Promise.resolve() : new Promise(res => {
        // Every one of these has to settle even if the element is thrown away first,
        // or the promise holds both <video> elements and their listeners alive.
        let timer = 0;
        const done = () => {
          clearTimeout(timer);
          v.removeEventListener("loadeddata", done); v.removeEventListener("error", done); res();
        };
        timer = setTimeout(done, 1500);
        v.addEventListener("loadeddata", done); v.addEventListener("error", done);
      });
      // Don't hold the first clip back forever on a slow load for the second.
      Promise.race([Promise.all(vids.map(ready)), new Promise(r => setTimeout(r, 1500))]).then(() => {
        if (token !== syncToken) return;  // a newer duel already claimed the ring
        for (const v of vids) {
          try { v.currentTime = 0; } catch (e) { /* not seekable yet */ }
          if (byHand || !reducedMotion()) { const q = v.play(); if (q && q.catch) q.catch(() => {}); }
        }
      });
    }

    // The duel is the comparison that has to stay smooth. Gallery clips below the fold,
    // or in the results view while you are voting, are competing with it for nothing.
    // The duel's own clips are as hidden as the gallery's once you switch to the
    // standings, and a paused <video> that nobody can see is not costing anything.
    function tuneDuelVideos() {
      if (view === "vote") { syncDuelVideos(); return; }
      // Claim the ring on the way out too, or a sync already waiting on a slow load
      // resolves after the switch and plays clips nobody is looking at.
      syncToken++;
      for (const v of $.duel.querySelectorAll("video")) v.pause();
    }

    // Built only when the results view needs it. With "New arena each duel" on, the
    // arena changes every vote, so keying the gallery on the arena alone still tore down
    // and re-preloaded every clip in it once per duel, on the same frame as the new duel.
    // What the gallery is a picture of: the arena it renders in, and how many notes are
    // hanging off the cards. Anything else that moves (a vote, a rating) is the table's
    // business, and rebuilding a wall of video for it is what the dirty flag exists to
    // avoid. Notes have to be in here, or a note you just wrote would not appear until
    // the arena happened to change.
    function galleryStamp(a) {
      const ids = JSON.stringify((a || arena()).ids);
      if (!C.comments) return ids;
      let n = 0;
      for (const v of qVotes()) if (typeof v.why === "string" && v.why.trim()) n++;
      return `${ids}|${n}`;
    }

    function flushGallery() {
      if (!galleryDirty || view !== "results") return false;
      galleryDirty = false;
      galleryBuilds++;
      const a = arena();
      galleryKey = galleryStamp(a);
      const notes = C.comments ? comments(ids, qVotes()) : null;
      $.gallery.replaceChildren(...Q.contenders.map(c => card(c, a, null, notes && notes[c.id])));
      tuneGalleryVideos();
      return true;
    }

    function tuneGalleryVideos() {
      if (galleryIO) { galleryIO.disconnect(); galleryIO = null; }
      const vids = [...$.gallery.querySelectorAll("video")];
      if (view !== "results") { for (const v of vids) v.pause(); return; }
      if (typeof IntersectionObserver !== "function") {
        for (const v of vids) if (v.dataset.tdAuto) { const q = v.play(); if (q && q.catch) q.catch(() => {}); }
        return;
      }
      galleryIO = new IntersectionObserver(es => {
        for (const e of es) {
          if (!e.isIntersecting) e.target.pause();
          else if (e.target.dataset.tdAuto) { const q = e.target.play(); if (q && q.catch) q.catch(() => {}); }
        }
      }, { rootMargin: "120px" });
      for (const v of vids) galleryIO.observe(v);
    }

    // A card can fail at render (a resolver that is not total over the arena) or later
    // (media that 404s). Either way the duel stops being a fair comparison, so the vote
    // buttons come off until you skip. Called again by the media error listener.
    function refreshVoteLock() {
      const bad = !!$.duel.querySelector("[data-td-broken], .td-media-broken");
      for (const b of [$.voteA, $.voteTie, $.voteB]) b.disabled = bad;
      lockNote = bad ? "One of these cards didn't render, so this duel isn't votable. Skip it, and check the console." : "";
      renderStatus();
    }

    function render() {
      const a = arena();
      if (C.dims.length) syncControls(a);
      $.duel.replaceChildren(...(duel ? [card(byId[duel.a], a, "a"), card(byId[duel.b], a, "b")] : []));
      // The gallery only depends on the arena, so a vote that does not move the arena
      // leaves it alone entirely, and one that does defers the rebuild to the view that
      // can actually see it.
      const gk = galleryStamp(a);
      if (gk !== galleryKey) { galleryKey = gk; galleryDirty = true; }
      if (view === "results") flushGallery();
      tuneDuelVideos();
      refreshVoteLock();
      if (C.comments) syncWhySubject();
    }

    // keepArena is the question switch: the arena is the context every contender is being
    // judged inside, and re-rolling it as you move between questions means you can never
    // put two of them side by side in the same one.
    function nextDuel(keepArena) {
      // The demo bout is fixed: the same pair in the same arena every time it is opened,
      // so a screenshot of it can be taken again.
      if (demoOn()) {
        Object.assign(arenaIds, C.demo.arena || {});
        if ($.shuffle) $.shuffle.checked = false;
        const pair = (C.demo.duel || []).filter(id => byId[id]);
        const a = pair[0] || ids[0], b = pair[1] && pair[1] !== a ? pair[1] : ids.find(id => id !== a);
        lastKey = pairKey(a, b); duel = { a, b };
        render();
        return;
      }
      if (!keepArena && $.shuffle && $.shuffle.checked) {
        for (const d of C.dims) if (d.shuffle) {
          arenaIds[d.id] = d.type === "select" ? d.options[Math.floor(Math.random() * d.options.length)].id : Math.random() < .5;
        }
      }
      const p = pickPair(ids, qVotes(), lastKey);
      lastKey = p.key; duel = { a: p.a, b: p.b };
      render();
    }

    // The bootstrap is a few hundred fits. That is tens of milliseconds, and it used to
    // run on every local vote, every undo and every vote that arrived over a shared
    // table, none of which the vote view can see: the cost landed on the same frame that
    // was trying to paint the card you just picked. Mark the table dirty and build it
    // when the results view asks for it, the way the gallery already does.
    // Called on every vote and on every shared snapshot, which makes it the one place
    // that sees a note arrive, whether it was written here or by somebody else.
    function renderStandings() {
      standingsDirty = true;
      renderBoards();
      if (C.comments) {
        const gk = galleryStamp();
        if (gk !== galleryKey) { galleryKey = gk; galleryDirty = true; }
      }
      if (!flushStandings()) renderStatus();
      if (galleryDirty) flushGallery();
    }

    // The same two functions the command line calls, not a hand-copy of their bodies:
    // `tablesForDome` exists so that this line and `tablesFor` cannot come apart, which
    // is the entire argument for having moved any of this into the engine.
    //
    // Every question goes in, not just the one on screen: someone copying a result wants
    // the dome's answer, and scrolling back through the tabs to paste four tables in a
    // row is how you end up pasting three.
    function markdownNow() {
      return markdown(tablesForDome(C, votes), C);
    }

    // The clipboard API needs a user gesture and a secure context, and a page opened
    // from a file:// URL has neither in some browsers. The fallback selects the text in
    // a textarea so the failure mode is "press ctrl-c yourself" rather than "nothing
    // happened".
    // The status line lives at the foot of the page, which a screen reader announces and
    // a reader looking at the button does not see: on the results view the table and the
    // gallery are between them. So the button says it too, where the eye already is.
    let copyTimer = null;
    function copySaid(btn, label, rest) {
      btn.textContent = label;
      clearTimeout(copyTimer);
      copyTimer = setTimeout(() => { btn.textContent = rest; }, 2000);
    }

    function copyText(text, btn, rest, okMsg) {
      const fallback = () => {
        // Whatever the reader had highlighted in the standings goes back afterwards, and
        // so does the caret: a button that silently eats your selection and drops you at
        // the top of the page is a worse outcome than a copy that did not happen.
        const sel = window.getSelection ? window.getSelection() : null;
        const had = sel ? Array.from({ length: sel.rangeCount }, (_, i) => sel.getRangeAt(i)) : [];
        // readonly, or iOS brings the keyboard up over the table for a field nobody can
        // see and nobody meant to type in.
        const ta = h("textarea", { class: "td-copy-sink", readonly: "" });
        ta.value = text;
        document.body.append(ta);
        ta.select();
        let ok = false;
        try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
        ta.remove();
        if (sel) { sel.removeAllRanges(); for (const r of had) sel.addRange(r); }
        btn.focus();
        copySaid(btn, ok ? "Copied" : "Copy failed", rest);
        say(ok ? okMsg : "Could not reach the clipboard. Press copy again with the console open to see why.", !ok);
      };
      const done = () => { copySaid(btn, "Copied", rest); say(okMsg); };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done, fallback);
      } else fallback();
    }

    // Takes back the votes this browser holds for the question on screen. Votes in a
    // shared table are not "mine" in any way the page can prove, so they stay, and the
    // button only shows while there is something local to remove. Two clicks, because
    // the first one is too easy to land on the way to Copy.
    let resetArmed = false, resetTimer = 0;
    function disarmReset() { resetArmed = false; clearTimeout(resetTimer); $.reset.textContent = "Reset my votes"; }
    function resetMine() {
      if (!resetArmed) {
        resetArmed = true; $.reset.textContent = "Click again to reset";
        resetTimer = setTimeout(disarmReset, 4000);
        return;
      }
      disarmReset();
      const mine = v => String(v.id).startsWith("local-") && inQ(v);
      const n = votes.filter(mine).length;
      votes = votes.filter(v => !mine(v));
      saveLocal();
      if (myLast && myLast.local) { myLast = null; $.undo.hidden = true; }
      clearWhy();
      renderStandings();
      say(`Removed ${n} vote${n === 1 ? "" : "s"} from this browser.`);
    }

    // The swatch, then the name. Shared by the boards and the standings.
    function nameCell(c) {
      const td = h("td");
      if (Q.swatch) {
        const sw = Q.swatch(c, { h });
        if (sw != null) td.append(sw instanceof Node ? sw : h("span", { class: "td-swatch", style: `background:${sw}` }));
      }
      td.append(document.createTextNode(c.name));
      return td;
    }

    // One board per split, drawn from boards() or, on #demo, from the numbers the config
    // brought. Rows for contenders the question no longer has are dropped, so an old
    // export still draws after a contender is retired.
    function renderBoards() {
      const data = demoOn() && C.demo.results ? C.demo.results : boards(C, Q, votes);
      const groups = C.split ? C.split.values.map(s => [s.label, data[s.id]]) : [["Standings", data.all]];
      $.boards.replaceChildren(...groups.map(([label, rows]) => h("div", { class: "td-board" },
        h("h2", { text: label }),
        h("table", {},
          h("thead", {}, h("tr", {}, h("th", { text: Q.contenderLabel }), h("th", { class: "num", text: "Elo" }), h("th", { class: "num", text: "W–L–T" }))),
          h("tbody", {}, ...(rows || []).filter(r => byId[r.id]).map(r => h("tr", {},
            nameCell(byId[r.id]),
            h("td", { class: "num", text: String(r.elo) }),
            h("td", { class: "num", text: `${r.w}–${r.l}–${r.t}` }))))))));
      const n = data.votes || 0;
      $.count.textContent = `${n} vote${n === 1 ? "" : "s"}`;
      $.export.value = JSON.stringify(data);
      $.reset.hidden = demoOn() || !votes.some(v => String(v.id).startsWith("local-") && inQ(v));
    }

    // #galleryN puts the page in that arena and draws everyone in it. The page follows
    // the arena's own brightness when an option says `dark`, so a light theme is not
    // photographed on a black ground; #light or #dark in the hash overrides that.
    function renderGalleryMode() {
      const list = arenas(C);
      if (list.length) Object.assign(arenaIds, list[mode.gallery % list.length]);
      const a = arena();
      if (C.dims.length) syncControls(a);
      const notes = C.comments ? comments(ids, qVotes()) : null;
      $.galleryModeHead.textContent = Q.galleryTitle;
      $.galleryMode.replaceChildren(...Q.contenders.map(c => card(c, a, null, notes && notes[c.id])));
      for (const v of $.galleryMode.querySelectorAll("video")) {
        if (v.dataset.tdAuto) { const q = v.play(); if (q && q.catch) q.catch(() => {}); }
      }
    }

    function applyTheme() {
      let t = mode.theme;
      if (!t && mode.gallery != null) {
        const a = arena();
        for (const d of C.dims) {
          if (d.type === "select" && a[d.id] && typeof a[d.id].dark === "boolean") { t = a[d.id].dark ? "dark" : "light"; break; }
        }
      }
      const el = document.documentElement;
      if (t) el.setAttribute("data-theme", t); else el.removeAttribute("data-theme");
    }

    function flushStandings() {
      if (!standingsDirty || view !== "results") return false;
      standingsDirty = false;
      const sorted = qVotes().sort((x, y) => x.t - y.t);
      const conf = confidence(ids, sorted, confidenceOpts(C, sorted.length));
      const all = conf.rating;
      const perSplit = splitVals.map(s => {
        const list = sorted.filter(v => splitOf(C, resolveArena(C, v, true)) === s.id);
        const r = fit(ids, list, { prior: C.confidence ? C.confidence.prior : 200 });
        const best = list.length ? ids.slice().sort((x, y) => r[y] - r[x])[0] : null;
        return { r, best };
      });
      const rec = records(ids, sorted);
      const order = ids.slice().sort((x, y) => all[y] - all[x]);
      const rows = order.map((id, i) => {
        const c = byId[id];
        // The percentile range is not symmetric, so the cell shows its half-width and
        // carries the range itself for anyone who wants the two ends.
        const eloCell = h("td", { class: "num", text: String(Math.round(all[id])) });
        if (conf.lo) {
          // The range goes on the cell rather than on the three characters of the spread,
          // so the hover target is the number you were already looking at. It goes on
          // aria-label as well as title: a <td> is not focusable and has no interactive
          // role, so a title alone is mouse-only, and the half-width is exactly where the
          // asymmetry the comment above admits to gets lost.
          const range = `${Math.round(conf.level * 100)}% of resamples land between ${Math.round(conf.lo[id])} and ${Math.round(conf.hi[id])}`;
          eloCell.title = range;
          eloCell.setAttribute("aria-label", `${Math.round(all[id])}. ${range}.`);
          eloCell.append(h("span", { class: "td-ci", text: `±${Math.round((conf.hi[id] - conf.lo[id]) / 2)}` }));
        }
        return h("tr", {},
          h("td", { class: "rank", text: String(i + 1) }),
          nameCell(c),
          eloCell,
          ...perSplit.map(s => h("td", { class: "num" + (s.best === id ? " td-lead" : ""), text: String(Math.round(s.r[id])) })),
          h("td", { class: "num", text: `${rec[id].w}–${rec[id].l}–${rec[id].t}` }));
      });
      $.standings.replaceChildren(...rows);
      if ($.callout) $.callout.textContent = calloutFor(conf, order);

      const recent = sorted.slice().reverse().slice(0, C.recent);
      $.feed.replaceChildren(...(recent.length ? recent.map(v => {
        const a = byId[v.a] ? byId[v.a].name : v.a, b = byId[v.b] ? byId[v.b].name : v.b;
        const w = v.w === "tie" ? `${a} = ${b}` : `${v.w === "a" ? a : b} beat ${v.w === "a" ? b : a}`;
        // `comments: false` is off everywhere, not just in the box. A dome that ran
        // with notes and then turned them off still has them on its votes, and the
        // gallery already drops them; the feed was showing them anyway.
        const why = C.comments && typeof v.why === "string" ? v.why.trim() : "";
        // The bout and its timestamp are one line; the note gets its own underneath.
        // Inline, a note long enough to wrap pushes "just now" onto a line of its own
        // and the column of times stops being a column.
        return h("li", {},
          h("span", { class: "td-feed-line" },
            h("b", { text: w }), h("span", { text: describe(v) }),
            h("span", { class: "when", text: ago(v.t) })),
          // In the feed the note reads as what somebody said at the time, so it keeps
          // its quotes. On a card it is the card's own line and does not need them.
          why ? h("span", { class: "td-feed-why", text: `“${why}”` }) : null);
      }) : [h("li", { class: "td-empty", text: "No bouts yet. Vote above to start the table." })]));
      renderStatus();
      return true;
    }

    // The top two, in words, because the rank column reads 1, 2, 3, 4 whether or not the
    // votes have earned it and this is the sentence that says whether to believe it.
    // The rule itself lives in the core, because `results` on the command line prints
    // this same sentence and the two must not be able to disagree.
    function calloutFor(conf, order) {
      return verdictFor(conf, order, id => (byId[id] ? byId[id].name : id));
    }

    // Who is winning, without making you switch views to find out. A vote you cannot
    // see land feels like it went nowhere, and then you stop voting.
    //
    // The fit, not the bootstrap: this redraws on every vote, and a few hundred fits per
    // click to sharpen a sentence that says one name is not a trade worth making. The
    // gap is the crude version of the call the results view makes properly.
    function leaderLine() {
      const mine = qVotes();
      if (mine.length < 3) return "";
      const r = fit(ids, mine, { prior: C.confidence ? C.confidence.prior : 200 });
      const rank = ids.slice().sort((x, y) => r[y] - r[x]);
      return r[rank[0]] - r[rank[1]] < NOISE_FLOOR / Math.sqrt(mine.length)
        ? "Too close to call so far." : `${byId[rank[0]].name} leads.`;
    }

    // Where the votes are going. Sticky, because it is a fact about the page rather
    // than an event, and it is kept out of `note` so a page with no shared table does
    // not spend the rest of the session saying so instead of naming the leader.
    function storageLine() {
      if (stickyNote) return stickyNote;
      if (shared) {
        const n = qVotes().filter(v => !String(v.id).startsWith("local-")).length;
        return `${n} shared vote${n === 1 ? "" : "s"} so far.`;
      }
      return "Votes stay in this browser until the shared table connects.";
    }
    // The lock note beats everything: a row of dead buttons needs an explanation more
    // than a vote already visible in the Results count needs a confirmation.
    function renderStatus() {
      const n = qVotes().length;
      $.tabResults.textContent = n ? `Results (${n})` : "Results";
      $.status.textContent = lockNote || note || `${storageLine()} ${leaderLine()}`.trim();
    }
    // A sticky message is always the correction to whatever transient is on screen: it
    // is said when a vote was rejected, right after that vote said it was saved. Clearing
    // the transient is the point, otherwise the page spends two seconds claiming a vote
    // landed that did not.
    function say(msg, sticky) {
      if (sticky) { stickyNote = msg; note = ""; clearTimeout(noteTimer); renderStatus(); return; }
      note = msg; clearTimeout(noteTimer); renderStatus();
      noteTimer = setTimeout(() => { note = ""; renderStatus(); }, 2500);
    }

    // ---- notes ----
    // Offered after a vote lands, aimed at that vote. If there is unsent text in the box
    // it is left where it is, still aimed at the older vote: someone typing "the red one
    // reads as destructive" and voting again mid-sentence meant that about the pair they
    // were looking at, and quietly re-pointing it at a different pair would file it as a
    // remark nobody made. So voting stays free, and the sentence keeps its subject.
    function offerWhy(v, handle) {
      if (!C.comments || !$.whyBox) return;
      whyLatest = { v, handle };
      if (whyFor && $.why.value.trim()) return;
      whyFor = whyLatest;
      $.why.value = "";
      $.why.placeholder = whyLabel(v);
      $.whyBox.hidden = false;
      syncWhySubject();
    }
    // The box keeps its subject only while there is unsent text to attach to it. Once
    // the text is gone, so is the reason: point it back at the latest vote. Without
    // this, escaping a half-written note and then writing a fresh one filed the new
    // sentence against a duel two votes back, and the vote you had just cast could
    // never be noted at all.
    function rePointWhy() {
      if (!$.why) return;
      if (!$.why.value.trim() && whyLatest && whyLatest !== whyFor) {
        whyFor = whyLatest;
        $.why.placeholder = whyLabel(whyLatest.v);
      }
      syncWhySubject();
    }
    // Shown as soon as there is text in the box, because that is exactly when the
    // placeholder stops saying it. The next duel is already on screen by then, so the
    // subject is never the pair in front of you.
    function syncWhySubject() {
      if (!$.whyOn) return;
      const v = whyFor && $.why.value.trim() ? whyFor.v : null;
      $.whyOn.textContent = v ? `about ${whySubject(v)}` : "";
      $.whyOn.hidden = !v;
    }
    function whySubject(v) {
      const name = id => (byId[id] ? byId[id].name : id);
      return v.w !== "a" && v.w !== "b"
        ? `${name(v.a)} = ${name(v.b)}`
        : `${name(v.w === "a" ? v.a : v.b)} over ${name(v.w === "a" ? v.b : v.a)}`;
    }
    // Both names, always. The next duel is already on screen by the time anyone reads
    // this, so a box that said only "Why Solid red?" would be asking about a pair that
    // is no longer in front of them, against two cards that are.
    function whyLabel(v) {
      const name = id => (byId[id] ? byId[id].name : id);
      if (v.w !== "a" && v.w !== "b") return `Why the tie between ${name(v.a)} and ${name(v.b)}? (optional)`;
      const win = v.w === "a" ? v.a : v.b, lose = v.w === "a" ? v.b : v.a;
      return `Why ${name(win)} over ${name(lose)}? (optional)`;
    }
    function clearWhy() {
      if (!$.whyBox) return;
      whyFor = null; whyLatest = null; $.why.value = ""; $.whyBox.hidden = true;
      syncWhySubject();
    }
    // Undo deletes one bout. If the box is aimed somewhere else, it is holding a
    // sentence about a vote that is still there, and taking it away is silent data
    // loss: the user watches their own words vanish for pressing Undo on something
    // unrelated.
    function clearWhyOf(match) {
      if (!$.whyBox) return;
      if (whyLatest && match(whyLatest)) whyLatest = null;
      if (whyFor && match(whyFor)) clearWhy();
    }
    async function saveWhy() {
      const text = $.why ? $.why.value.trim() : "";
      if (!whyFor || !text) return;
      const { v, handle } = whyFor;
      // Written onto the vote itself rather than into a second collection. The note and
      // the bout are one fact, so Undo takes the note with the vote it explains, the
      // question tag is already right, and the shared table needs no new schema.
      const saved = { ...v, why: text.slice(0, C.comments.max) };
      if (handle && handle.set) {
        // The box is emptied after the write lands, not before. Clearing first meant a
        // dropped connection took the sentence with it: told it failed, nothing left to
        // try again with, and no way to get the words back.
        try { await handle.set(saved); } catch (e) { say("Couldn't save that note. It is still in the box."); return; }
      } else {
        // The local vote object is the one in `votes`, so amend it in place and rewrite.
        const mine = votes.find(x => x.id === v.id);
        if (!mine) { clearWhy(); return; }      // undone while the note was being typed
        mine.why = saved.why;
        saveLocal();
      }
      clearWhy();
      renderStandings();
      say("Noted.");
    }

    // ---- voting ----
    function saveLocal() {
      try { localStorage.setItem(C.localKey, JSON.stringify(votes.filter(x => String(x.id).startsWith("local-")))); } catch (e) { /* storage blocked */ }
    }
    // stale: the vote was cast on a question you have since left, so it is recorded but
    // gets no Undo handle. Undo is "take back the vote you just cast on this page".
    function localVote(v, stale) {
      v.id = "local-" + v.t; votes.push(v);
      if (!stale) { myLast = { local: v.id }; $.undo.hidden = false; offerWhy(v, null); }
      saveLocal(); renderStandings();
    }
    async function vote(w) {
      if (!duel || lockNote) return;
      if (demoOn()) { say("This is the demo bout, so votes are not recorded. Drop #demo from the link to vote."); return; }
      // `q` only on a dome that has questions, so a single-question dome's votes keep the
      // exact shape they had before questions existed and an old shared table still reads.
      const v = { a: duel.a, b: duel.b, w, ...arena().ids, t: Date.now() };
      if (C.multi) v.q = Q.id;
      const cards = $.duel.children;
      if (w === "a" && cards[0]) cards[0].classList.add("picked");
      if (w === "b" && cards[1]) cards[1].classList.add("picked");
      duel = null;
      // The write to the shared table takes a round trip, which is exactly long enough to
      // click another question. Everything after the await belongs to the question this
      // vote was cast on, so if that is no longer the one on screen, none of it happens:
      // the vote is saved either way, but its Undo handle, its confirmation and its next
      // duel would all land on a table they have nothing to do with. Undoing here would
      // delete a vote from a question you are not looking at and leave no trace.
      const token = voteToken;
      if (shared && votesCol) {
        try {
          const ref = votesCol.doc();
          await ref.set(v);
          if (token !== voteToken) return;
          myLast = ref; $.undo.hidden = false;
          // `v` has no id of its own on this path and should not gain one: identity is
          // the doc, and writing an id field into it would fight the snapshot's own.
          offerWhy(v, ref);
          say("Vote saved to the shared table.");
        } catch (e) {
          // The vote itself is still saved, correctly tagged. Only the handle and the
          // message are withheld, because those are about a page you have left.
          shared = false; localVote(v, token !== voteToken);
          if (token !== voteToken) return;
          say("You can view but not vote on the shared table here, so this vote stays in your browser.", true);
        }
      } else localVote(v);
      nextTimer = setTimeout(() => nextDuel(), 260);
    }
    async function undo() {
      if (!myLast) return;
      const was = myLast;
      if (myLast.local) { const id = myLast.local; votes = votes.filter(v => v.id !== id); saveLocal(); renderStandings(); say("Vote removed."); }
      else { try { await myLast.delete(); say("Vote removed."); } catch (e) { say("Couldn't remove that vote."); } }
      // The note explains the vote, so it goes with it: leaving the box open over a
      // bout that no longer exists would file the sentence against nothing. Only that
      // bout, though. Vote, start writing, vote again, then undo the second one, and
      // the box is holding a sentence about the first vote, which is still there.
      clearWhyOf(e => (was.local ? e.v.id === was.local : e.handle === was));
      myLast = null; $.undo.hidden = true;
    }

    document.addEventListener("keydown", e => {
      // The duel is hidden on the results view, and a vote on a pair you cannot see is
      // bad data. It also means space is the page's own scroll key there, which is what
      // anyone reading a table of standings expects it to be.
      if (view !== "vote" || mode.gallery != null) return;
      if (e.metaKey || e.ctrlKey || e.altKey || e.repeat) return;
      const near = sel => e.target.closest && e.target.closest(sel);
      if (near("select,input,textarea,[contenteditable]")) return;   // typing always beats voting
      // A focused media player owns its own keys: space plays, arrows seek. Under
      // prefers-reduced-motion the controls are the only way to watch a clip at all.
      if (near("video,audio")) return;
      const k = e.key;
      // Space and Enter belong to whatever is focused. The arrows and digits do not:
      // clicking "Left wins" once leaves that button focused, and the keyboard has to
      // keep working afterwards or the fast path dies the first time you use the mouse.
      if ((k === " " || k === "Enter") && near("button,a,summary")) return;
      if (k === "ArrowLeft" || k === "1") vote("a");
      else if (k === "ArrowRight" || k === "2") vote("b");
      else if (k === "ArrowDown" || k === "3" || k === " ") vote("tie");
      // C only does something when there is a vote to write about, so on a dome with
      // comments off, or before the first vote, the key stays the browser's.
      else if ((k === "c" || k === "C") && $.whyBox && !$.whyBox.hidden) $.why.focus();
      else if (k === "s" || k === "S") nextDuel();
      else if (k === "u" || k === "U") undo();
      else if (k === "r" || k === "R") syncDuelVideos(true);
      else return;
      e.preventDefault();
    });

    // ---- boot ----
    try { const saved = JSON.parse(localStorage.getItem(C.localKey) || "[]"); if (Array.isArray(saved)) votes = saved; } catch (e) { /* no storage */ }
    {
      const r = fromHash();
      goto(r.q, r.view, true);
      // Write the question back into the URL if it was not there. The address bar is the
      // thing people copy, and a dome root that shows question one under a URL that does
      // not say so is a link that opens somewhere else for whoever you sent it to.
      // replaceState, not a hash assignment: the entry state should not become a step
      // that Back has to walk through.
      const want = hashFor(Q.id, view);
      const modal = mode.gallery != null || mode.demo || mode.theme;
      if (C.multi && !modal && location.hash !== want && history.replaceState) {
        try { history.replaceState(null, "", want); } catch (e) { /* file:// with no history */ }
      }
    }

    (async () => {
      let db = null;
      try { db = await (root.claude && root.claude.use ? root.claude.use("db") : null); } catch (e) { db = null; }
      if (!db) { say("Shared votes aren't available in this view, so votes stay in your browser.", true); return; }
      votesCol = db.collection(C.collection); shared = true; renderStatus();
      votesCol.onSnapshot(snap => {
        const local = votes.filter(v => String(v.id).startsWith("local-"));
        votes = snap.docs.map(d => ({ ...d.data(), id: d.id })).concat(local);
        renderStandings();
      }, () => { shared = false; say("Lost the shared table, so votes stay in your browser for now.", true); });
    })();

    return {
      get votes() { return votes.slice(); },
      get question() { return Q.id; },
      next: nextDuel, vote, undo,
      go: (q, v) => {
        if (q != null && qids.indexOf(String(q).toLowerCase()) < 0) {
          throw new Error(`Thunderdome: no question "${q}"`);
        }
        location.hash = hashFor(q == null ? Q.id : String(q).toLowerCase(), v || view);
      },
    };
  }

  const api = { start, elo, fit, confidence, confidenceOpts, resampleCount, verdictFor, comments, records, votesFor, tableFor, tablesFor, tablesForDome, markdown, boards, arenas, parseMode, pickPair, pairCounts, ago, normalize, normalizeDome, parseHash, hashFor, resolveArena, mediaSpec };
  root.Thunderdome = api;
  if (typeof module === "object" && module.exports) module.exports = api;
})(typeof window !== "undefined" ? window : globalThis);

</script>
<script>

  { id: "mocha", name: "Catppuccin Mocha", dark: true, bg: "#1e1e2e", fg: "#cdd6f4", dim: "#7f849c", accent: "#89b4fa", alt: "#f5c2e7", chrome: "#181825" },
  { id: "tokyo-night", name: "Tokyo Night", dark: true, bg: "#1a1b26", fg: "#c0caf5", dim: "#565f89", accent: "#7aa2f7", alt: "#bb9af7", chrome: "#16161e" },
  { id: "gruvbox-dark", name: "Gruvbox Dark", dark: true, bg: "#282828", fg: "#ebdbb2", dim: "#928374", accent: "#fabd2f", alt: "#fe8019", chrome: "#1d2021" },

];

const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
const span = (c, s) => `<span style="color:${c}">${esc(s)}</span>`;

// Two rows of braille cells (8 dots tall) tracing a sine wave.
function braille(width, phase) {
  const H = 8, W = width * 2, grid = Array.from({ length: H }, () => Array(W).fill(0));
  for (let x = 0; x < W; x++) {
    const y = Math.round((H - 1) / 2 + Math.sin(x / 5 + phase) * 3.2);
    grid[Math.max(0, Math.min(H - 1, y))][x] = 1;
  }
  const bits = [[0x01, 0x08], [0x02, 0x10], [0x04, 0x20], [0x40, 0x80]];
  const rows = [];
  for (let r = 0; r < H / 4; r++) {
    let line = "";
    for (let c = 0; c < width; c++) {
      let v = 0;
      for (let dy = 0; dy < 4; dy++) for (let dx = 0; dx < 2; dx++) if (grid[r * 4 + dy][c * 2 + dx]) v |= bits[dy][dx];
      line += String.fromCharCode(0x2800 + v);
    }
    rows.push(line);
  }
  return rows;
}

const BUTTONS = t => `<div class="buttons">
  <span class="btn" style="background:${t.fg}14;color:${t.fg}">▸ Terminal</span>
  <span class="btn" style="background:${t.fg}14;color:${t.fg}">◎ Browser</span></div>`;

// Each candidate's `art` draws the inside of the pane for one theme.
const CANDIDATES = [
  { id: "control", name: "Today: Empty Panel", note: "The control: icon, title, two buttons", art: t => `
      <svg width="46" height="40" viewBox="0 0 46 40" aria-hidden="true"><rect x="1" y="1" width="44" height="38" rx="7" fill="${t.dim}" opacity=".55"/><path d="M11 14l7 6-7 6" stroke="${t.bg}" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M22 27h11" stroke="${t.bg}" stroke-width="3" stroke-linecap="round"/></svg>
      <div class="control-title" style="color:${t.dim}">Empty Panel</div>${BUTTONS(t)}` },
  { id: "block-small", name: "Half-block wordmark", note: "cmux in two rows of half blocks", art: t => `
      <pre class="art">${span(t.accent, "█▀▀ █▀▄▀█ █ █ ▀▄▀")}\n${span(t.accent, "█▄▄ █ ▀ █ █▄█ █ █")}</pre>${BUTTONS(t)}` },
  { id: "block-shadow", name: "ANSI Shadow wordmark", note: "Blocks in the accent, shadow dim", art: t => {
      const rows = [
        " ██████╗███╗   ███╗██╗   ██╗██╗  ██╗",

        "██║     ██╔████╔██║██║   ██║ ╚███╔╝ ",
        "██║     ██║╚██╔╝██║██║   ██║ ██╔██╗ ",
        "╚██████╗██║ ╚═╝ ██║╚██████╔╝██╔╝ ██╗",
        " ╚═════╝╚═╝     ╚═╝ ╚═════╝ ╚═╝  ╚═╝"];
      const line = r => [...r].map(ch => ch === "█" ? span(t.accent, ch) : span(t.dim, ch)).join("");
      return `<pre class="art" style="font-size:10px">${rows.map(line).join("\n")}</pre>${BUTTONS(t)}`; } },
  { id: "slant", name: "Figlet slant, two-tone", note: "Top half accent, bottom half second accent", art: t => {
      const rows = [
        "  _________ ___  __  ___  __",
        " / ___/ __ `__ \\/ / / / |/_/",
        "/ /__/ / / / / / /_/ />  <  ",
        "\\___/_/ /_/ /_/\\__,_/_/|_|  "];
      return `<pre class="art">${rows.map((r, i) => span(i < 2 ? t.accent : t.alt, r)).join("\n")}</pre>${BUTTONS(t)}`; } },
  { id: "braille", name: "Braille wave", note: "A sine wave in braille, and the shortcut", art: t => {
      const w = braille(30, 0.6);
      return `<pre class="art" style="font-size:14px;line-height:1">${span(t.accent, w[0])}\n${span(t.alt, w[1])}</pre>
        <pre class="art">${span(t.dim, "no process · ")}${span(t.fg, "⌘T")}${span(t.dim, " terminal")}</pre>${BUTTONS(t)}`; } },
  { id: "shade", name: "Shade ramp", note: "░▒▓█ cmux █▓▒░", art: t => `
      <pre class="art">${span(t.dim, "░░▒▒▓▓")}${span(t.accent, "██ cmux ██")}${span(t.dim, "▓▓▒▒░░")}</pre>${BUTTONS(t)}` },
  { id: "grid", name: "Quiet dot grid", note: "A dim field of dots around ∅ empty", art: t => {
      const rows = [];
      for (let r = 0; r < 5; r++) rows.push(Array(15).fill("·").join(" "));
      return `<pre class="art">${rows.map((r, i) => i === 2
        ? span(t.dim, "· · · · ·  ") + span(t.fg, "∅ empty") + span(t.dim, "  · · · · ·")
        : span(t.dim + "88", r)).join("\n")}</pre>${BUTTONS(t)}`; } },
  { id: "frame", name: "Box-drawn keycaps", note: "A cheat sheet in a rounded box", art: t => {
      const k = (key, label) => span(t.dim, "│  ") + span(t.accent, key.padEnd(6)) + span(t.fg, label.padEnd(20)) + span(t.dim, "│");
      return `<pre class="art">${span(t.dim, "╭────────────────────────────╮")}\n${k("⌘T", "new terminal")}\n${k("⌘⇧L", "new browser")}\n${k("⌘D", "split right")}\n${span(t.dim, "╰────────────────────────────╯")}</pre>`; } },
];

// Leo's run on the one-off page (69 votes, 2026-09-28), in the shape the results box
// exports. Those Elo numbers are sequential Elo, K = 24, which is what that page kept;
// the engine's own boards are a fitted Bradley-Terry and will read a little differently
// for the same votes. #demo draws these.
const LEO = {
  dark: [
    { id: "block-small", elo: 1558, w: 6, l: 0, t: 3 }, { id: "slant", elo: 1554, w: 5, l: 0, t: 4 },
    { id: "block-shadow", elo: 1538, w: 3, l: 0, t: 6 }, { id: "shade", elo: 1528, w: 5, l: 2, t: 2 },
    { id: "frame", elo: 1497, w: 3, l: 3, t: 3 }, { id: "grid", elo: 1477, w: 2, l: 4, t: 2 },
    { id: "braille", elo: 1450, w: 2, l: 7, t: 0 }, { id: "control", elo: 1398, w: 0, l: 10, t: 0 },
