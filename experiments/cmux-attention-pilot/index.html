<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CMUX contribution wave · Tact pilot</title>
<style>
:root{font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#203036;background:#f3f3ef}*{box-sizing:border-box}body{margin:0}button,select,a{font:inherit}button,select{cursor:pointer}a{color:#07685e;text-underline-offset:3px}button:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid #c06328;outline-offset:3px}.shell{max-width:1380px;margin:auto;display:grid;grid-template-columns:248px 1fr;min-height:100vh}aside{padding:32px 24px;border-right:1px solid #d9ded7;background:#e9ede7;position:sticky;top:0;height:100vh}.mark{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#576861}h1{font-size:29px;line-height:1.15;letter-spacing:-.035em;margin:16px 0}h2{font-size:21px;line-height:1.3;margin:0 0 10px}h3{font-size:16px;line-height:1.4;margin:0 0 8px}.sub{color:#5b6867;font-size:13px}.nav{display:flex;flex-direction:column;gap:7px;margin-top:30px}.nav button{border:0;background:transparent;text-align:left;padding:10px;border-radius:6px;color:#354b46}.nav button[aria-pressed=true]{background:#183f38;color:white}.badge{font-size:12px;font-weight:600;display:inline-block;padding:3px 8px;background:#e9eee9;border-radius:4px}.warning{background:#f5e3c8;color:#774b0d}.sidebar-foot{margin-top:30px;font-size:12px;color:#5b6867}main{padding:32px 40px 60px;min-width:0}.top{display:flex;align-items:center;justify-content:space-between;gap:20px;border-bottom:1px solid #d8ddd7;padding-bottom:22px}.top select{max-width:300px;padding:6px;border:1px solid #c4cec5;border-radius:5px;background:#fafbf8}.intro{margin:24px 0;max-width:760px}.audit-strip{display:flex;gap:16px;align-items:center;background:#f5e8d6;border-left:3px solid #b67b32;padding:14px 18px;margin:24px 0}.audit-strip button{margin-left:auto;border:0;background:none;text-decoration:underline;color:#714909;white-space:nowrap}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.card{background:#fffefa;border:1px solid #d9ded5;border-radius:9px;padding:20px;box-shadow:0 2px 3px #1c2d2305}.card .work{font-size:12px;color:#62716a;display:flex;justify-content:space-between;margin-bottom:12px}.decision{border-top:1px solid #e2e6dc;padding-top:13px;margin-top:16px}.decision p{margin:6px 0;font-size:13px}.source{display:inline-block;margin-top:8px;font-weight:600;font-size:13px}details{margin-top:10px;font-size:12px}summary{cursor:pointer;color:#46605a}.uncertain{font-size:12px;color:#7c541c}.facts{font-size:13px;overflow-wrap:anywhere}.facts p{margin:8px 0}table{width:100%;border-collapse:collapse;font-size:13px;background:#fffefa}td,th{text-align:left;padding:12px;border-bottom:1px solid #d8ddd7;vertical-align:top}th{font-size:11px;text-transform:uppercase;color:#61716a}.quiet{background:#e9eee7;padding:15px;border-radius:6px}code{font-size:11px;overflow-wrap:anywhere}.trial{margin-top:20px;border-top:1px solid #c5d0c5;padding-top:14px}.trial button{font-size:12px;padding:6px 8px;border:1px solid #b3c3b7;background:#f7f8f3;border-radius:4px;margin:4px 0}.empty{padding:30px;background:#fffefa}.error{color:#a0291d}ul{padding-left:18px}@media(max-width:1000px){.cards{grid-template-columns:1fr}main{padding:24px}.shell{grid-template-columns:220px 1fr}}@media(max-width:650px){.shell{display:block}aside{position:static;height:auto;border-right:0;padding:20px}.nav{flex-direction:row;flex-wrap:wrap;margin-top:15px}.sidebar-foot,.trial{display:none}h1{font-size:23px}.top{display:block}.top select{margin-top:10px}.audit-strip{align-items:start;flex-wrap:wrap}main{padding:20px}}
</style>
<div class="shell"><aside><div class="mark">Tact / pilot 01</div><h1>The CMUX<br>contribution wave</h1><p class="sub">What needs a decision, and the evidence behind it.</p><nav class="nav" aria-label="Views"><button data-tab="decisions" aria-pressed="true">Needs a decision</button><button data-tab="audit" aria-pressed="false">Independent audit</button><button data-tab="history" aria-pressed="false">All lines of work</button><button data-tab="events" aria-pressed="false">Source event order</button></nav><div class="sidebar-foot">Public evidence only.<br>Read-only frozen observations.<br>No merge or completion authority.</div><div class="trial"><b class="sub">Optional human trial</b><br><button id="start">Start local trial</button><br><button id="finish">Record next action</button><br><button id="download">Download trial record</button><p class="sub" id="trial-status">No human trial recorded.</p></div></aside><main><header class="top"><div><div class="mark">Review the wave</div><div id="counts" class="sub"></div></div><label class="sub">Observation<br><select id="frame" aria-label="Observation"></select></label></header><div id="content" aria-live="polite">Loading the frozen evidence…</div></main></div>
<script>
'use strict';
let frames=[], current=0, tab='decisions', trial=null;try{trial=JSON.parse(sessionStorage.getItem('tact-local-trial')||'null')}catch{}
const $=s=>document.querySelector(s), esc=s=>String(s??'unknown').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function safe(u){try{let x=new URL(u);return x.protocol==='https:'&&x.hostname==='github.com'&&!x.username}catch{return false}}
function link(u,label,cls=''){return safe(u)?`<a class="${cls}" href="${esc(u)}" rel="noopener noreferrer" data-source="${esc(u)}">${esc(label)} ↗</a>`:`<span>Evidence URL unavailable</span>`}
function record(kind,data={}){if(trial){trial.events.push({kind,at:new Date().toISOString(),elapsed_ms:Date.now()-trial.start,...data});sessionStorage.setItem('tact-local-trial',JSON.stringify(trial))}}
function decision(c){return `<section class="decision" data-decision="${esc(c.id)}"><h3>${esc(c.action)}</h3><div class="uncertain">${esc(c.certainty)}</div><p>${esc(c.why_now)}</p><p><b>Waits on this:</b> ${esc(c.waits_on.join('; '))}</p><p class="sub"><b>Owner:</b> ${esc(c.owner)}</p>${link(c.evidence[0].url,'Open current source evidence','source')}<details><summary>All evidence · ${c.evidence.length} · source identity</summary><p>Head <code>${esc(c.head)}</code><br>Observed ${esc(c.observed_at)}. A reply, check or closed thread does not establish acceptance.</p>${c.evidence.map(e=>`<p>${link(e.url,e.label)}<br>Source ${esc(e.source_at)}</p>`).join('')}</details></section>`}
function render(){history.replaceState(null,'','#'+new URLSearchParams({frame:current,view:tab}));let f=frames[current],v=f.view,a=f.audit;$('#counts').textContent=`${f.source_count} public PR histories · ${v.lines.length} lines of work · ${v.obligations.length} separate decisions`;
document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.tab===tab)));
if(tab==='decisions'){let grouped=new Map;v.obligations.forEach(c=>{if(!grouped.has(c.work))grouped.set(c.work,[]);grouped.get(c.work).push(c)});$('#content').innerHTML=`<div class="intro"><h2>${grouped.size} lines need a decision</h2><p class="sub">${v.obligations.length} distinct decisions stay separate below. These are evidence-backed requests to assess or recover work, not declarations that a fix is necessary or a merge is ready.</p></div><div class="audit-strip"><div><b>${a.alerts.length} independent audit concerns</b><br><span class="sub">Shared failures and cancelled work can stay hidden in individual PRs. Coverage is incomplete.</span></div><button id="audit-open">Inspect audit</button></div><div class="cards">${[...grouped].map(([n,cs])=>`<article class="card"><div class="work"><span>CMUX #${n}</span><span>${cs.length} decision${cs.length===1?'':'s'}</span></div><h2>${esc(cs[0].title)}</h2>${cs[0].history.length>1?`<span class="badge">One line · histories ${cs[0].history.map(x=>'#'+x).join(' → ')}</span>`:''}${cs.map(decision).join('')}</article>`).join('')||'<p class="empty">No observed obligation. Missing evidence still prevents an all-clear.</p>'}</div>`;$('#audit-open').onclick=()=>switchTab('audit')}
if(tab==='audit')$('#content').innerHTML=`<div class="intro"><h2>Independent audit</h2><p class="sub">Reads underlying GitHub reviews, check output and job steps. It does not read the obligation cards. ${esc(a.coverage)}.</p></div><div class="cards">${a.alerts.map(x=>`<article class="card"><span class="badge warning">${esc(x.kind.replaceAll('_',' '))}</span><h3 style="margin-top:12px">${esc(x.concern)}</h3><div class="facts">${Object.entries(x.measured).map(([k,v])=>`<p><b>${esc(k.replaceAll('_',' '))}:</b> ${esc(v)}</p>`).join('')}</div><p class="sub">Configured threshold: ${esc(x.threshold)}</p>${link(x.evidence[0]?.url,'Inspect source','source')}<details><summary>All ${x.evidence.length} observations</summary>${x.evidence.map(e=>`<p>${link(e.url,'PR #'+e.pr+' · '+(e.job||e.provider||e.check||'review'))}</p>`).join('')}</details></article>`).join('')}</div><details open class="quiet"><summary>What this audit cannot establish</summary><ul>${a.unknown.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></details>`;
if(tab==='history')$('#content').innerHTML=`<div class="intro"><h2>All 14 histories, 10 lines of work</h2><p class="sub">Replacements retain original histories. GitHub closure/merge does not establish rollout or delivery completion.</p></div><table><thead><tr><th>Work</th><th>Observed state</th><th>Histories</th></tr></thead><tbody>${v.lines.map(l=>`<tr><td>${link(l.url,l.title)}<br><code>${esc(l.head.slice(0,12))}</code></td><td>${esc(l.state)}${l.merged_at?' · merged':''}<br><span class="sub">Completion unknown</span></td><td>${l.history.map(n=>link('https://github.com/manaflow-ai/cmux/pull/'+n,'#'+n)).join('<br>')}</td></tr>`).join('')}</tbody></table><h3 style="margin-top:24px">Explicit relationships</h3>${v.relationships.map(e=>`<p class="sub">#${e.source} ${esc(e.kind)} #${e.target} · ${link(e.evidence,e.basis)}</p>`).join('')}<details><summary>Rules and evidence coverage as observed</summary><pre class="facts">${esc(JSON.stringify({rules:f.rules,coverage:f.coverage,owner_exports:f.owner_exports},null,2))}</pre></details>`;
if(tab==='events')$('#content').innerHTML=`<div class="intro"><h2>Frozen source event order</h2><p class="sub">${f.events.length} available events. Source timestamps determine order; ties use PR and event IDs, not inferred causality. Missing timestamps sort last. These are current API representations; replay never backdates mutable thread state or edited bodies.</p></div><table><thead><tr><th>Source time</th><th>PR / event</th><th>Evidence</th></tr></thead><tbody>${f.events.slice(-200).map(e=>`<tr><td>${esc(e.source_at||'unknown')}</td><td>#${e.pr} · ${esc(e.kind)}</td><td>${link(e.url,'Open source')}<br><code>${esc(e.id)}</code></td></tr>`).join('')}</tbody></table><p class="sub">Showing last 200. Complete event index is in the replay JSON.</p>`;
document.querySelectorAll('[data-source]').forEach(a=>a.addEventListener('click',()=>record('evidence_open',{url:a.dataset.source,decision:a.closest('[data-decision]')?.dataset.decision,tab})))}
function switchTab(next){record('view',{from:tab,to:next});tab=next;render()}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));
$('#frame').onchange=e=>{record('observation',{index:+e.target.value});current=+e.target.value;render()};
$('#start').onclick=()=>{trial={schema:'tact-attention-human-trial/v1',participant:'unidentified human; operator must attest',start:Date.now(),started_at:new Date().toISOString(),snapshot:frames[current].digest,condition:'treatment',events:[]};$('#trial-status').textContent='Local trial running. No data is sent.';record('start')};
$('#finish').onclick=()=>{if(!trial)return;const action=prompt('What is the correct next action, and why?');if(action!==null){record('next_action',{action});$('#trial-status').textContent='Action recorded locally; export for adjudication.'}};
$('#download').onclick=()=>{if(!trial)return;const out={...trial};delete out.start;let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(out,null,2)],{type:'application/json'}));a.download='tact-human-trial.json';a.click();URL.revokeObjectURL(a.href)};
fetch('/data.json').then(r=>{if(!r.ok)throw Error('Evidence unavailable');return r.json()}).then(d=>{frames=d.frames;let state=new URLSearchParams(location.hash.slice(1));current=Math.min(frames.length-1,Math.max(0,Number(state.get('frame'))||0));tab=['decisions','audit','history','events'].includes(state.get('view'))?state.get('view'):'decisions';$('#frame').innerHTML=frames.map((f,i)=>`<option value="${i}">${esc(f.view.observed_at)}</option>`).join('');$('#frame').value=String(current);render()}).catch(e=>{$('#content').textContent='Unable to load evidence: '+e.message;$('#content').className='error'});
</script></html>
