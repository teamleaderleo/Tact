<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tact Journal</title><style>
*{box-sizing:border-box}body{margin:0;font:14px system-ui;background:#f5f5f1;color:#202022}.app{display:grid;grid-template-columns:180px 1fr;min-height:100vh}aside{padding:18px 12px;background:#ecece6;border-right:1px solid #d8d8d2}.brand{font-weight:750;font-size:18px;margin:0 8px 16px}.ch,.tab{border:0;background:transparent;padding:7px 9px;border-radius:7px;cursor:pointer}.ch{display:block;width:100%;text-align:left}.ch:hover,.ch.on{background:#dcdcd5}.n{float:right;color:#888}main{max-width:980px;width:100%;padding:22px 26px 110px;margin:auto}.tabs{display:flex;gap:7px;margin-bottom:16px}.tab{border:1px solid #d1d1cb;background:#fff}.tab.on{background:#222;color:#fff}.pane{display:none}.pane.on{display:block}.entry,.card{background:#fff;border:1px solid #ddd;border-radius:9px;padding:11px 13px;margin:8px 0}.meta{font-size:12px;color:#777;display:flex;gap:8px}.body{white-space:pre-wrap;margin:6px 0}.fact{font-family:monospace}.act button{font-size:12px;border:1px solid #ddd;background:#fafafa;border-radius:5px;margin-right:5px}.composer{position:fixed;left:180px;right:0;bottom:0;padding:28px 26px 16px;background:linear-gradient(transparent,#f5f5f1 25%)}.compose,.search{max-width:980px;margin:auto;display:grid;gap:7px;grid-template-columns:110px 1fr 70px}.compose input,.compose button,.search input,.search select{font:inherit;border:1px solid #ccc;border-radius:8px;padding:9px;background:#fff}.compose button,.search button{border:0;border-radius:8px;background:#222;color:#fff}.hint,.muted{color:#777;font-size:12px}.search{grid-template-columns:1fr 115px 110px 110px 100px auto;margin:0 0 10px}.banner{background:#fff4bf;border:1px solid #e2d389;padding:8px;border-radius:7px;margin:8px 0}.prov{border-left:2px solid #ddd;padding:4px 8px;margin:3px 0}.prov.current{border-color:#222}.value{font-size:20px;margin:5px 0}details{margin-top:6px}.empty{color:#888;padding:25px 0}@media(max-width:700px){.app{display:block}aside{display:none}main{padding:14px 12px 120px}.composer{left:0;padding:28px 12px 12px}.compose{grid-template-columns:85px 1fr 62px}.search{grid-template-columns:1fr 1fr}.search>input:first-child{grid-column:1/-1}}
</style></head><body><div class="app"><aside><div class="brand">Tact Journal</div><button class="ch on" data-ch=""># all</button><div id="chs"></div></aside><main><div class="tabs"><button class="tab on" data-p="journal">Journal</button><button class="tab" data-p="retrieve">Retrieve</button><button class="tab" data-p="current">Current</button></div><section id="journal" class="pane on"><div id="feed"></div></section><section id="retrieve" class="pane"><div class="search"><input id="q" placeholder="remembered phrase or idea"><select id="mode"><option>hybrid</option><option>literal</option><option>lexical</option><option>semantic</option></select><input id="after" type="date"><input id="before" type="date"><input id="sch" placeholder="channel"><button id="go">Retrieve</button></div><label><input id="complete" type="checkbox"> complete set</label><div id="smeta"></div><div id="results"></div></section><section id="current" class="pane"><p class="muted"><code>topic := value</code> opts a message into current-state projection.</p><div id="curr"></div></section></main><div class="composer"><div class="compose"><input id="channel" list="names" value="inbox"><datalist id="names"></datalist><input id="msg" placeholder="Write anything…   topic := value for current state"><button id="send">Send</button></div><div class="compose" style="display:block"><div class="hint">Timestamp and neighboring context are automatic. Channels stay optional and shallow.</div></div></div></div><script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),fmt=t=>new Date(t).toLocaleString();let active='';async function api(u,o){let r=await fetch(u,o),j=await r.json();if(!r.ok)throw Error(j.error);return j}function entry(e){let ctx=e.neighborhood?`<details><summary>context neighborhood</summary>${e.neighborhood.map(n=>`<div class="prov ${n.match?'current':''}"><span class="muted">#${esc(n.channel)} · ${fmt(n.created_at)}</span><br>${esc(n.body??'deleted')}</div>`).join('')}</details>`:'';return `<div class="entry"><div class="meta"><span>#${esc(e.channel)}</span><span>${fmt(e.created_at)}</span><span>${e.kind==='note'?'':esc(e.kind)}</span>${e.pinned?'★':''}</div><div class="body ${e.topic_id?'fact':''}">${esc(e.body??'deleted')}</div>${ctx}<div class="act"><button onclick="pin('${e.uid}',${!e.pinned})">${e.pinned?'unpin':'pin'}</button>${!['deleted','redacted'].includes(e.kind)?`<button onclick="correct('${e.uid}',decodeURIComponent('${encodeURIComponent(e.body||'')}'))">correct</button><button onclick="redact('${e.uid}')">redact</button><button onclick="del('${e.uid}')">delete</button>`:''}</div></div>`}async function load(){let s=await api('/api/state'+(active?'?channel='+encodeURIComponent(active):''));$('#feed').innerHTML=s.entries.length?s.entries.map(entry).join(''):'<div class="empty">Capture the first thought.</div>';$('#chs').innerHTML=s.channels.map(c=>`<button class="ch ${active===c.channel?'on':''}" data-ch="${esc(c.channel)}"># ${esc(c.channel)} <span class="n">${c.n}</span></button>`).join('');$('#names').innerHTML=s.channels.map(c=>`<option value="${esc(c.channel)}">`).join('');document.querySelectorAll('.ch').forEach(b=>b.onclick=()=>{active=b.dataset.ch||'';load()})}async function send(){if(!$('#msg').value.trim())return;await api('/api/entries',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({body:$('#msg').value,channel:$('#channel').value})});$('#msg').value='';load();current()}async function pin(u,v){await api(`/api/entries/${u}/pin`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({pinned:v})});load()}async function correct(u,b){let x=prompt('Correction (keeps provenance):',b);if(x)await api(`/api/entries/${u}/correct`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({replacement:x})});load();current()}async function redact(u){let x=prompt('Replacement text; original bytes are removed:','[redacted]');if(x!==null)await api(`/api/entries/${u}/redact`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({replacement:x})});load();current()}async function del(u){if(confirm('Delete content and keep only an opaque event tombstone?'))await api(`/api/entries/${u}`,{method:'DELETE'});load();current()}async function search(){let c=$('#complete').checked,p=new URLSearchParams(),q=$('#q').value;if(q)p.set(c?'literal':'q',q);if(!c)p.set('mode',$('#mode').value);for(let id of ['after','before'])if($('#'+id).value)p.set(id,$('#'+id).value);if($('#sch').value)p.set('channel',$('#sch').value);let d=await api((c?'/api/complete?':'/api/retrieve?')+p);$('#smeta').innerHTML=c?`<div class="banner"><b>${d.count}</b> complete matches. ${esc(d.warning)}</div>`:`<p class="muted">Ranked ${d.mode}; semantic backend: ${esc(d.semantic_backend)}. Top results are plausible, never a completeness claim.</p>${d.semantic_warning?`<div class="banner">${esc(d.semantic_warning)}</div>`:''}`;$('#results').innerHTML=d.results.map(entry).join('')||'<div class="empty">No matches.</div>'}async function current(){let d=await api('/api/current');$('#curr').innerHTML=d.results.map(x=>`<div class="card"><b>${esc(x.topic)}</b><div class="value">${esc(x.value)}</div><div class="meta">effective ${fmt(x.changed_at)} · ${esc(x.current_uid.slice(0,8))}</div><details><summary>provenance · ${x.provenance.length} events</summary>${x.provenance.map(p=>`<div class="prov ${p.uid===x.current_uid?'current':''}"><span class="muted">${fmt(p.effective_at)} · ${p.kind} · ${p.uid.slice(0,8)}</span><br>${esc(p.body??'deleted')}</div>`).join('')}</details></div>`).join('')||'<div class="empty">No current facts yet.</div>'}document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===t));document.querySelectorAll('.pane').forEach(p=>p.classList.toggle('on',p.id===t.dataset.p));if(t.dataset.p==='current')current()});$('#send').onclick=send;$('#msg').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();send()}};$('#go').onclick=search;$('#q').onkeydown=e=>{if(e.key==='Enter')search()};load();current();
</script></body></html>
