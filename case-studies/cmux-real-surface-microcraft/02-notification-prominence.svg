<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860" role="img" aria-labelledby="title desc">
  <title id="title">CMUX notification prominence — current versus proposed settled unread state</title>
  <desc id="desc">A recreated CMUX workspace with sidebar and split terminal compares a broad persistent unread treatment with a proposed settled state that retains a pane ring, unread badge, and secondary status text while removing broad row lighting after the arrival moment.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity="0.32"/></filter>
    <filter id="blueGlow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="8" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="terminal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#121419"/><stop offset="1" stop-color="#0d0f13"/></linearGradient>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .kicker { font-size:12px; font-weight:700; letter-spacing:1.6px; fill:#8c94a4; }
      .title { font-size:28px; font-weight:700; fill:#f4f6fb; }
      .subtitle { font-size:14px; fill:#9ba3b4; }
      .rowTitle { font-size:13px; font-weight:650; }
      .meta { font-size:10.5px; fill:#858e9f; }
      .terminalText { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size:11px; fill:#727b8c; }
      .callout { font-size:12px; font-weight:650; fill:#dce2ee; }
      .small { font-size:11px; fill:#8e97a8; }
      .panelLabel { font-size:13px; font-weight:700; letter-spacing:1.2px; }
      .chip { font-size:11px; font-weight:700; letter-spacing:.25px; }
    </style>
  </defs>

  <rect width="1440" height="860" fill="#090a0d"/>
  <text x="64" y="58" class="kicker">CMUX / REAL SURFACE / NOTIFICATION ATTENTION</text>
  <text x="64" y="98" class="title">Let arrival yell. Let unread state persist quietly.</text>
  <text x="64" y="126" class="subtitle">Keep the receipt. Shorten the lifetime of broad high-chroma emphasis.</text>

  <rect x="1035" y="61" width="341" height="36" rx="18" fill="#151922" stroke="#2e3542"/>
  <circle cx="1057" cy="79" r="5" fill="#6a9cff"/>
  <text x="1071" y="83" class="chip" fill="#c7d7fa">ONE VARIABLE: broad emphasis duration</text>

  <!-- CURRENT -->
  <g filter="url(#shadow)">
    <rect x="64" y="170" width="638" height="550" rx="18" fill="#111319" stroke="#242833"/>
    <rect x="64" y="170" width="638" height="42" rx="18" fill="#171a20"/>
    <rect x="64" y="196" width="638" height="16" fill="#171a20"/>
    <circle cx="88" cy="191" r="5" fill="#5e636f"/><circle cx="106" cy="191" r="5" fill="#5e636f"/><circle cx="124" cy="191" r="5" fill="#5e636f"/>
    <text x="655" y="196" text-anchor="end" class="small">current settled unread</text>

    <rect x="64" y="212" width="230" height="508" fill="#15181e"/>
    <line x1="294" y1="212" x2="294" y2="720" stroke="#292d36"/>
    <text x="82" y="241" class="kicker" style="font-size:9.5px">WORKSPACES</text>

    <g transform="translate(76 255)">
      <rect width="206" height="60" rx="10" fill="transparent"/>
      <text x="10" y="22" class="rowTitle" fill="#c6cbd5">frontend-pass</text>
      <text x="10" y="40" class="meta">running · feature/header</text>
    </g>

    <!-- attention row, broad persistent light -->
    <g transform="translate(76 319)" filter="url(#blueGlow)">
      <rect width="206" height="72" rx="10" fill="#1d3157" stroke="#5f98ff" stroke-opacity="0.78"/>
      <text x="10" y="21" class="rowTitle" fill="#f6f9ff">agent-auth</text>
      <rect x="166" y="8" width="29" height="20" rx="10" fill="#6397ff"/>
      <text x="180.5" y="22" text-anchor="middle" style="font:700 10px -apple-system, sans-serif; fill:white">2</text>
      <text x="10" y="41" class="meta" style="fill:#bad0fb">Needs input</text>
      <text x="10" y="58" class="meta" style="fill:#9bb7e9">“Approve migration?”</text>
    </g>

    <g transform="translate(76 395)">
      <rect width="206" height="60" rx="10" fill="transparent"/>
      <text x="10" y="22" class="rowTitle" fill="#c6cbd5">api-tests</text>
      <text x="10" y="40" class="meta">idle · fix/retries</text>
    </g>

    <!-- terminal split -->
    <rect x="295" y="212" width="407" height="508" fill="url(#terminal)"/>
    <line x1="498" y1="212" x2="498" y2="720" stroke="#292e37"/>
    <text x="317" y="245" class="terminalText" fill="#a7afbd">frontend-pass</text>
    <text x="317" y="274" class="terminalText">$ bun test</text>
    <text x="317" y="296" class="terminalText">37 passed</text>
    <text x="522" y="245" class="terminalText" fill="#b9d1ff">agent-auth</text>
    <text x="522" y="274" class="terminalText">Migration ready.</text>
    <text x="522" y="296" class="terminalText">Approve changes? [y/N]</text>

    <!-- bright ring -->
    <rect x="504" y="222" width="188" height="488" rx="5" fill="none" stroke="#6397ff" stroke-width="3" filter="url(#blueGlow)"/>

    <rect x="350" y="548" width="287" height="104" rx="11" fill="#171c25" stroke="#303744"/>
    <text x="365" y="573" class="callout">Persistent state keeps paying for arrival</text>
    <text x="365" y="594" class="small">whole-row blue + accent edge</text>
    <text x="365" y="612" class="small">+ unread badge + bright pane ring</text>
    <text x="365" y="630" class="small">+ contextual preview</text>
  </g>

  <!-- PROPOSED -->
  <g filter="url(#shadow)">
    <rect x="738" y="170" width="638" height="550" rx="18" fill="#111319" stroke="#242833"/>
    <rect x="738" y="170" width="638" height="42" rx="18" fill="#171a20"/>
    <rect x="738" y="196" width="638" height="16" fill="#171a20"/>
    <circle cx="762" cy="191" r="5" fill="#5e636f"/><circle cx="780" cy="191" r="5" fill="#5e636f"/><circle cx="798" cy="191" r="5" fill="#5e636f"/>
    <text x="1329" y="196" text-anchor="end" class="small">proposed after ~700 ms</text>

    <rect x="738" y="212" width="230" height="508" fill="#15181e"/>
    <line x1="968" y1="212" x2="968" y2="720" stroke="#292d36"/>
    <text x="756" y="241" class="kicker" style="font-size:9.5px">WORKSPACES</text>

    <g transform="translate(750 255)">
      <rect width="206" height="60" rx="10" fill="transparent"/>
      <text x="10" y="22" class="rowTitle" fill="#c6cbd5">frontend-pass</text>
      <text x="10" y="40" class="meta">running · feature/header</text>
    </g>

    <!-- settled attention row: ordinary surface + durable compact receipts -->
    <g transform="translate(750 319)">
      <rect width="206" height="72" rx="10" fill="#20242c"/>
      <text x="10" y="21" class="rowTitle" fill="#edf1f7">agent-auth</text>
      <rect x="166" y="8" width="29" height="20" rx="10" fill="#5687e6"/>
      <text x="180.5" y="22" text-anchor="middle" style="font:700 10px -apple-system, sans-serif; fill:white">2</text>
      <text x="10" y="41" class="meta" style="fill:#9dacbf">Needs input</text>
      <text x="10" y="58" class="meta" style="fill:#808b9c">“Approve migration?”</text>
    </g>

    <g transform="translate(750 395)">
      <rect width="206" height="60" rx="10" fill="transparent"/>
      <text x="10" y="22" class="rowTitle" fill="#c6cbd5">api-tests</text>
      <text x="10" y="40" class="meta">idle · fix/retries</text>
    </g>

    <rect x="969" y="212" width="407" height="508" fill="url(#terminal)"/>
    <line x1="1172" y1="212" x2="1172" y2="720" stroke="#292e37"/>
    <text x="991" y="245" class="terminalText" fill="#a7afbd">frontend-pass</text>
    <text x="991" y="274" class="terminalText">$ bun test</text>
    <text x="991" y="296" class="terminalText">37 passed</text>
    <text x="1196" y="245" class="terminalText" fill="#aab9d3">agent-auth</text>
    <text x="1196" y="274" class="terminalText">Migration ready.</text>
    <text x="1196" y="296" class="terminalText">Approve changes? [y/N]</text>

    <!-- settled ring -->
    <rect x="1178" y="222" width="188" height="488" rx="5" fill="none" stroke="#6397ff" stroke-opacity="0.62" stroke-width="2"/>

    <rect x="1024" y="548" width="287" height="104" rx="11" fill="#171c25" stroke="#303744"/>
    <text x="1039" y="573" class="callout">Unread becomes a durable receipt</text>
    <text x="1039" y="594" class="small">static pane ring = where</text>
    <text x="1039" y="612" class="small">small badge = unread amount</text>
    <text x="1039" y="630" class="small">secondary preview = why</text>
  </g>

  <!-- temporal strip -->
  <rect x="64" y="744" width="1312" height="62" rx="13" fill="#14171d" stroke="#272c36"/>
  <text x="84" y="770" class="panelLabel" fill="#9ec0ff">ARRIVAL</text>
  <rect x="160" y="759" width="144" height="18" rx="9" fill="#244a8b"/>
  <text x="232" y="772" text-anchor="middle" style="font:650 10px -apple-system, sans-serif; fill:#d7e5ff">strong signal ~700 ms</text>
  <path d="M324 768 H445" stroke="#444b58" stroke-width="1.5"/><path d="M438 763 l8 5 -8 5" fill="none" stroke="#6f7889"/>
  <text x="470" y="770" class="panelLabel" fill="#c9ced8">UNREAD</text>
  <text x="540" y="770" class="small">compact indicators persist until handled</text>
  <text x="84" y="791" class="small">Same event model. Same destinations. Broad chroma has a shorter lifetime; the receipt stays.</text>

  <text x="64" y="838" class="small">Current side recreates CMUX's documented multi-surface attention semantics; proposed side changes the settled visual phase only.</text>
</svg>