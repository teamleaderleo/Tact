<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
  <title id="title">CMUX causal selection handoff storyboard</title>
  <desc id="desc">Four-panel storyboard comparing the current React Grab handoff with a proposed durable selection receipt, causal ribbon, and verification loop.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.28"/>
    </filter>
    <style>
      .bg { fill:#0b0d10; }
      .panel { fill:#14171c; stroke:#2d333b; stroke-width:1.5; }
      .chrome { fill:#1d2128; }
      .stage { fill:#101318; stroke:#30363d; stroke-width:1; }
      .term { fill:#0c1015; stroke:#30363d; stroke-width:1; }
      .label { fill:#8b949e; font: 600 17px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; letter-spacing:1.1px; }
      .h1 { fill:#f0f6fc; font: 700 34px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; }
      .h2 { fill:#f0f6fc; font: 700 25px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; }
      .body { fill:#c9d1d9; font: 500 17px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; }
      .small { fill:#8b949e; font: 500 14px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; }
      .mono { fill:#c9d1d9; font: 500 14px ui-monospace,SFMono-Regular,Menlo,monospace; }
      .monoDim { fill:#7d8590; font: 500 13px ui-monospace,SFMono-Regular,Menlo,monospace; }
      .bad { fill:#ff7b72; }
      .good { fill:#7ee787; }
      .accent { fill:#d2a8ff; }
      .accentStroke { stroke:#d2a8ff; }
      .blue { fill:#79c0ff; }
      .orange { fill:#ffa657; }
      .chip { fill:#242a32; stroke:#3d444d; stroke-width:1; }
      .chipHot { fill:#2b2236; stroke:#8957e5; stroke-width:1.5; }
      .dash { stroke:#6e7681; stroke-width:2; stroke-dasharray:7 7; fill:none; }
      .arrow { stroke:#8b949e; stroke-width:2; fill:none; marker-end:url(#arr); }
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/>
    </marker>
  </defs>

  <rect class="bg" width="1600" height="1120"/>
  <text class="label" x="70" y="68">TACT CASE STUDY · CMUX · 2026-09-10</text>
  <text class="h1" x="70" y="112">Keep the thing I pointed at</text>
  <text class="body" x="70" y="146">One browser selection survives terminal handoff, agent work, rebuild, and verification.</text>

  <!-- Panel 1 -->
  <g filter="url(#shadow)">
    <rect class="panel" x="60" y="190" width="720" height="390" rx="18"/>
  </g>
  <text class="label" x="90" y="230">1 · CURRENT — REAL ISSUE #10965</text>
  <text class="h2" x="90" y="265">The failure is visible. The identity thread snaps.</text>

  <rect class="stage" x="90" y="292" width="440" height="230" rx="11"/>
  <rect class="chrome" x="90" y="292" width="440" height="38" rx="11"/>
  <circle cx="111" cy="311" r="5" fill="#ff7b72"/><circle cx="127" cy="311" r="5" fill="#ffa657"/><circle cx="143" cy="311" r="5" fill="#7ee787"/>
  <text class="small" x="168" y="316">cmux diff · Unstaged</text>
  <rect x="108" y="350" width="126" height="32" rx="7" fill="#242a32" stroke="#ff7b72" stroke-width="1.5"/>
  <text class="body" x="124" y="372">Source: Unstaged</text>
  <rect x="246" y="350" width="116" height="32" rx="7" class="chip"/>
  <text class="body" x="262" y="372">Repository</text>
  <text class="small bad" x="108" y="412">click → nothing</text>
  <text class="mono" x="108" y="451">Failed to load resource: 404</text>
  <text class="mono" x="108" y="474">Failed to load resource: 404</text>
  <text class="monoDim" x="108" y="501">exact URL still missing from agent path</text>

  <rect class="term" x="550" y="292" width="200" height="230" rx="11"/>
  <text class="small" x="568" y="319">terminal</text>
  <text class="mono" x="568" y="350">$ cmux tree</text>
  <text class="monoDim" x="568" y="373">surface:7 [browser]</text>
  <text class="mono" x="568" y="408">$ browser errors</text>
  <text class="mono bad" x="568" y="431">Surface is not</text>
  <text class="mono bad" x="568" y="450">a browser</text>
  <text class="mono" x="568" y="485">$ network requests</text>
  <text class="mono bad" x="568" y="508">not_supported</text>

  <path class="dash" d="M235 543 C315 565 410 560 492 543"/>
  <text class="small" x="265" y="565">human reconnects symptom → runtime → source</text>

  <!-- Panel 2 -->
  <g filter="url(#shadow)">
    <rect class="panel" x="820" y="190" width="720" height="390" rx="18"/>
  </g>
  <text class="label" x="850" y="230">2 · PROPOSAL — SAME CMD+SHIFT+G</text>
  <text class="h2" x="850" y="265">Select once. Return with a durable receipt.</text>

  <rect class="stage" x="850" y="292" width="310" height="230" rx="11"/>
  <rect class="chrome" x="850" y="292" width="310" height="38" rx="11"/>
  <text class="small" x="872" y="316">browser · surface:7 · gen 42</text>
  <rect x="878" y="352" width="162" height="38" rx="8" fill="#2b2236" stroke="#d2a8ff" stroke-width="2"/>
  <text class="body" x="896" y="377">Source: Unstaged</text>
  <path d="M1044 353 L1118 332" class="accentStroke" stroke-width="2"/>
  <rect class="chipHot" x="1037" y="405" width="102" height="31" rx="15"/>
  <text class="mono accent" x="1052" y="426">selection:17</text>
  <text class="small" x="878" y="468">exact in gen 42</text>
  <text class="small" x="878" y="490">re-resolvable after reload</text>

  <rect class="term" x="1182" y="292" width="328" height="230" rx="11"/>
  <text class="small" x="1200" y="319">agent terminal · return surface:3</text>
  <rect class="chipHot" x="1200" y="340" width="290" height="60" rx="9"/>
  <text class="mono accent" x="1217" y="365">attached · @selection:17</text>
  <text class="small" x="1217" y="387">Source / Unstaged · surface:7 · gen 42</text>
  <text class="mono" x="1200" y="435">fix this</text>
  <text class="monoDim" x="1200" y="466">auto: URL · screenshot crop · recent</text>
  <text class="monoDim" x="1200" y="487">interaction · console/errors · cwd/git</text>
  <text class="monoDim" x="1200" y="508">+ request IDs when CDP path supports them</text>

  <!-- Panel 3 -->
  <g filter="url(#shadow)">
    <rect class="panel" x="60" y="620" width="720" height="390" rx="18"/>
  </g>
  <text class="label" x="90" y="660">3 · FOLLOW CAUSE — ONE PRIMARY STAGE</text>
  <text class="h2" x="90" y="695">Browser, request, source, edit, build share an index.</text>

  <rect class="stage" x="90" y="724" width="660" height="184" rx="11"/>
  <text class="small" x="110" y="752">selected landmark</text>
  <text class="h2" x="110" y="787">resource 404</text>
  <text class="mono" x="110" y="820">cmux-diff-viewer://…/chunks/&lt;exact-request&gt;.mjs</text>
  <text class="monoDim" x="110" y="849">candidate landing: CmuxDiffViewerURLSchemeHandler.serve()</text>
  <text class="monoDim" x="110" y="874">registeredFile(for:) miss → file-does-not-exist path</text>

  <g transform="translate(104 934)">
    <rect class="chipHot" x="0" y="0" width="108" height="36" rx="18"/><text class="small accent" x="17" y="23">selection</text>
    <path class="arrow" d="M116 18 L151 18"/>
    <rect class="chip" x="160" y="0" width="102" height="36" rx="18"/><text class="small bad" x="181" y="23">404</text>
    <path class="arrow" d="M270 18 L305 18"/>
    <rect class="chip" x="314" y="0" width="112" height="36" rx="18"/><text class="small blue" x="335" y="23">source</text>
    <path class="arrow" d="M434 18 L469 18"/>
    <rect class="chip" x="478" y="0" width="86" height="36" rx="18"/><text class="small orange" x="498" y="23">edit</text>
    <path class="arrow" d="M572 18 L607 18"/>
    <rect class="chip" x="616" y="0" width="92" height="36" rx="18"/><text class="small" x="636" y="23">build</text>
  </g>
  <text class="small" x="90" y="995">Clicking a landmark changes the stage. The terminal stays a terminal; source stays source.</text>

  <!-- Panel 4 -->
  <g filter="url(#shadow)">
    <rect class="panel" x="820" y="620" width="720" height="390" rx="18"/>
  </g>
  <text class="label" x="850" y="660">4 · VERIFY — SAME HUMAN CLAIM</text>
  <text class="h2" x="850" y="695">Resolve the saved intent in the new browser generation.</text>

  <rect class="stage" x="850" y="724" width="410" height="184" rx="11"/>
  <rect class="chrome" x="850" y="724" width="410" height="38" rx="11"/>
  <text class="small" x="872" y="749">browser · surface:7 · gen 43</text>
  <rect x="878" y="783" width="162" height="38" rx="8" fill="#17261c" stroke="#3fb950" stroke-width="2"/>
  <text class="body" x="896" y="808">Source: Unstaged</text>
  <rect x="878" y="827" width="205" height="53" rx="8" fill="#1d2128" stroke="#3d444d"/>
  <text class="small good" x="895" y="850">menu opened</text>
  <text class="small" x="895" y="870">Working tree · Staged · Branch</text>
  <text class="small good" x="1100" y="805">✓ replay</text>
  <text class="small good" x="1100" y="829">✓ 0 linked 404s</text>
  <text class="small good" x="1100" y="853">✓ visible result</text>

  <rect class="term" x="1284" y="724" width="226" height="184" rx="11"/>
  <text class="small" x="1302" y="750">claim proof</text>
  <text class="body good" x="1302" y="781">Source menu opens</text>
  <text class="monoDim" x="1302" y="810">selection:17</text>
  <text class="monoDim" x="1302" y="832">gen 42 → gen 43</text>
  <text class="monoDim" x="1302" y="854">edit:93 → build:18</text>
  <text class="monoDim" x="1302" y="876">proof one click away</text>

  <text class="small" x="850" y="942">Many-to-many boundary</text>
  <text class="monoDim" x="850" y="968">selection A ─┐                     ┌─ verify claim A</text>
  <text class="monoDim" x="850" y="989">             ├─ source → one edit/build ┤</text>
  <text class="monoDim" x="850" y="1010">selection B ─┘                     └─ verify claim B</text>

  <text class="small" x="70" y="1075">Current facts stay visible: macOS main is WebKit after the September 4 Chromium revert; replacement Chromium/CDP work is open.</text>
  <text class="small" x="1440" y="1075">— Sumi 🐙</text>
</svg>
