<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">CMUX file preview: current persistent preview and proposed Quick Look flow</title>
  <desc id="desc">A comparison showing current file activation opening a persistent focused preview tab, and a proposed Space-key transient preview that preserves file-tree selection and can be promoted into a pane tab.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#10151b"/><stop offset="1" stop-color="#090b0f"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="20" flood-opacity="0.4"/></filter>
  </defs>
  <rect width="1440" height="900" fill="url(#bg)"/>
  <text x="64" y="70" fill="#f4f5f7" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="34" font-weight="700">02 — Give CMUX preview a real Quick Look gear</text>
  <text x="64" y="104" fill="#9da6b2" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="17">Separate “inspect this file” from “keep this file living beside my terminal.”</text>

  <text x="70" y="158" fill="#ffbd9f" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="14" font-weight="700" letter-spacing="1.4">CURRENT: PREVIEW IS AN OPEN ACTION</text>
  <text x="752" y="158" fill="#a9f0c5" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="14" font-weight="700" letter-spacing="1.4">PROPOSED: SPACE = INSPECT</text>

  <!-- current -->
  <rect x="64" y="182" width="620" height="500" rx="18" fill="#151a21" stroke="#37404b"/>
  <rect x="64" y="182" width="198" height="500" rx="18" fill="#171c24"/>
  <rect x="244" y="182" width="18" height="500" fill="#171c24"/>
  <text x="86" y="220" fill="#8c96a3" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" font-weight="700">FILES</text>
  <text x="86" y="256" fill="#9ea7b3" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13">▾ artifacts</text>
  <text x="104" y="291" fill="#9ea7b3" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13">  graph.png</text>
  <rect x="82" y="307" width="164" height="34" rx="7" fill="#2f5f8e"/>
  <text x="104" y="329" fill="#ffffff" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13">  report.pdf</text>
  <text x="104" y="365" fill="#9ea7b3" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13">  clip.mov</text>
  <text x="104" y="398" fill="#9ea7b3" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13">  notes.md</text>

  <rect x="286" y="210" width="366" height="48" rx="10" fill="#202630" stroke="#394352"/>
  <text x="469" y="240" text-anchor="middle" fill="#e8ebef" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="14">Return / ⌘↓ / double-click</text>
  <path d="M469 266 L469 305" stroke="#f0a383" stroke-width="2"/><path d="M463 298 L469 306 L475 298" fill="none" stroke="#f0a383" stroke-width="2"/>

  <rect x="286" y="320" width="366" height="300" rx="12" fill="#0d1116" stroke="#4c5664"/>
  <rect x="286" y="320" width="366" height="39" rx="12" fill="#222a34"/>
  <rect x="286" y="347" width="366" height="12" fill="#222a34"/>
  <rect x="300" y="328" width="112" height="24" rx="6" fill="#35404d"/>
  <text x="356" y="345" text-anchor="middle" fill="#f2f4f6" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="12">report.pdf</text>
  <text x="307" y="389" fill="#9da6b2" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="12">persistent pane surface</text>
  <rect x="322" y="410" width="292" height="170" rx="8" fill="#f1efe7"/>
  <text x="468" y="450" text-anchor="middle" fill="#1e2430" font-family="Georgia,serif" font-size="22" font-weight="700">Native Mac daily-use pass</text>
  <line x1="352" y1="477" x2="584" y2="477" stroke="#88909a"/>
  <line x1="352" y1="499" x2="566" y2="499" stroke="#a6adb5"/>
  <line x1="352" y1="521" x2="578" y2="521" stroke="#a6adb5"/>
  <line x1="352" y1="543" x2="532" y2="543" stroke="#a6adb5"/>
  <text x="469" y="650" text-anchor="middle" fill="#f0a383" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="13">focus leaves the file tree • tab history changes</text>

  <!-- proposed -->
  <rect x="746" y="182" width="630" height="500" rx="18" fill="#151a21" stroke="#3e5c4a"/>
  <rect x="746" y="182" width="198" height="500" rx="18" fill="#171c24"/>
  <rect x="926" y="182" width="18" height="500" fill="#171c24"/>
  <text x="768" y="220" fill="#8c96a3" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" font-weight="700">FILES</text>
  <text x="768" y="256" fill="#9ea7b3" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13">▾ artifacts</text>
  <text x="786" y="291" fill="#9ea7b3" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13">  graph.png</text>
  <rect x="764" y="307" width="164" height="34" rx="7" fill="#2f5f8e" stroke="#9ecbff"/>
  <text x="786" y="329" fill="#ffffff" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13">  report.pdf</text>
  <text x="786" y="365" fill="#9ea7b3" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13">  clip.mov</text>
  <text x="786" y="398" fill="#9ea7b3" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13">  notes.md</text>
  <rect x="778" y="445" width="136" height="42" rx="9" fill="#222a34" stroke="#5f7f6b"/>
  <text x="846" y="471" text-anchor="middle" fill="#dff3e6" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="14" font-weight="650">Space</text>
  <text x="846" y="510" text-anchor="middle" fill="#8f9aa7" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="12">j / k keeps walking</text>
  <text x="846" y="529" text-anchor="middle" fill="#8f9aa7" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="12">the selected rows</text>

  <rect x="974" y="215" width="368" height="405" rx="18" fill="#202731" stroke="#729985" filter="url(#shadow)"/>
  <rect x="974" y="215" width="368" height="42" rx="18" fill="#2b333e"/>
  <rect x="974" y="245" width="368" height="12" fill="#2b333e"/>
  <text x="997" y="242" fill="#f0f3f5" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="13" font-weight="650">report.pdf</text>
  <text x="1317" y="242" text-anchor="end" fill="#9db0a3" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="12">Quick Look</text>
  <rect x="1008" y="284" width="300" height="230" rx="9" fill="#f1efe7"/>
  <text x="1158" y="326" text-anchor="middle" fill="#1e2430" font-family="Georgia,serif" font-size="22" font-weight="700">Native Mac daily-use pass</text>
  <line x1="1038" y1="354" x2="1278" y2="354" stroke="#88909a"/>
  <line x1="1038" y1="378" x2="1262" y2="378" stroke="#a6adb5"/>
  <line x1="1038" y1="402" x2="1272" y2="402" stroke="#a6adb5"/>
  <line x1="1038" y1="426" x2="1235" y2="426" stroke="#a6adb5"/>
  <rect x="1032" y="548" width="130" height="38" rx="9" fill="#303a46"/>
  <text x="1097" y="572" text-anchor="middle" fill="#e9edf1" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="12">Esc / Space closes</text>
  <rect x="1174" y="548" width="142" height="38" rx="9" fill="#385d49"/>
  <text x="1245" y="572" text-anchor="middle" fill="#f1fff6" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="12" font-weight="650">Return → Keep in pane</text>
  <text x="1158" y="650" text-anchor="middle" fill="#a9f0c5" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="13">selection stays • preview updates in place • zero tab litter</text>

  <rect x="64" y="722" width="1312" height="118" rx="16" fill="#12171d" stroke="#2b333d"/>
  <text x="88" y="755" fill="#f4f5f7" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="16" font-weight="700">CMUX-specific upgrade</text>
  <text x="88" y="788" fill="#c8ced6" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="15">Finder gives Space. CMUX can add terminal-speed j/k scanning and a one-key promotion from transient inspection to a durable pane surface.</text>
  <text x="88" y="816" fill="#8f9aa7" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="13">The renderer stays. The repeated gesture becomes learned Mac behavior.</text>
</svg>