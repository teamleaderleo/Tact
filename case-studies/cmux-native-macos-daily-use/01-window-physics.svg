<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">CMUX window ownership: current and proposed</title>
  <desc id="desc">A side-by-side diagram showing CMUX owning window drag and double-click behavior today, compared with a proposed split where AppKit owns ordinary titlebar physics and CMUX owns workbench semantics.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#11151b"/>
      <stop offset="1" stop-color="#090b0f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1440" height="900" fill="url(#bg)"/>

  <text x="64" y="70" fill="#f4f5f7" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="34" font-weight="700">01 — Let the titlebar feel boring again</text>
  <text x="64" y="104" fill="#9da6b2" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="17">Keep CMUX's integrated workbench. Give ordinary window physics back to the window.</text>

  <text x="70" y="158" fill="#ffb4a9" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="14" font-weight="700" letter-spacing="1.4">CURRENT</text>
  <text x="752" y="158" fill="#a9f0c5" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="14" font-weight="700" letter-spacing="1.4">PROPOSED OWNERSHIP SPLIT</text>

  <!-- current window -->
  <rect x="64" y="182" width="620" height="470" rx="18" fill="#171b22" stroke="#39414d" filter="url(#shadow)"/>
  <rect x="64" y="182" width="620" height="46" rx="18" fill="#222731"/>
  <rect x="64" y="210" width="620" height="18" fill="#222731"/>
  <circle cx="88" cy="205" r="7" fill="#ff5f57"/><circle cx="110" cy="205" r="7" fill="#febc2e"/><circle cx="132" cy="205" r="7" fill="#28c840"/>
  <rect x="166" y="192" width="360" height="26" rx="7" fill="#2d3440" stroke="#58616e" stroke-dasharray="6 5"/>
  <text x="346" y="210" text-anchor="middle" fill="#d9dee5" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="13">WindowDragHandleView owns empty top chrome</text>
  <rect x="535" y="191" width="132" height="28" rx="8" fill="#303642"/>
  <text x="601" y="210" text-anchor="middle" fill="#cbd1d9" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="12">sidebar controls</text>

  <rect x="64" y="228" width="154" height="424" fill="#141820"/>
  <text x="84" y="262" fill="#7e8794" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" font-weight="700">WORKSPACES</text>
  <rect x="76" y="280" width="130" height="36" rx="8" fill="#315d86"/>
  <text x="94" y="303" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="13">cmux native pass</text>
  <text x="94" y="340" fill="#a8b0bb" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="13">release work</text>
  <text x="94" y="375" fill="#a8b0bb" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="13">docs</text>

  <rect x="218" y="228" width="466" height="424" fill="#0d1116"/>
  <text x="244" y="266" fill="#7c8794" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13">$ cargo test</text>
  <text x="244" y="292" fill="#b8c2cf" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13">running 418 tests…</text>
  <text x="244" y="318" fill="#76d39b" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13">✓ window placement</text>
  <text x="244" y="344" fill="#76d39b" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13">✓ sidebar drag</text>

  <rect x="248" y="405" width="404" height="176" rx="12" fill="#171d25" stroke="#313946"/>
  <text x="270" y="435" fill="#ffb4a9" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13">configureCmuxMainWindowDragBehavior</text>
  <text x="270" y="469" fill="#e6e9ed" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14">window.isMovableByWindowBackground = false</text>
  <text x="270" y="499" fill="#e6e9ed" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14">window.isMovable = false</text>
  <text x="270" y="538" fill="#9da6b2" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="13">CMUX then owns drag hit testing + titlebar double-click behavior.</text>

  <!-- proposed window -->
  <rect x="746" y="182" width="630" height="470" rx="18" fill="#171b22" stroke="#3f5b4c" filter="url(#shadow)"/>
  <rect x="746" y="182" width="630" height="46" rx="18" fill="#242a32"/>
  <rect x="746" y="210" width="630" height="18" fill="#242a32"/>
  <circle cx="770" cy="205" r="7" fill="#ff5f57"/><circle cx="792" cy="205" r="7" fill="#febc2e"/><circle cx="814" cy="205" r="7" fill="#28c840"/>
  <rect x="845" y="190" width="324" height="30" rx="8" fill="#29313a" stroke="#62806f"/>
  <text x="1007" y="210" text-anchor="middle" fill="#dce6df" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="13">native draggable titlebar territory</text>
  <rect x="1180" y="191" width="176" height="28" rx="8" fill="#303842"/>
  <text x="1268" y="210" text-anchor="middle" fill="#d4d9df" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="12">CMUX accessory controls</text>

  <rect x="746" y="228" width="154" height="424" fill="#141820"/>
  <text x="766" y="262" fill="#7e8794" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" font-weight="700">WORKSPACES</text>
  <rect x="758" y="280" width="130" height="36" rx="8" fill="#315d86"/>
  <circle cx="776" cy="298" r="4" fill="#6fd6a0"/>
  <text x="790" y="303" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="13">cmux native pass</text>
  <text x="776" y="340" fill="#a8b0bb" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="13">release work</text>
  <text x="776" y="375" fill="#a8b0bb" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="13">docs</text>

  <rect x="900" y="228" width="476" height="424" fill="#0d1116"/>
  <rect x="932" y="267" width="412" height="124" rx="12" fill="#151b22" stroke="#334039"/>
  <text x="954" y="296" fill="#a9f0c5" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="13" font-weight="700">APPKIT OWNS</text>
  <text x="954" y="326" fill="#d4d9df" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="14">drag • activation • double-click preference • full screen</text>
  <text x="954" y="354" fill="#9da6b2" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="13">active/inactive window behavior comes along for the ride</text>

  <rect x="932" y="414" width="412" height="154" rx="12" fill="#151b22" stroke="#3d4c60"/>
  <text x="954" y="443" fill="#aac8ff" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="13" font-weight="700">CMUX OWNS</text>
  <text x="954" y="473" fill="#d4d9df" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="14">workspace + pane identity • terminal-aware chrome</text>
  <text x="954" y="501" fill="#d4d9df" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="14">semantic session restore • sidebar/tab drag semantics</text>
  <text x="954" y="535" fill="#9da6b2" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="13">Keep proven multi-display frame fixes. Shrink the emulation surface.</text>

  <!-- bottom annotation -->
  <rect x="64" y="700" width="1312" height="136" rx="16" fill="#12171d" stroke="#2b333d"/>
  <text x="88" y="733" fill="#f4f5f7" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="16" font-weight="700">The repeated-use contract</text>
  <text x="88" y="767" fill="#c8ced6" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="15">Grab any empty titlebar area. Move it. Double-click it. Full-screen it. Wake tomorrow. The frame should behave like every other Mac window.</text>
  <text x="88" y="800" fill="#8f9aa7" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="14">CMUX's custom behavior becomes visible only where the workbench genuinely needs it.</text>
</svg>