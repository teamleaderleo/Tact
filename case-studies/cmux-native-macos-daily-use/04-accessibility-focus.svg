<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">CMUX accessibility focus: current and proposed</title>
  <desc id="desc">A diagram showing visual and keyboard focus on a terminal while accessibility focus remains on the window, compared with a proposed state where all three point to the terminal text area.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#11151b"/><stop offset="1" stop-color="#090b0f"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-opacity="0.35"/></filter>
    <marker id="arrowBad" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#ee947b"/></marker>
    <marker id="arrowGood" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#7ed7a0"/></marker>
  </defs>
  <rect width="1440" height="900" fill="url(#bg)"/>
  <text x="64" y="70" fill="#f4f5f7" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="34" font-weight="700">04 — macOS should focus the terminal the user is typing into</text>
  <text x="64" y="104" fill="#9da6b2" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="17">Visual focus, keyboard focus, and Accessibility focus should describe the same input owner.</text>

  <text x="70" y="158" fill="#ffbd9f" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="14" font-weight="700" letter-spacing="1.4">CURRENT REPORTED AX FOCUS</text>
  <text x="752" y="158" fill="#a9f0c5" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="14" font-weight="700" letter-spacing="1.4">PROPOSED FOCUS CONTRACT</text>

  <!-- left visual window -->
  <rect x="64" y="186" width="384" height="384" rx="18" fill="#171c22" stroke="#3b444f" filter="url(#shadow)"/>
  <rect x="64" y="186" width="384" height="42" rx="18" fill="#242b34"/>
  <rect x="64" y="214" width="384" height="14" fill="#242b34"/>
  <circle cx="88" cy="207" r="6" fill="#ff5f57"/><circle cx="108" cy="207" r="6" fill="#febc2e"/><circle cx="128" cy="207" r="6" fill="#28c840"/>
  <rect x="80" y="244" width="106" height="310" fill="#14191f"/>
  <text x="96" y="274" fill="#7d8792" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="10" font-weight="700">WORKSPACES</text>
  <rect x="90" y="293" width="86" height="30" rx="6" fill="#315d86"/>
  <text x="101" y="313" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11">native pass</text>
  <rect x="200" y="244" width="232" height="310" fill="#0d1116" stroke="#5aa7ff" stroke-width="2"/>
  <text x="218" y="280" fill="#8d98a4" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12">$ git diff</text>
  <text x="218" y="308" fill="#c5cbd2" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12">+ focused terminal</text>
  <text x="218" y="336" fill="#c5cbd2" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12">+ selected text</text>
  <rect x="216" y="361" width="149" height="23" rx="3" fill="#385c84" opacity="0.85"/>
  <text x="222" y="378" fill="#fff" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12">copy this selection</text>
  <rect x="216" y="421" width="2" height="18" fill="#e8edf2"/>
  <text x="232" y="435" fill="#8d98a4" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12">caret is here</text>
  <text x="255" y="532" text-anchor="middle" fill="#aab2bc" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="12">visual + keyboard focus</text>

  <!-- left AX tree -->
  <rect x="478" y="186" width="206" height="384" rx="18" fill="#151a21" stroke="#3b444f"/>
  <text x="500" y="219" fill="#f0a383" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="12" font-weight="700">ACCESSIBILITY TREE</text>
  <rect x="496" y="244" width="168" height="50" rx="9" fill="#3b2a29" stroke="#a85d4b"/>
  <text x="580" y="265" text-anchor="middle" fill="#ffd7cc" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12">AXWindow</text>
  <text x="580" y="282" text-anchor="middle" fill="#ef9c85" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="10">reported focused</text>
  <line x1="580" y1="295" x2="580" y2="324" stroke="#66717e" stroke-width="2"/>
  <rect x="510" y="324" width="140" height="42" rx="8" fill="#202731"/>
  <text x="580" y="350" text-anchor="middle" fill="#aeb7c1" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11">AXScrollArea</text>
  <line x1="580" y1="366" x2="580" y2="395" stroke="#66717e" stroke-width="2"/>
  <rect x="496" y="395" width="168" height="66" rx="9" fill="#202731" stroke="#4a5968"/>
  <text x="580" y="419" text-anchor="middle" fill="#e1e5ea" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12">AXTextArea</text>
  <text x="580" y="439" text-anchor="middle" fill="#9ba6b2" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="10">AXSelectedText exists</text>
  <text x="580" y="454" text-anchor="middle" fill="#ef9c85" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="10">focus stops above it</text>
  <text x="580" y="507" text-anchor="middle" fill="#ef9c85" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11">capture tool asks Window</text>
  <text x="580" y="528" text-anchor="middle" fill="#ef9c85" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11">for selected text → empty</text>

  <!-- right visual -->
  <rect x="746" y="186" width="384" height="384" rx="18" fill="#171c22" stroke="#40604c" filter="url(#shadow)"/>
  <rect x="746" y="186" width="384" height="42" rx="18" fill="#242b34"/>
  <rect x="746" y="214" width="384" height="14" fill="#242b34"/>
  <circle cx="770" cy="207" r="6" fill="#ff5f57"/><circle cx="790" cy="207" r="6" fill="#febc2e"/><circle cx="810" cy="207" r="6" fill="#28c840"/>
  <rect x="762" y="244" width="106" height="310" fill="#14191f"/>
  <text x="778" y="274" fill="#7d8792" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="10" font-weight="700">WORKSPACES</text>
  <rect x="772" y="293" width="86" height="30" rx="6" fill="#315d86"/>
  <text x="783" y="313" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11">native pass</text>
  <rect x="882" y="244" width="232" height="310" fill="#0d1116" stroke="#63c58b" stroke-width="2"/>
  <text x="900" y="280" fill="#8d98a4" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12">$ git diff</text>
  <text x="900" y="308" fill="#c5cbd2" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12">+ focused terminal</text>
  <text x="900" y="336" fill="#c5cbd2" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12">+ selected text</text>
  <rect x="898" y="361" width="149" height="23" rx="3" fill="#385c84" opacity="0.85"/>
  <text x="904" y="378" fill="#fff" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12">copy this selection</text>
  <rect x="898" y="421" width="2" height="18" fill="#e8edf2"/>
  <text x="914" y="435" fill="#8d98a4" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12">caret is here</text>
  <text x="937" y="532" text-anchor="middle" fill="#b8dbc4" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="12">visual + keyboard + AX focus agree</text>

  <!-- right AX tree -->
  <rect x="1160" y="186" width="216" height="384" rx="18" fill="#151a21" stroke="#40604c"/>
  <text x="1182" y="219" fill="#a9f0c5" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="12" font-weight="700">ACCESSIBILITY TREE</text>
  <rect x="1178" y="244" width="180" height="42" rx="9" fill="#202731"/>
  <text x="1268" y="270" text-anchor="middle" fill="#b5bec8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12">AXWindow</text>
  <line x1="1268" y1="286" x2="1268" y2="315" stroke="#66717e" stroke-width="2"/>
  <rect x="1192" y="315" width="152" height="42" rx="8" fill="#202731"/>
  <text x="1268" y="341" text-anchor="middle" fill="#aeb7c1" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11">AXScrollArea</text>
  <line x1="1268" y1="357" x2="1268" y2="386" stroke="#66717e" stroke-width="2"/>
  <rect x="1178" y="386" width="180" height="72" rx="9" fill="#25382e" stroke="#69b986"/>
  <text x="1268" y="410" text-anchor="middle" fill="#edfff3" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12">AXTextArea</text>
  <text x="1268" y="430" text-anchor="middle" fill="#b9e5c8" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="10">AXFocused = true</text>
  <text x="1268" y="447" text-anchor="middle" fill="#b9e5c8" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="10">AXSelectedText works</text>
  <text x="1268" y="498" text-anchor="middle" fill="#a9f0c5" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11">pane switch posts focused</text>
  <text x="1268" y="518" text-anchor="middle" fill="#a9f0c5" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11">UI element changed</text>

  <!-- focus arrows -->
  <path d="M454 270 C470 240 474 240 492 260" fill="none" stroke="#ee947b" stroke-width="2.5" marker-end="url(#arrowBad)"/>
  <path d="M1136 372 C1148 372 1155 405 1174 416" fill="none" stroke="#7ed7a0" stroke-width="2.5" marker-end="url(#arrowGood)"/>

  <rect x="64" y="624" width="1312" height="216" rx="16" fill="#12171d" stroke="#2b333d"/>
  <text x="88" y="660" fill="#f4f5f7" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="16" font-weight="700">One focus, three observers</text>
  <rect x="88" y="684" width="250" height="58" rx="10" fill="#1b222a"/>
  <text x="108" y="708" fill="#dce1e6" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="13" font-weight="650">USER</text>
  <text x="108" y="729" fill="#9da6b2" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="12">“my caret is in this terminal”</text>
  <rect x="356" y="684" width="250" height="58" rx="10" fill="#1b222a"/>
  <text x="376" y="708" fill="#dce1e6" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="13" font-weight="650">CMUX</text>
  <text x="376" y="729" fill="#9da6b2" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="12">focused surface / first responder</text>
  <rect x="624" y="684" width="324" height="58" rx="10" fill="#203128" stroke="#456b52"/>
  <text x="644" y="708" fill="#dff7e7" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="13" font-weight="650">MACOS ACCESSIBILITY</text>
  <text x="644" y="729" fill="#a9d8b7" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="12">AXFocusedUIElement → same terminal</text>
  <rect x="966" y="684" width="384" height="58" rx="10" fill="#1b222a"/>
  <text x="986" y="708" fill="#dce1e6" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="13" font-weight="650">ECOSYSTEM TOOLS</text>
  <text x="986" y="729" fill="#9da6b2" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="12">selection capture • VoiceOver • automation</text>
  <text x="88" y="784" fill="#c8ced6" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="14">No new UI. No new state. One accurate focus contract makes every compatible Mac tool understand CMUX better.</text>
  <text x="88" y="814" fill="#8f9aa7" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="13">Hundredth use: invisible interoperability.</text>
</svg>