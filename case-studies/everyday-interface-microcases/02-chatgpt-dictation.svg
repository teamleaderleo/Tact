<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520"><rect width="1200" height="520" fill="#101012"/><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#f4f4f6}.muted{fill:#a9a9b2}.h{font-size:22px;font-weight:700}.s{font-size:13px}.xs{font-size:11px}.raw{fill:#efb25c;font-weight:700}.craft{fill:#8ab4ff;font-weight:700}.panel{fill:#18181c;stroke:#3a3a42;stroke-width:1}.well{fill:#25252b}.row{fill:#303037}.sel{fill:#355f8c}.line{stroke:#4b4b54;stroke-width:1}.good{fill:#72d39d}.bad{fill:#ed7b7b}</style><text x="40" y="45" class="h">ChatGPT Dictation — modality handoff while keeping the draft</text><rect x="40" y="80" rx="16" width="540" height="380" class="panel"/><rect x="620" y="80" rx="16" width="540" height="380" class="panel"/><text x="65" y="112" class="craft">CURRENT · microphone → editable transcript → send</text><text x="645" y="112" class="raw">CONTROLLED WRONG TURN · full-screen voice detour</text><rect x="65" y="140" rx="14" width="490" height="250" class="well"/><rect x="90" y="175" rx="12" width="260" height="54" class="row"/><text x="108" y="205" class="s">same chat remains visible</text><rect x="90" y="265" rx="14" width="440" height="95" class="row"/><text x="108" y="293" class="xs muted">draft</text><text x="108" y="321" class="s">I need the page to keep my place…</text><circle cx="500" cy="330" r="16" fill="#555"/><text x="494" y="335" class="xs">🎙</text><rect x="645" y="140" rx="14" width="490" height="250" fill="#17171b" stroke="#34343b"/><circle cx="890" cy="245" r="62" fill="#555762"/><text x="819" y="337" class="s muted">separate mode → Done → transcript → return</text><text x="65" y="420" class="s">Speech owns composition; text owns exact repair.</text><text x="645" y="420" class="s">Extra shell adds interruption and zero new decisions.</text></svg>